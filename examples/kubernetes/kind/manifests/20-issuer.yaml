# The issuer controller: one Deployment, its key in a Secret it creates,
# discovery and JWKS on the grant-issuer Service. Grant Pods verify
# against http://grant-issuer.fiberd-system.svc:8080.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grant-issuer
  namespace: fiberd-system
---
# Least privilege. Cluster-wide, the issuer only reads CapacityGrants and
# writes their status. It may touch Secrets in its own namespace only to
# keep its signing key. It handles grant Pods and grant Secrets only in a
# tenant namespace whose admin binds fiberd-grant-issuer-tenant there (see
# 30-grant-rbac.yaml), so it can never read Secrets in other namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fiberd-grant-issuer
rules:
  - apiGroups: [fiberd.io]
    resources: [capacitygrants]
    verbs: [get, list]
  - apiGroups: [fiberd.io]
    resources: [capacitygrants/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fiberd-grant-issuer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fiberd-grant-issuer
subjects:
  - kind: ServiceAccount
    name: grant-issuer
    namespace: fiberd-system
---
# Its signing key. Kubernetes cannot limit create to one name, so create is
# allowed in this namespace and get only for the key itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grant-issuer-key
  namespace: fiberd-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [grant-issuer-key]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grant-issuer-key
  namespace: fiberd-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grant-issuer-key
subjects:
  - kind: ServiceAccount
    name: grant-issuer
    namespace: fiberd-system
---
# What the issuer may do in a tenant namespace, bound there with a
# RoleBinding: run the grant Pod and keep its grant Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fiberd-grant-issuer-tenant
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, patch]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grant-issuer
  namespace: fiberd-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: grant-issuer }
  template:
    metadata:
      labels: { app: grant-issuer }
    spec:
      serviceAccountName: grant-issuer
      # The controller needs none of the agent's privilege. It only talks to
      # the API server, keeps its key in a Secret and serves on 8080. So it
      # runs the image (root by default for fiberd-k8s) as a non-root user,
      # with a read-only root filesystem, no capabilities and the default
      # seccomp profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: controller
          image: fiberd:kind
          imagePullPolicy: IfNotPresent
          command: [grant-controller]
          args: [-addr, ":8080", -poll, 1s]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /openid/v1/jwks, port: 8080 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: grant-issuer
  namespace: fiberd-system
spec:
  selector: { app: grant-issuer }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
