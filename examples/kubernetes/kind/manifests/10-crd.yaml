# CapacityGrant.fiberd.io/v1alpha1: the protocol's CapacityGrant plus how
# to build the grant Pod. The issuer controller (grant-controller)
# mints a signed grant per resource, projects it into the Pod it creates,
# renews it at half-life and mirrors placement and readiness into status.
# examples/kubernetes/controller/types.go is the Go view of this schema.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: capacitygrants.fiberd.io
spec:
  group: fiberd.io
  scope: Namespaced
  names:
    plural: capacitygrants
    singular: capacitygrant
    kind: CapacityGrant
    shortNames: [cg]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Pod
          type: string
          jsonPath: .status.podName
        - name: Placed
          type: boolean
          jsonPath: .status.placed
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
        - name: Expires
          type: string
          jsonPath: .status.expiresAt
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [template, fibers, pod]
              properties:
                template:
                  type: string
                  description: digest of the zygote artifact the agent's -template maps
                fibers:
                  type: object
                  required: [max]
                  properties:
                    max: { type: integer, minimum: 0 }
                    warm: { type: integer, minimum: 0 }
                wBudget:
                  type: string
                  description: per-fiber dirtied working set ceiling (32Mi)
                minTier:
                  type: string
                  enum: [FIBER_BASIC, FIBER_WARM, FIBER_CHECKPOINT, FIBER_SNAPSHOT]
                lease:
                  type: string
                  description: validity of each minted grant, renewed at half-life (default 10m)
                durability:
                  type: string
                  enum: [best-effort, sync]
                sessionClass:
                  type: string
                deviceBudget:
                  type: object
                  required: [bytes]
                  properties:
                    bytes: { type: string }
                    class: { type: string }
                pod:
                  type: object
                  required: [image]
                  properties:
                    image: { type: string }
                    runtime:
                      type: string
                      enum: [proc, runc, gvisor, hyperlight]
                    args:
                      type: array
                      items: { type: string }
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: the container's resources; its limits are the block ceiling on the Pod's cgroup
                    serviceAccountName: { type: string }
                    resourceClaims:
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    devices:
                      type: array
                      items: { type: string }
                    endpointFamily:
                      type: string
                      enum: [inet4, inet6]
                    nodeSelector:
                      type: object
                      additionalProperties: { type: string }
                    nodeName: { type: string }
                    privileged: { type: boolean }
                    unsafeAdmin: { type: boolean }
                    labels:
                      type: object
                      additionalProperties: { type: string }
                    annotations:
                      type: object
                      additionalProperties: { type: string }
            status:
              type: object
              properties:
                grantUID: { type: string }
                podName: { type: string }
                placed: { type: boolean }
                node: { type: string }
                ready: { type: boolean }
                endpoint: { type: string }
                issuedAt: { type: string }
                expiresAt: { type: string }
                message: { type: string }
