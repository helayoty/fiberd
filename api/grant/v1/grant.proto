// The grant protocol: the only cross-environment contract in fiberd.
//
// A control plane (the issuer) signs a CapacityGrant once. A home (a
// standalone host, a Kubernetes grant Pod, a Slurm allocation) verifies it
// offline and mints fibers under it through the Fibers service. Nothing on
// the Clone path calls back to the issuer.
//
// Enum value names follow the plan verbatim (SHED, CREATE, FIBER_WARM, ...)
// rather than buf's prefixed style; buf.yaml excepts those two lint rules.
syntax = "proto3";

package fiberd.grant.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/helayoty/fiberd/api/grant/v1;grantv1";

// Tier is the runtime capability a home advertises and a grant demands.
// A grant with min_tier above the home's tier is never satisfied by a
// lesser mechanism: Clone fails with FailedPrecondition, never a fresh fork.
enum Tier {
  TIER_UNSPECIFIED = 0;
  // Create a worker in an existing warm sandbox. Correct semantics,
  // pod-class latency. Every runtime qualifies.
  FIBER_BASIC = 1;
  // Zygote fork, copy-on-write. Millisecond activation and density.
  // Single-tenant per grant by definition.
  FIBER_WARM = 2;
  // Per-fiber delta checkpoint and restore. Park/resume, the session model.
  FIBER_CHECKPOINT = 3;
  // MicroVM or gVisor snapshot-restore per fiber. Multi-tenant per node.
  FIBER_SNAPSHOT = 4;
}

// Durability selects when the audit record for an operation must be
// durable. It is priced as activation latency.
enum Durability {
  DURABILITY_UNSPECIFIED = 0;
  // Append the record and ack without an fsync. A crash can lose records
  // the OS has not flushed yet.
  BEST_EFFORT = 1;
  // Ack only once the record is durable on local disk. After a failed
  // fsync, every SYNC operation fails until fiberd restarts.
  SYNC = 2;
}

// Isolation is whether the issuer trusts the grant's code with the host
// kernel. Unset is UNTRUSTED. Only a home whose backend sandboxes fibers
// from the host (gVisor, Hyperlight) may serve it. Other homes refuse the
// grant with FailedPrecondition.
enum Isolation {
  ISOLATION_UNSPECIFIED = 0;
  UNTRUSTED = 1;
  TRUSTED = 2;
}

// EndpointMode is how callers reach a grant's fibers. HANDOFF needs a
// grant bound to a caller certificate and a home whose backend can pass
// connections to fibers (proc, runc). Other homes refuse the grant with
// FailedPrecondition.
enum EndpointMode {
  // Each fiber listens on an endpoint of its own.
  DIRECT = 0;
  // The home accepts each TLS connection on one address, routes it by
  // the TLS server name (CloneResponse.routing_key) and passes the
  // socket to the fiber, which terminates TLS and accepts only the
  // grant's caller certificate.
  HANDOFF = 1;
}

// Policy is the per-grant session, durability, pressure, isolation and
// endpoint class.
message Policy {
  Durability durability = 1;
  string session_class = 2;
  string audit_class = 3;
  // PSI memory "some avg10" watermarks on the grant's cgroup, in percent.
  // The home sets them below its own eviction threshold so park fires first.
  float psi_some_avg10_shed = 4;
  float psi_some_avg10_park = 5;
  Isolation isolation = 6;
  EndpointMode endpoint_mode = 7;
}

// FiberLimits is `fibers: {max, warm}`. (Named FiberLimits rather than
// Fibers because the service below already takes that name.)
message FiberLimits {
  uint32 max = 1;
  uint32 warm = 2;
}

// DeviceBudget is the per-fiber slice of the engine's device state (its
// KV cache, its VRAM) a fiber may hold: the device-side twin of
// w_budget_bytes. On the GPU side one engine per grant owns the device
// and fibers are its clients; the engine reports each fiber's slice and
// the home enforces this budget on the report, since the kernel has no
// pressure class for devices. A home whose template offers no device of
// this class refuses the grant with FailedPrecondition, never a silent
// CPU-only fiber.
message DeviceBudget {
  uint64 bytes = 1;
  // class names the device the budget is for ("gpu"; "sim" is the
  // reference workload's simulated engine). Empty means any.
  string class = 2;
}

// CapacityGrant is what the issuer signs. It is carried as the `grant`
// claim of a JWT whose registered claims mirror issuer, audience,
// lease_expiry and grant_uid (iss, aud, exp, jti).
message CapacityGrant {
  string grant_uid = 1;
  // OIDC issuer URL of the issuing home. Verifiers discover the JWKS here.
  string issuer = 2;
  // Target environment id: the home that may exercise this grant.
  string audience = 3;
  // OCI digest of the zygote artifact, or of the template image.
  string template_digest = 4;
  // The issuer's tenant the grant belongs to (a Kubernetes namespace, a
  // Slurm account). A named session is filed under its tenant when it is
  // parked, so another tenant's grant on the same template never finds
  // it. A grant without a tenant runs anonymous fibers only: a named
  // Clone or Park under it fails with FailedPrecondition.
  string tenant = 11;
  FiberLimits fibers = 5;
  // Maximum dirtied working set per fiber, in bytes. Enforced as the
  // fiber's cgroup memory.max; also the mobility budget for deltas.
  uint64 w_budget_bytes = 6;
  Tier min_tier = 7;
  google.protobuf.Timestamp lease_expiry = 8;
  Policy policy = 9;
  // Absent or zero bytes: the grant needs no device.
  DeviceBudget device_budget = 10;
  // Per-fiber workspace ceiling in bytes. Each fiber gets a private
  // workspace at /workspace that Upload, Download and ListFiles reach.
  // Zero means no workspace, and every file call on the grant's fibers
  // fails with FailedPrecondition and a NoWorkspace detail. A home whose
  // runtime offers no workspace refuses a grant that sets it, with
  // FailedPrecondition.
  uint64 disk_budget_bytes = 12;
}

// Fence identifies one run of a fiber: (grant, fiberd epoch, seq).
// Every credential and claim is scoped to it. An epoch bump on fiberd
// restart invalidates every prior fence at once.
message Fence {
  string grant_uid = 1;
  uint64 epoch = 2;
  uint64 seq = 3;
}

// CloneRequest is the entire clone-time surface. Admission completeness is
// structural: there is no field with which to shape a workload. A request
// carrying any other field is rejected with InvalidArgument.
message CloneRequest {
  string grant_jwt = 1;
  // Optional stable identity. Empty means an anonymous, fungible fiber.
  string session = 2;
  // Hard budget for the runtime work; exceeding it is a miss, not a late fiber.
  google.protobuf.Timestamp deadline = 3;
  // Opaque, size-capped (4096 bytes), delivered as data, never config.
  bytes payload = 4;
}

enum CloneKind {
  CREATE = 0;
  ATTACH = 1;
  RESUME = 2;
}

message CloneResponse {
  string fiber_id = 1;
  string endpoint = 2;
  Fence fence = 3;
  CloneKind kind = 4;
  // Set when the grant's endpoint mode is HANDOFF. The caller opens TLS
  // to endpoint with server name "<routing_key>.fiberd", presents the
  // grant's client certificate, and accepts only the fiber's own
  // certificate. server_cert is that certificate as DER, for a TLS
  // library that pins a certificate during the handshake, and
  // server_key_sha256 is the hash (SHA-256, base64url) of its
  // SubjectPublicKeyInfo, for one that pins a key.
  string routing_key = 5;
  string server_key_sha256 = 6;
  bytes server_cert = 7;
}

// MissCode is the one thing a caller needs to decide what to do next.
enum MissCode {
  // The control plane is unreachable or the clone rate limit is exceeded.
  // Back off for retry_after_s; never queue on a dead control plane.
  SHED = 0;
  // Capacity is not on this home and the control plane is healthy.
  // Fall back to the home's ordinary provisioning path.
  DEFERRED_FALLBACK = 1;
}

// Miss is attached to every miss error as a google.rpc.Status detail.
message Miss {
  MissCode code = 1;
  uint32 retry_after_s = 2;
  string issuer = 3;
  // For DEFERRED_FALLBACK: the home that holds the session's parked
  // state, when known.
  string preferred_home = 4;
}

message ParkRequest {
  string fiber_id = 1;
  // sync: checkpoint completes before the reply; the fiber keeps running
  // until the delta is durable.
  bool sync = 2;
}

message ReleaseRequest {
  string fiber_id = 1;
  // discard: also delete any parked delta for the fiber's session.
  bool discard = 2;
}

// Status is the batched, per-grant view the home publishes. It is the
// only thing a control plane ever sees; never individual fibers.
message Status {
  string grant_uid = 1;
  uint32 running = 2;
  uint32 parked = 3;
  uint64 w_used_bytes = 4;
  Fence latest = 5;
  // pooled counts sandboxes restored ahead of a clone. They are inside
  // fibers.max and not in running.
  uint32 pooled = 6;
}

// NoWorkspace is attached as a detail to the FailedPrecondition a file
// call gets when its fiber's grant has no workspace (disk_budget_bytes is
// zero). It tells that refusal apart from a tier gap.
message NoWorkspace {}

// UploadHeader opens an Upload. It is the stream's first message and the
// only header.
message UploadHeader {
  string fiber_id = 1;
  // The file's path, relative to the fiber's /workspace.
  string path = 2;
  // The file's size in bytes, declared up front so the budget is
  // reserved before any byte lands. The data chunks add up to it
  // exactly. It must be set, and zero is an empty file.
  optional uint64 size = 3;
  // The file's permission bits. Zero means 0644.
  uint32 mode = 4;
  // Optional SHA-256 of the content, checked before the file appears.
  bytes sha256 = 5;
}

// UploadRequest is one message of an Upload stream. The first carries
// the header and every later one a data chunk of at most 1 MiB.
message UploadRequest {
  oneof part {
    UploadHeader header = 1;
    bytes data = 2;
  }
}

message DownloadRequest {
  string fiber_id = 1;
  // The file's path, relative to the fiber's /workspace.
  string path = 2;
  // Where to start reading, in bytes.
  uint64 offset = 3;
}

// FileInfo describes one entry of a workspace.
message FileInfo {
  // Relative to the fiber's /workspace.
  string path = 1;
  uint64 size = 2;
  // The permission bits.
  uint32 mode = 3;
  bool directory = 4;
  // SHA-256 of the content. Set in Upload's reply only.
  bytes sha256 = 5;
}

// FileChunk is one message of a Download stream. The first carries info
// and every chunk carries at most 1 MiB of data.
message FileChunk {
  FileInfo info = 1;
  bytes data = 2;
}

message ListFilesRequest {
  string fiber_id = 1;
  // The directory to list, relative to the fiber's /workspace. Empty is
  // the workspace itself.
  string dir = 2;
}

message ListFilesResponse {
  // The directory's entries, not recursive.
  repeated FileInfo files = 1;
}

service Fibers {
  // Clone resolves a session to attach, resume or create. Every miss
  // carries a Miss detail: ResourceExhausted for SHED, Unavailable for
  // DEFERRED_FALLBACK. FailedPrecondition when min_tier exceeds the
  // home's tier, a parked session needs a tier the home lacks, or an
  // untrusted grant reaches a home that does not isolate tenants.
  rpc Clone(CloneRequest) returns (CloneResponse);
  rpc Park(ParkRequest) returns (google.protobuf.Empty);
  rpc Release(ReleaseRequest) returns (google.protobuf.Empty);
  rpc Watch(google.protobuf.Empty) returns (stream Status);
  // Upload writes one file into a running fiber's workspace. The first
  // message is the header. Each file call is authorized like Park, so
  // another caller's fiber answers NotFound.
  rpc Upload(stream UploadRequest) returns (FileInfo);
  // Download reads one regular file from a running fiber's workspace.
  // The first chunk carries its FileInfo.
  rpc Download(DownloadRequest) returns (stream FileChunk);
  // ListFiles lists one directory of a running fiber's workspace.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
}
