# What a grant Pod's fiberd may do in the compare namespace, and what the
# issuer may do here. No phase applies this file. It goes with
# 10-grants.yaml, which waits for the controller project to mint grants
# in kind.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fiberd-grant
  namespace: compare
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fiberd-grant
  namespace: compare
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fiberd-grant
subjects:
  - kind: ServiceAccount
    name: fiberd-grant
    namespace: compare
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fiberd-grant-issuer
  namespace: compare
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fiberd-grant-issuer-tenant
subjects:
  - kind: ServiceAccount
    name: grant-issuer
    namespace: fiberd-system
