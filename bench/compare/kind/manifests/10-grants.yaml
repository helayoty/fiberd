# The fiberd homes under test, one CapacityGrant per backend, in the
# Kubernetes example's shape (examples/kubernetes/kind/manifests). Each
# home runs stock fiberd:kind and pulls its template, the static counter
# with a 32 MiB heap, from the compare registry as a zygote artifact
# (bench/compare/run/phase1.sh pushes it and renders this file: the
# @DIGEST@ placeholders are the artifacts' digests and @REGISTRY@ the
# registry as the Pods reach it). The grant the client mints at run time
# names the same digest and carries the per-instance limits (64 MiB
# wBudget, from -w-budget). The resource's own grant only keeps the Pod
# ready. Fibers are served on the Pod IP (inet4). For gvisor and runc the
# agent relays each port to the sandbox's unix socket, so those rows
# include one relay hop, about 20 to 40 us per request.
apiVersion: fiberd.io/v1alpha1
kind: CapacityGrant
metadata:
  name: compare-proc
  namespace: compare
spec:
  template: "@DIGEST_HTTP@"
  fibers: { max: 256, warm: 1 }
  wBudget: 64Mi
  minTier: FIBER_CHECKPOINT
  isolation: TRUSTED
  lease: 1h
  pod:
    image: fiberd:kind
    runtime: proc
    endpointFamily: inet4
    nodeName: compare-control-plane
    args:
      - -registry
      - "@REGISTRY@/zygotes/counter"
      - -registry-plain-http
    resources:
      limits: { memory: 4Gi }
---
apiVersion: fiberd.io/v1alpha1
kind: CapacityGrant
metadata:
  name: compare-runc
  namespace: compare
spec:
  template: "@DIGEST_HTTP@"
  fibers: { max: 256, warm: 1 }
  wBudget: 64Mi
  minTier: FIBER_CHECKPOINT
  isolation: TRUSTED
  lease: 1h
  pod:
    image: fiberd:kind
    runtime: runc
    endpointFamily: inet4
    nodeName: compare-control-plane
    args:
      - -runc-rootfs
      - /usr/share/fiberd/gvisor-rootfs
      - -registry
      - "@REGISTRY@/zygotes/counter"
      - -registry-plain-http
    resources:
      limits: { memory: 4Gi }
---
apiVersion: fiberd.io/v1alpha1
kind: CapacityGrant
metadata:
  name: compare-gvisor
  namespace: compare
spec:
  template: "@DIGEST_GVISOR@"
  fibers: { max: 64, warm: 1 }
  wBudget: 64Mi
  minTier: FIBER_SNAPSHOT
  isolation: UNTRUSTED
  lease: 1h
  pod:
    image: fiberd:kind
    runtime: gvisor
    endpointFamily: inet4
    nodeName: compare-control-plane
    args:
      - -gvisor-rootfs
      - /usr/share/fiberd/gvisor-rootfs
      - -registry
      - "@REGISTRY@/zygotes/counter"
      - -registry-plain-http
    resources:
      # A restored sandbox is about 90 MiB. The limit is the kubelet's
      # ceiling on the whole home, template and fibers.
      limits: { memory: 6Gi }
