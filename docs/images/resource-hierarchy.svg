<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1052" viewBox="0 0 1440 1052" role="img" aria-labelledby="resource-hierarchy-title resource-hierarchy-desc">
  <title id="resource-hierarchy-title">Inherited limits, shared pages, private working sets</title>
  <desc id="resource-hierarchy-desc">Two alternative backend layouts, not two backends within one grant. The expanded proc/runc example shows the capacity-home cgroup surrounding agent/ and the fiberd/grant UID subtree. The grant has memory.high and memory.max; its zygote leaf holds the warm template, and each process fiber has a separate leaf with a nonzero memory.max equal to its W budget. Dashed associations show both fibers mapping unchanged copy-on-write pages from the template. Unequal violet bars represent private W, not fixed reservations or a quantitative scale. Aggregate home CPU is shared without a per-fiber CPU split, and ancestor memory ceilings still apply. The simplified Hyperlight alternative omits the common agent and delegation subtree: one grant helper process contains the warm snapshot and micro-VM fibers. Sandbox W comes from helper reports, not from a per-fiber host-process cgroup charge. Host bookkeeping leaves are not separate sandbox process boundaries. gVisor, unlike Hyperlight, has sandbox leaves with fixed overhead and W accounting. Zero W budget means unlimited and is not illustrated.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--red:#b33b32;--red-bg:#fff0ef;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--red:#ff8178;--red-bg:#321817;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.scope{fill:none;stroke-width:1.5}.home{stroke:var(--blue)}.delegation,.leaf{stroke:var(--border)}.grant{stroke:var(--teal)}.service{fill:var(--panel);stroke:var(--teal);stroke-width:2}.template{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:2}.private{fill:var(--violet)}.mapping{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5;stroke-linejoin:round}.divider{stroke:var(--border);stroke-width:1.5}
    .title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:17px}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.violet{fill:var(--violet)}.center{text-anchor:middle}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <rect class="bg" width="1440" height="1052"/>
  <text class="title" x="48" y="66">Inherited limits, shared pages, private working sets</text>
  <text class="body muted" x="48" y="100">Which ceiling applies, and where is memory shared? W budgets limit use; they do not reserve equal slices.</text>
  <path class="divider" d="M48 130H1392"/>
  <text class="heading" x="48" y="176">proc / runc · process leaves + copy-on-write</text>
  <text class="heading" x="960" y="176">Alternative · Hyperlight</text>

  <rect class="scope home" x="48" y="202" width="864" height="626" rx="16"/>
  <text class="heading blue" x="76" y="242">Capacity-home cgroup</text>
  <text class="body" x="76" y="272">Aggregate CPU + memory limits</text>
  <rect class="scope leaf" x="76" y="306" width="202" height="164" rx="8"/>
  <text class="label" x="100" y="341">agent/</text>
  <rect class="service" x="96" y="362" width="162" height="82" rx="4"/>
  <text class="label teal" x="116" y="397">fiberd</text>
  <text class="body" x="116" y="427">agent process</text>
  <text class="label blue" x="76" y="532">CPU is shared.</text>
  <text class="body" x="76" y="564">No per-fiber split</text>
  <text class="body muted" x="76" y="597">or CPU reservation.</text>

  <rect class="scope delegation" x="308" y="296" width="572" height="500" rx="10"/>
  <text class="label" x="332" y="333">fiberd/</text>
  <rect class="scope grant" x="330" y="358" width="528" height="412" rx="10"/>
  <text class="heading teal" x="354" y="392">Grant UID /</text>
  <text class="body" x="354" y="423">memory.high + memory.max</text>
  <rect class="scope leaf" x="354" y="442" width="480" height="132" rx="8"/>
  <text class="label" x="370" y="478">zygote/</text>
  <rect class="template" x="498" y="458" width="310" height="76" rx="3"/>
  <rect class="template" x="490" y="466" width="310" height="76" rx="3"/>
  <rect class="template" x="482" y="474" width="310" height="76" rx="3"/>
  <text class="label amber" x="504" y="505">Unchanged pages</text>
  <text class="body" x="504" y="533">Shared warm template</text>

  <rect class="scope leaf" x="354" y="610" width="222" height="146" rx="8"/>
  <text class="body" x="444" y="641">f-1-1/</text>
  <circle class="fiber" cx="404" cy="683" r="26"/>
  <text class="label violet center" x="404" y="690">A</text>
  <rect class="private" x="448" y="672" width="40" height="24" rx="3"/>
  <text class="body violet" x="446" y="718">Private W</text>
  <text class="body" x="372" y="744">memory.max = W cap</text>
  <rect class="scope leaf" x="610" y="610" width="222" height="146" rx="8"/>
  <text class="body" x="700" y="641">f-1-2/</text>
  <circle class="fiber" cx="660" cy="683" r="26"/>
  <text class="label violet center" x="660" y="690">B</text>
  <rect class="private" x="704" y="672" width="100" height="24" rx="3"/>
  <text class="body violet" x="702" y="718">Private W</text>
  <text class="body" x="628" y="744">memory.max = W cap</text>
  <path class="mapping" d="M640 550V588H404V657"/>
  <path class="mapping" d="M640 588H660V657"/>
  <circle cx="640" cy="588" r="3" fill="var(--amber)"/>
  <text class="body amber" x="684" y="599">COW mappings</text>

  <rect class="scope home" x="960" y="202" width="432" height="626" rx="16"/>
  <text class="heading blue" x="984" y="242">Capacity-home cgroup</text>
  <text class="body" x="984" y="272">Same aggregate limits</text>
  <rect class="scope grant" x="984" y="296" width="384" height="500" rx="10"/>
  <text class="heading teal" x="1008" y="332">Grant cgroup</text>
  <text class="body" x="1008" y="364">memory.high + memory.max</text>
  <rect class="service" x="1008" y="394" width="336" height="374" rx="4"/>
  <text class="label teal" x="1032" y="429">One helper process</text>
  <rect class="template" x="1040" y="451" width="280" height="88" rx="3"/>
  <rect class="template" x="1032" y="459" width="280" height="88" rx="3"/>
  <text class="label amber" x="1056" y="496">Warm snapshot</text>
  <text class="body" x="1056" y="527">Reusable guest state</text>
  <circle class="fiber" cx="1112" cy="626" r="40"/>
  <text class="label violet center" x="1112" y="633">A</text>
  <circle class="fiber" cx="1240" cy="626" r="40"/>
  <text class="label violet center" x="1240" y="633">B</text>
  <text class="label violet" x="1032" y="703">Micro-VM fibers</text>
  <text class="body" x="1032" y="735">W reported by the helper</text>

  <text class="heading" x="48" y="882">W caps are ceilings, not preallocated slices.</text>
  <text class="body" x="48" y="918">Bars show unequal private use; unchanged COW pages remain shared.</text>
  <text class="body muted" x="48" y="951">Ancestor limits surround the agent, template, helpers, and all fibers.</text>
  <text class="body muted" x="48" y="984">Explicit, nonzero W budgets are illustrated.</text>
  <text class="label" x="960" y="882">No per-fiber host process</text>
  <text class="body" x="960" y="918">No process leaf per sandbox</text>
  <text class="body muted" x="960" y="967">gVisor instead uses sandbox leaves</text>
  <text class="body muted" x="960" y="998">with fixed overhead + W accounting.</text>
</svg>
