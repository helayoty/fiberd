<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="resources-title resources-desc">
  <title id="resources-title">fiberd resource hierarchy and memory outcomes</title>
  <desc id="resources-desc">A capacity-home cgroup contains the fiberd agent and grant subtree. The grant contains a warm template, backend overhead, and running fibers. Process backends use fiber leaf cgroups; Hyperlight sandboxes share the helper in the grant cgroup and report working set. Four cases illustrate normal unequal use, one fiber exceeding its budget, aggregate grant pressure, and parent enforcement.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--red:#b33b32;--red-bg:#fff0ef;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--red:#ff8178;--red-bg:#321817;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.home{fill:var(--blue-bg);stroke:var(--blue);stroke-width:2}.grant{fill:var(--teal-bg);stroke:var(--teal);stroke-width:2}.violetbox{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.amberbox{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.redbox{fill:var(--red-bg);stroke:var(--red);stroke-width:1.5}.greenbox{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.cap{font-size:12px;font-weight:700;letter-spacing:.5px}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.red{fill:var(--red)}.green{fill:var(--green)}.barbg{fill:var(--bg);stroke:var(--line)}.barwarm{fill:var(--amber)}.barfiber{fill:var(--violet)}.barover{fill:var(--muted)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}
  </style>
  <defs><marker id="resources-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#7b8794"/></marker></defs>
  <rect class="bg" width="1200" height="780"/>
  <text class="title" x="42" y="48">Resource hierarchy: aggregate capacity, bounded working sets</text>
  <text class="subtitle" x="42" y="74">Ancestor limits always win. W budgets are ceilings, not equal reservations; the backend determines how each fiber is measured.</text>
  <rect class="home" x="42" y="106" width="1116" height="330" rx="23"/>
  <text class="h blue" x="70" y="140">CAPACITY-HOME CGROUP</text>
  <text class="s" x="1128" y="140" text-anchor="end">aggregate CPU + memory ceiling around agent, template, helpers, and fibers</text>
  <rect class="panel" x="70" y="188" width="150" height="100" rx="15"/>
  <text class="h" x="145" y="221" text-anchor="middle">agent/</text><text class="b" x="145" y="253" text-anchor="middle">fiberd</text>
  <rect class="grant" x="260" y="168" width="868" height="235" rx="19"/>
  <text class="cap teal" x="286" y="200">GRANT CGROUP</text>
  <text class="s" x="1102" y="200" text-anchor="end">memory.high + memory.max · shared CPU pool</text>
  <rect class="amberbox" x="286" y="229" width="176" height="122" rx="14"/>
  <text class="h amber" x="374" y="260" text-anchor="middle">Warm template</text><text class="b" x="374" y="291" text-anchor="middle">base footprint</text><text class="s" x="374" y="318" text-anchor="middle">shared COW pages</text><text class="s" x="374" y="337" text-anchor="middle">on proc / runc</text>
  <rect class="violetbox" x="492" y="229" width="250" height="122" rx="14"/>
  <text class="h violet" x="617" y="260" text-anchor="middle">Process fibers</text><text class="b" x="617" y="291" text-anchor="middle">proc / runc leaf cgroups</text><text class="s" x="617" y="318" text-anchor="middle">leaf memory.max + W enforcement</text><text class="s" x="617" y="337" text-anchor="middle">fiber A · fiber B · + N</text>
  <rect class="violetbox" x="772" y="229" width="204" height="122" rx="14"/>
  <text class="h violet" x="874" y="260" text-anchor="middle">Sandbox fibers</text><text class="b" x="874" y="291" text-anchor="middle">backend-specific</text><text class="s" x="874" y="318" text-anchor="middle">Hyperlight: helper reports W</text><text class="s" x="874" y="337" text-anchor="middle">no fiber process / leaf</text>
  <rect class="panel" x="1006" y="229" width="96" height="122" rx="14"/>
  <text class="h" x="1054" y="266" text-anchor="middle">Fixed</text><text class="h" x="1054" y="286" text-anchor="middle">overhead</text><text class="s" x="1054" y="319" text-anchor="middle">backend</text><text class="s" x="1054" y="337" text-anchor="middle">dependent</text>
  <path class="arrow" d="M220 238h40" marker-end="url(#resources-arrow)"/>
  <text class="s" x="600" y="388" text-anchor="middle">Every descendant remains subject to the grant and capacity-home ceilings.</text>

  <text class="cap" x="42" y="478">ILLUSTRATIVE MEMORY OUTCOMES</text>
  <rect class="panel" x="42" y="500" width="260" height="226" rx="17"/>
  <text class="h green" x="64" y="532">1 · Normal use</text><text class="s" x="64" y="556">unequal W with shared headroom</text>
  <rect class="barbg" x="64" y="584" width="216" height="36" rx="8"/><rect class="barwarm" x="64" y="584" width="54" height="36" rx="8"/><rect class="barfiber" x="118" y="584" width="32" height="36"/><rect class="barfiber" x="150" y="584" width="62" height="36" opacity=".75"/><rect class="barover" x="212" y="584" width="22" height="36"/>
  <text class="b" x="172" y="658" text-anchor="middle">no equal split or reservation</text><text class="s" x="172" y="684" text-anchor="middle">actual charge follows workload + backend</text>
  <rect class="panel" x="326" y="500" width="260" height="226" rx="17"/>
  <text class="h red" x="348" y="532">2 · Fiber budget</text><text class="s" x="348" y="556">one running fiber exceeds its W ceiling</text>
  <rect class="violetbox" x="354" y="584" width="52" height="78" rx="9"/><rect class="redbox" x="430" y="570" width="52" height="92" rx="9"/><rect class="violetbox" x="506" y="592" width="52" height="70" rx="9"/>
  <text class="b" x="380" y="630" text-anchor="middle">A</text><text class="b red" x="456" y="622" text-anchor="middle">B</text><text class="b" x="532" y="634" text-anchor="middle">C</text>
  <text class="b red" x="456" y="688" text-anchor="middle">B exits as OOM</text><text class="s" x="456" y="710" text-anchor="middle">other fibers continue</text>
  <rect class="panel" x="610" y="500" width="260" height="226" rx="17"/>
  <text class="h amber" x="632" y="532">3 · Grant pressure</text><text class="s" x="632" y="556">aggregate input crosses watermarks</text>
  <rect class="amberbox" x="638" y="584" width="204" height="34" rx="12"/><text class="b amber" x="740" y="607" text-anchor="middle">SHED new CREATE / RESUME</text>
  <path class="arrow" d="M740 618v26" marker-end="url(#resources-arrow)"/>
  <rect class="amberbox" x="638" y="650" width="204" height="34" rx="12"/><text class="b amber" x="740" y="673" text-anchor="middle">RECLAIM largest W</text>
  <text class="s" x="740" y="710" text-anchor="middle">persistent + no victim → YIELD</text>
  <rect class="panel" x="894" y="500" width="264" height="226" rx="17"/>
  <text class="h red" x="916" y="532">4 · Parent limit</text><text class="s" x="916" y="556">total home use reaches memory.max</text>
  <rect class="home" x="922" y="584" width="208" height="91" rx="13"/><rect class="grant" x="944" y="607" width="164" height="44" rx="9"/>
  <path d="M922 584h208" stroke="var(--red)" stroke-width="6" stroke-linecap="round"/>
  <text class="b red" x="1026" y="704" text-anchor="middle">ancestor enforcement can still occur</text>
  <text class="s" x="600" y="760" text-anchor="middle">Illustrative proportions only. Exact leaf limits and W measurement differ by backend; the home remains the outer stop.</text>
</svg>
