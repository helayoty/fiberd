<svg xmlns="http://www.w3.org/2000/svg" width="780" height="580" viewBox="0 0 780 580" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/></marker>
  </defs>
  <rect width="780" height="580" fill="#ffffff"/>

  <polyline points="260,196 18,196 18,540 250,540" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwr)"/>
  <text x="24" y="214" font-size="11" fill="#b85450">S parked, but</text>
  <text x="24" y="228" font-size="11" fill="#b85450">no CHECKPOINT</text>

  <rect x="250" y="20" width="280" height="44" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="390" y="47" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Clone(grant, deadline, session S?)</text>

  <rect x="230" y="92" width="320" height="48" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="390" y="121" text-anchor="middle" font-size="13" fill="#1a1a1a">Verify capability (offline) + take budget token</text>

  <rect x="580" y="94" width="170" height="44" rx="6" fill="#f8cecc" stroke="#b85450"/>
  <text x="665" y="121" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">SHED - 429 + Retry-After</text>

  <polygon points="390,168 520,196 390,224 260,196" fill="#fff2cc" stroke="#d6b656"/>
  <text x="390" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">Look up session S in ledger</text>

  <rect x="40" y="274" width="200" height="74" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="140" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">ATTACH</text>
  <text x="140" y="318" text-anchor="middle" font-size="11" fill="#1a1a1a">reuse fence + endpoint</text>
  <text x="140" y="334" text-anchor="middle" font-size="11" fill="#1a1a1a">~0 ms</text>

  <rect x="290" y="274" width="200" height="74" rx="6" fill="#b0e3e6" stroke="#0e8088"/>
  <text x="390" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">RESUME</text>
  <text x="390" y="318" text-anchor="middle" font-size="11" fill="#1a1a1a">mint fence, restore delta</text>
  <text x="390" y="334" text-anchor="middle" font-size="11" fill="#1a1a1a">sub-second</text>

  <rect x="540" y="274" width="200" height="74" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="640" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">CREATE</text>
  <text x="640" y="318" text-anchor="middle" font-size="11" fill="#1a1a1a">mint fence, fork zygote</text>
  <text x="640" y="334" text-anchor="middle" font-size="11" fill="#1a1a1a">~4 ms</text>

  <rect x="290" y="430" width="200" height="48" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="390" y="459" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">endpoint + fence</text>

  <rect x="250" y="516" width="280" height="48" rx="6" fill="#f8cecc" stroke="#b85450" stroke-dasharray="5 3"/>
  <text x="390" y="537" text-anchor="middle" font-size="11" fill="#1a1a1a">sub-CHECKPOINT runtime: fail loudly,</text>
  <text x="390" y="552" text-anchor="middle" font-size="11" fill="#1a1a1a">never a silent fresh fork</text>

  <polyline points="390,64 390,92" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <polyline points="550,116 580,116" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arwr)"/>
  <text x="565" y="86" text-anchor="middle" font-size="11" fill="#b85450">over budget /</text>
  <text x="565" y="99" text-anchor="middle" font-size="11" fill="#b85450">bad capability</text>
  <polyline points="390,140 390,168" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>

  <polyline points="390,224 390,250" fill="none" stroke="#333" stroke-width="1.4"/>
  <polyline points="140,250 640,250" fill="none" stroke="#333" stroke-width="1.4"/>
  <polyline points="140,250 140,274" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arw)"/>
  <polyline points="390,250 390,274" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arw)"/>
  <polyline points="640,250 640,274" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="140" y="266" text-anchor="middle" font-size="11" fill="#333">S running</text>
  <text x="390" y="266" text-anchor="middle" font-size="11" fill="#333">S parked</text>
  <text x="640" y="266" text-anchor="middle" font-size="11" fill="#333">S unknown / anonymous</text>

  <polyline points="140,348 140,454 290,454" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arw)"/>
  <polyline points="390,348 390,430" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arw)"/>
  <polyline points="640,348 640,454 490,454" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arw)"/>
</svg>
