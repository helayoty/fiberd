<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890" role="img" aria-labelledby="clone-resolution-title clone-resolution-desc">
  <title id="clone-resolution-title">What does Clone do with this session?</title>
  <desc id="clone-resolution-desc">Preflight verifies and admits the grant, takes a rate token, locates named state, and checks ledger eligibility. A running named session selects ATTACH: audit and return the same endpoint and fence, bypassing the new-work gate and runtime creation. Parked state selects RESUME, never CREATE as a substitute for missing checkpoint support. An unknown name or anonymous request selects CREATE. Both new-work actions require a live slot and no shedding before the runtime forks or restores, then audit precedes commit and the endpoint is returned with a new fence. Preflight rejection or unavailable new work leads to refusal. Later runtime, audit, and commit failures can also refuse; exact outcomes and rollback caveats belong to the protocol reference, not this action-selection diagram.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed;--red:#b33b32;--red-bg:#fff0ef}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e;--red:#ff8178;--red-bg:#321817}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:18px}.muted{fill:var(--muted)}.center{text-anchor:middle}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}.red{fill:var(--red)}
    .divider{fill:none;stroke:var(--border);stroke-width:1.5}.operation{fill:var(--panel);stroke:var(--teal);stroke-width:2}.decision{fill:var(--teal-bg);stroke:var(--teal);stroke-width:2}.selection{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.gate{fill:var(--amber-bg);stroke:var(--amber);stroke-width:2}.result{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.refusal{fill:var(--red-bg);stroke:var(--red);stroke-width:1.5}
    .flow{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.normal{stroke:var(--teal)}.choose{stroke:var(--violet)}.reject{stroke:var(--red)}.success{stroke:var(--green)}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs>
    <marker id="clone-resolution-teal-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--teal)"/></marker>
    <marker id="clone-resolution-violet-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--violet)"/></marker>
    <marker id="clone-resolution-green-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--green)"/></marker>
    <marker id="clone-resolution-red-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--red)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="890"/>
  <text class="title" x="48" y="66">What does Clone do with this session?</text>
  <text class="body muted" x="48" y="100">Session resolution, not the full error reference.</text>
  <path class="divider" d="M48 130H1392"/>

  <rect class="operation" x="48" y="170" width="360" height="132" rx="4"/>
  <text class="heading teal" x="72" y="210">Preflight</text>
  <text class="body" x="72" y="245">Verified + admitted grant</text>
  <text class="body" x="72" y="276">Rate budget · named lookup</text>
  <path class="flow normal" d="M408 236H472" marker-end="url(#clone-resolution-teal-arrow)"/>
  <path class="decision" d="M658 162L844 236L658 310L472 236Z"/>
  <text class="heading teal center" x="658" y="244">Session?</text>

  <path class="flow normal" d="M844 236H1036" marker-end="url(#clone-resolution-teal-arrow)"/>
  <text class="heading teal center" x="940" y="214">Running</text>
  <rect class="operation" x="1036" y="174" width="356" height="102" rx="4"/>
  <text class="heading teal" x="1060" y="212">ATTACH</text>
  <text class="body" x="1060" y="246">Audit · no new runtime</text>
  <path class="flow success" d="M1214 276V338" marker-end="url(#clone-resolution-green-arrow)"/>
  <rect class="result" x="1036" y="338" width="356" height="64" rx="32"/>
  <text class="heading green center" x="1214" y="378">Same endpoint + fence</text>

  <path class="flow choose" d="M565 273V420" marker-end="url(#clone-resolution-violet-arrow)"/>
  <text class="heading violet" x="454" y="378">Parked</text>
  <path class="flow choose" d="M751 273V374H916V420" marker-end="url(#clone-resolution-violet-arrow)"/>
  <text class="body violet" x="772" y="354">Unknown / anonymous</text>
  <rect class="selection" x="442" y="420" width="246" height="88" rx="4"/>
  <text class="heading violet" x="466" y="456">RESUME</text>
  <text class="body" x="466" y="487">Parked state selected</text>
  <rect class="selection" x="793" y="420" width="246" height="88" rx="4"/>
  <text class="heading violet" x="817" y="456">CREATE</text>
  <text class="body" x="817" y="487">Warm template selected</text>
  <path class="flow choose" d="M565 508V558H740V580" marker-end="url(#clone-resolution-violet-arrow)"/>
  <path class="flow choose" d="M916 508V558H740"/>
  <circle cx="740" cy="558" r="3" fill="var(--violet)"/>

  <path class="gate" d="M740 580L905 640L740 700L575 640Z"/>
  <text class="heading amber center" x="740" y="632">Can activate?</text>
  <text class="body center" x="740" y="658">Slot + no shedding</text>
  <path class="flow reject" d="M228 302V592" marker-end="url(#clone-resolution-red-arrow)"/>
  <text class="body red" x="248" y="438">Rejected</text>
  <path class="flow reject" d="M575 640H312" marker-end="url(#clone-resolution-red-arrow)"/>
  <text class="body red" x="358" y="621">Unavailable</text>
  <rect class="refusal" x="48" y="592" width="264" height="100" rx="32"/>
  <text class="heading red" x="72" y="633">Refuse</text>
  <text class="body" x="72" y="666">See protocol outcomes</text>

  <path class="flow normal" d="M740 700V718H548V744" marker-end="url(#clone-resolution-teal-arrow)"/>
  <text class="body teal" x="760" y="723">Yes</text>
  <rect class="operation" x="408" y="744" width="280" height="96" rx="4"/>
  <text class="heading teal" x="432" y="782">Runtime work</text>
  <text class="body" x="432" y="814">Fork or restore</text>
  <path class="flow normal" d="M688 792H748" marker-end="url(#clone-resolution-teal-arrow)"/>
  <rect class="operation" x="748" y="744" width="280" height="96" rx="4"/>
  <text class="heading teal center" x="888" y="800">Audit → commit</text>
  <path class="flow success" d="M1028 792H1088" marker-end="url(#clone-resolution-green-arrow)"/>
  <rect class="result" x="1088" y="744" width="304" height="96" rx="32"/>
  <text class="heading green center" x="1240" y="783">Endpoint +</text>
  <text class="heading green center" x="1240" y="814">new fence</text>

  <text class="body muted" x="48" y="876">Any step can refuse; exact outcomes and rollback behavior are defined in the protocol.</text>
</svg>
