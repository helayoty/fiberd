<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="Helvetica Neue, Arial, sans-serif">
  <title>The backend seam</title>
  <desc>Consumers call Clone on the grant protocol; the agent and ledger decide; one host runtime owns cgroups, W, deltas, parity and the registry; the backend interface (Warm, Clone, Park, Resume, Kill, Exits) is implemented by proc, gVisor, runc and Hyperlight; parity facts on every checkpoint include the backend name.</desc>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker>
  </defs>
  <rect width="680" height="500" fill="#ffffff"/>

  <rect x="40" y="40" width="600" height="54" rx="8" fill="#ede7f6" stroke="#7e57c2" stroke-width="0.8"/>
  <text x="340" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#311b92">consumers: Knative activator · Kata-shaped shim · Substrate herder</text>
  <text x="340" y="79" text-anchor="middle" font-size="12" fill="#4527a0">call Clone(grant, session) and act on SHED / DEFERRED_FALLBACK</text>
  <line x1="340" y1="96" x2="340" y2="110" stroke="#555" stroke-width="0.8" marker-end="url(#arw)"/>

  <rect x="40" y="114" width="600" height="54" rx="8" fill="#e6f1fb" stroke="#4a86c8" stroke-width="0.8"/>
  <text x="340" y="135" text-anchor="middle" font-size="14" font-weight="600" fill="#0c447c">agent + ledger (pkg/core)</text>
  <text x="340" y="153" text-anchor="middle" font-size="12" fill="#1d5a9a">grants · fences · budget · pressure ladder · audit · mobility decisions</text>
  <line x1="340" y1="170" x2="340" y2="184" stroke="#555" stroke-width="0.8" marker-end="url(#arw)"/>

  <rect x="40" y="188" width="600" height="54" rx="8" fill="#e0f2f1" stroke="#26a69a" stroke-width="0.8"/>
  <text x="340" y="209" text-anchor="middle" font-size="14" font-weight="600" fill="#004d40">host runtime (pkg/runtime/host) · one core.Runtime for every backend</text>
  <text x="340" y="227" text-anchor="middle" font-size="12" fill="#00695c">cgroup leaves + ceilings · W · parent store + delta manifests · delta registry · parity · orphans</text>
  <line x1="340" y1="244" x2="340" y2="258" stroke="#555" stroke-width="0.8" marker-end="url(#arw)"/>

  <rect x="40" y="262" width="600" height="54" rx="8" fill="#fff3e0" stroke="#ef9a3c" stroke-width="0.8"/>
  <text x="340" y="283" text-anchor="middle" font-size="14" font-weight="600" fill="#7a3e00">backend.Backend: Warm · Clone · Park · Resume · Kill · Exits</text>
  <text x="340" y="301" text-anchor="middle" font-size="12" fill="#9a5b12">optional: SelfCheckpointer (parent for deltas) · DeltaCodec (strip / merge parent pages)</text>

  <line x1="115" y1="318" x2="115" y2="336" stroke="#555" stroke-width="0.8" marker-end="url(#arw)"/>
  <line x1="265" y1="318" x2="265" y2="336" stroke="#555" stroke-width="0.8" marker-end="url(#arw)"/>
  <line x1="415" y1="318" x2="415" y2="336" stroke="#555" stroke-width="0.8" marker-end="url(#arw)"/>
  <line x1="565" y1="318" x2="565" y2="336" stroke="#555" stroke-width="0.8" marker-end="url(#arw)"/>

  <rect x="45" y="340" width="140" height="66" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="0.8"/>
  <text x="115" y="361" text-anchor="middle" font-size="14" font-weight="600" fill="#1b5e20">proc</text>
  <text x="115" y="378" text-anchor="middle" font-size="12" fill="#2e7d32">fork zygote + CRIU</text>
  <text x="115" y="394" text-anchor="middle" font-size="12" fill="#2e7d32">FIBER_CHECKPOINT</text>

  <rect x="195" y="340" width="140" height="66" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="0.8"/>
  <text x="265" y="361" text-anchor="middle" font-size="14" font-weight="600" fill="#1b5e20">runc</text>
  <text x="265" y="378" text-anchor="middle" font-size="12" fill="#2e7d32">zygote in a bundle</text>
  <text x="265" y="394" text-anchor="middle" font-size="12" fill="#2e7d32">FIBER_CHECKPOINT</text>

  <rect x="345" y="340" width="140" height="66" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="0.8"/>
  <text x="415" y="361" text-anchor="middle" font-size="14" font-weight="600" fill="#1b5e20">gVisor</text>
  <text x="415" y="378" text-anchor="middle" font-size="12" fill="#2e7d32">runsc snapshots</text>
  <text x="415" y="394" text-anchor="middle" font-size="12" fill="#2e7d32">FIBER_SNAPSHOT</text>

  <rect x="495" y="340" width="140" height="66" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="0.8"/>
  <text x="565" y="361" text-anchor="middle" font-size="14" font-weight="600" fill="#1b5e20">Hyperlight</text>
  <text x="565" y="378" text-anchor="middle" font-size="12" fill="#2e7d32">micro-VMs, on KVM</text>
  <text x="565" y="394" text-anchor="middle" font-size="12" fill="#2e7d32">FIBER_SNAPSHOT</text>

  <rect x="40" y="426" width="600" height="54" rx="8" fill="#fafafa" stroke="#757575" stroke-width="0.8"/>
  <text x="340" y="447" text-anchor="middle" font-size="14" font-weight="600" fill="#212121">parity facts on every checkpoint: arch · kernel · libc · backend</text>
  <text x="340" y="465" text-anchor="middle" font-size="12" fill="#424242">a delta from one backend is never offered to another; the miss names the home that has it</text>
</svg>
