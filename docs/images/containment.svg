<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="824" viewBox="0 0 1440 824" role="img" aria-labelledby="containment-title containment-desc">
  <title id="containment-title">One home, one agent, separate grant scopes</title>
  <desc id="containment-desc">A containment view, not a request sequence. One home contains a single fiberd agent and two illustrated sibling grant scopes. Each admitted grant owns one warm template and its own fiber set; the agent is outside both grants and manages both. Grant A illustrates two running fibers; grant B illustrates one. These are example instance counts, not reservations. The home supplies aggregate capacity, and grants carry their own lease and policy. Nesting shows resource ownership, not a claim that every grant or fiber has its own container or security boundary: workload isolation is backend-specific.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.scope{fill:none;stroke-width:1.5}.home{stroke:var(--blue)}.grant{stroke:var(--teal);stroke-dasharray:9 6}.service{fill:var(--panel);stroke:var(--teal);stroke-width:2}.template{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:2}.divider{stroke:var(--border);stroke-width:1.5}
    .title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:17px}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.violet{fill:var(--violet)}.center{text-anchor:middle}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <rect class="bg" width="1440" height="824"/>
  <text class="title" x="48" y="66">One home, one agent, separate grant scopes</text>
  <text class="body muted" x="48" y="100">What lives inside what? Each grant owns a template and its fiber set — not another agent.</text>
  <path class="divider" d="M48 130H1392"/>

  <rect class="scope home" x="48" y="164" width="1344" height="588" rx="18"/>
  <text class="heading blue" x="80" y="205">Home</text>
  <text class="body muted" x="174" y="205">Aggregate capacity · environment scope</text>

  <rect class="service" x="80" y="260" width="264" height="152" rx="4"/>
  <text class="heading teal" x="108" y="302">fiberd agent</text>
  <text class="body" x="108" y="341">Manages both grants</text>
  <text class="body" x="108" y="374">Ledger · fences · budgets</text>
  <text class="body muted" x="80" y="474">Grants are siblings.</text>
  <text class="body muted" x="80" y="505">Their templates and fibers</text>
  <text class="body muted" x="80" y="536">belong to separate scopes.</text>

  <rect class="scope grant" x="386" y="252" width="470" height="468" rx="12"/>
  <text class="heading teal" x="414" y="291">Grant A</text>
  <text class="body muted" x="414" y="320">Own lease · workload · limits</text>
  <rect class="template" x="430" y="350" width="390" height="110" rx="3"/>
  <rect class="template" x="422" y="358" width="390" height="110" rx="3"/>
  <rect class="template" x="414" y="366" width="390" height="110" rx="3"/>
  <text class="heading amber" x="440" y="409">Warm template A</text>
  <text class="body" x="440" y="443">One reusable source for this grant</text>
  <circle class="fiber" cx="516" cy="608" r="72"/>
  <text class="label violet center" x="516" y="606">Fiber A1</text>
  <text class="body center" x="516" y="636">live instance</text>
  <circle class="fiber" cx="724" cy="608" r="72"/>
  <text class="label violet center" x="724" y="606">Fiber A2</text>
  <text class="body center" x="724" y="636">live instance</text>

  <rect class="scope grant" x="890" y="252" width="470" height="468" rx="12"/>
  <text class="heading teal" x="918" y="291">Grant B</text>
  <text class="body muted" x="918" y="320">Own lease · workload · limits</text>
  <rect class="template" x="934" y="350" width="390" height="110" rx="3"/>
  <rect class="template" x="926" y="358" width="390" height="110" rx="3"/>
  <rect class="template" x="918" y="366" width="390" height="110" rx="3"/>
  <text class="heading amber" x="944" y="409">Warm template B</text>
  <text class="body" x="944" y="443">One reusable source for this grant</text>
  <circle class="fiber" cx="1124" cy="608" r="72"/>
  <text class="label violet center" x="1124" y="606">Fiber B1</text>
  <text class="body center" x="1124" y="636">live instance</text>

  <text class="body muted" x="48" y="793">Nesting shows resource ownership. Workload isolation depends on the selected backend.</text>
</svg>
