<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <title>What contains a fiber</title>
  <desc>One home runs one fiberd agent. The control plane sends signed grants to the agent and receives aggregate status. Callers send Clone and receive an endpoint and fence. The agent manages a grant boundary containing one warm template and multiple fibers.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafcff"/>
      <stop offset="1" stop-color="#f1f5fb"/>
    </linearGradient>
    <linearGradient id="homeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#eaf1ff"/>
    </linearGradient>
    <linearGradient id="grantBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fffc"/>
      <stop offset="1" stop-color="#e8f7f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#182230" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#667085"/>
    </marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3165b5"/>
    </marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#704a80"/>
    </marker>
  </defs>

  <rect width="1100" height="570" fill="url(#pageBg)"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#172033">What contains a fiber</text>
  <text x="40" y="66" font-size="11" fill="#667085">The home owns the agent, and each admitted grant owns one warm template and its fibers</text>

  <!-- External actors -->
  <rect x="40" y="142" width="170" height="104" rx="14" fill="#ffffff" stroke="#7f9dc8" filter="url(#shadow)"/>
  <text x="125" y="169" text-anchor="middle" font-size="12" font-weight="700" fill="#24466f">Control plane</text>
  <text x="125" y="194" text-anchor="middle" font-size="9" fill="#52657c">signed grant -&gt;</text>
  <text x="125" y="226" text-anchor="middle" font-size="9" fill="#52657c">&lt;- aggregate status</text>

  <rect x="40" y="342" width="170" height="104" rx="14" fill="#ffffff" stroke="#9875ba" filter="url(#shadow)"/>
  <text x="125" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#4b3158">Caller or router</text>
  <text x="125" y="394" text-anchor="middle" font-size="9" fill="#667085">Clone -&gt;</text>
  <text x="125" y="426" text-anchor="middle" font-size="9" fill="#667085">&lt;- endpoint + fence</text>

  <!-- Home boundary -->
  <rect x="250" y="92" width="810" height="438" rx="22" fill="url(#homeBg)" stroke="#7f9dc8" stroke-width="2" filter="url(#shadow)"/>
  <text x="278" y="126" font-size="16" font-weight="700" fill="#24466f">Home</text>
  <text x="278" y="146" font-size="10" fill="#52657c">standalone host, Kubernetes grant Pod, or Slurm allocation</text>

  <!-- Agent -->
  <rect x="278" y="210" width="190" height="130" rx="15" fill="#ffffff" stroke="#42a39a" stroke-width="1.5"/>
  <text x="373" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#126b66">One fiberd agent</text>
  <rect x="301" y="260" width="144" height="24" rx="8" fill="#d8f1ec"/>
  <text x="373" y="276" text-anchor="middle" font-size="9" font-weight="700" fill="#126b66">ledger | budget | fences</text>
  <text x="373" y="315" text-anchor="middle" font-size="9" fill="#526d69">one agent per home</text>
  <!-- One grant runtime -->
  <rect x="510" y="144" width="520" height="326" rx="17" fill="url(#grantBg)" stroke="#42a39a" stroke-width="1.8"/>
  <text x="534" y="174" font-size="13" font-weight="700" fill="#126b66">One grant boundary</text>
  <rect x="853" y="158" width="149" height="24" rx="12" fill="#ffffff" stroke="#9bc9c4"/>
  <text x="927" y="174" text-anchor="middle" font-size="9" font-weight="700" fill="#126b66">resources and policy</text>

  <rect x="545" y="208" width="450" height="68" rx="13" fill="#fff7dc" stroke="#d7a933"/>
  <text x="770" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#6f4d05">One warm template</text>
  <text x="770" y="255" text-anchor="middle" font-size="9" fill="#805600">initialized source for fork or restore</text>

  <path d="M770 276V303" stroke="#704a80" stroke-width="1.5"/>
  <path d="M607 303H933" stroke="#704a80" stroke-width="1.5"/>
  <path d="M607 303V326" stroke="#704a80" stroke-width="1.5" marker-end="url(#purpleArrow)"/>
  <path d="M770 303V326" stroke="#704a80" stroke-width="1.5" marker-end="url(#purpleArrow)"/>
  <path d="M933 303V326" stroke="#704a80" stroke-width="1.5" marker-end="url(#purpleArrow)"/>

  <rect x="545" y="326" width="124" height="82" rx="12" fill="#f5f0f9" stroke="#9875ba"/>
  <text x="607" y="354" text-anchor="middle" font-size="11" font-weight="700" fill="#4b3158">Fiber A</text>
  <text x="607" y="376" text-anchor="middle" font-size="9" fill="#667085">one incarnation</text>
  <text x="607" y="393" text-anchor="middle" font-size="8.5" fill="#704a80">own endpoint</text>

  <rect x="708" y="326" width="124" height="82" rx="12" fill="#f5f0f9" stroke="#9875ba"/>
  <text x="770" y="354" text-anchor="middle" font-size="11" font-weight="700" fill="#4b3158">Fiber B</text>
  <text x="770" y="376" text-anchor="middle" font-size="9" fill="#667085">one incarnation</text>
  <text x="770" y="393" text-anchor="middle" font-size="8.5" fill="#704a80">own endpoint</text>

  <rect x="871" y="326" width="124" height="82" rx="12" fill="#f8f5fb" stroke="#9875ba" stroke-dasharray="5 4"/>
  <text x="933" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#704a80">+ N</text>
  <text x="933" y="376" text-anchor="middle" font-size="9" fill="#667085">up to fibers.max</text>

  <rect x="545" y="426" width="450" height="25" rx="12" fill="#ffffff" stroke="#b9d6d2"/>
  <text x="770" y="443" text-anchor="middle" font-size="9" font-weight="600" fill="#365f5b">The control plane does not receive one object per fiber.</text>

  <!-- Clean bidirectional relationships -->
  <path d="M210 194L278 240" fill="none" stroke="#3165b5" stroke-width="1.7" marker-start="url(#blueArrow)" marker-end="url(#blueArrow)"/>
  <path d="M210 394L278 314" fill="none" stroke="#704a80" stroke-width="1.7" marker-start="url(#purpleArrow)" marker-end="url(#purpleArrow)"/>

  <path d="M468 292H510" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="489" y="281" text-anchor="middle" font-size="8.5" fill="#667085">manages</text>

  <rect x="278" y="486" width="752" height="28" rx="14" fill="#ffffff" stroke="#9fb3ce" stroke-dasharray="6 4"/>
  <text x="654" y="505" text-anchor="middle" font-size="9.5" font-weight="600" fill="#52657c">When a home admits another grant, it repeats the grant boundary with another warm template and fiber set.</text>
</svg>
