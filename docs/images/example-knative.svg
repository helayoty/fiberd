<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="example-knative-title example-knative-desc">
  <title id="example-knative-title">The activator bridges HTTP requests and an idle fiber session</title>
  <desc id="example-knative-desc">A time-ordered sequence for one revision session, with separate caller, activator, fiberd agent, and guest lifelines. The activator holds the grant. On the first request it calls Clone and receives CREATE with an endpoint and fence, then forwards workload data directly to the guest. A request while that fiber is cached is reported as ATTACH locally, with no Clone RPC. After idle time the activator calls Park with sync false and clears its cached fiber on success. The next request calls Clone on the same session and receives RESUME, retaining guest state. Blue messages are lifecycle control; teal messages are workload traffic. This standalone demo maps SHED to HTTP 503 with Retry-After and DEFERRED_FALLBACK to HTTP 503 with a preferred-home header when supplied, not the canonical gateway's SHED mapping of 429.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--red:#b33b32;--red-bg:#fff0ef;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--red:#ff8178;--red-bg:#321817;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.secondary{font-size:17px}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.red{fill:var(--red)}.center{text-anchor:middle}
    .service{fill:var(--panel);stroke:var(--blue);stroke-width:2}.actor{fill:var(--panel);stroke:var(--teal);stroke-width:2}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:2}.divider{fill:none;stroke:var(--border);stroke-width:1.5}.lifeline{stroke:var(--border);stroke-width:1.5;stroke-dasharray:5 6}.flow{fill:none;stroke-width:2;stroke-linecap:round}.control{stroke:var(--blue)}.data{stroke:var(--teal)}.return{stroke-dasharray:7 6}.note{fill:var(--amber-bg)}.failure{fill:var(--red-bg)}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs>
    <marker id="example-knative-blue-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--blue)"/></marker>
    <marker id="example-knative-teal-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--teal)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="1090"/>
  <text class="title" x="48" y="66">Who wakes a fiber when an HTTP request arrives?</text>
  <text class="secondary muted" x="48" y="100">The activator holds the grant and the endpoint cache. Blue = lifecycle RPC; teal = workload data.</text>
  <path class="divider" d="M48 130H1392"/>

  <circle class="actor" cx="156" cy="177" r="14"/>
  <path class="actor" d="M130 217V205C130 183 182 183 182 205V217"/>
  <text class="label center" x="156" y="246">HTTP caller</text>
  <rect class="service" x="334" y="165" width="300" height="84" rx="4"/>
  <text class="label blue center" x="484" y="199">fiberd-activator</text>
  <text class="secondary center" x="484" y="229">revision → session hello-0</text>
  <rect class="service" x="704" y="165" width="280" height="84" rx="4"/>
  <text class="label blue center" x="844" y="199">fiberd agent</text>
  <text class="secondary center" x="844" y="229">Hyperlight home</text>
  <circle class="fiber" cx="1264" cy="196" r="39"/>
  <text class="label violet center" x="1264" y="265">Guest fiber</text>

  <path class="lifeline" d="M156 270V940M484 249V940M844 249V940M1264 278V940"/>
  <text class="secondary muted" x="48" y="290">First request</text>
  <path class="flow data" d="M156 326H484" marker-end="url(#example-knative-teal-arrow)"/>
  <text class="secondary teal" x="188" y="311">1 · HTTP request</text>
  <path class="flow control" d="M484 365H844" marker-end="url(#example-knative-blue-arrow)"/>
  <text class="secondary blue" x="520" y="349">2 · Clone(grant, session)</text>
  <path class="flow control return" d="M844 407H484" marker-end="url(#example-knative-blue-arrow)"/>
  <text class="secondary blue" x="520" y="391">3 · CREATE · endpoint + fence</text>
  <path class="flow data" d="M484 449H1264" marker-end="url(#example-knative-teal-arrow)"/>
  <text class="secondary teal" x="913" y="433">4 · Forward request</text>

  <path class="divider" d="M48 477H1392"/>
  <text class="secondary muted" x="48" y="506">While live</text>
  <path class="flow data" d="M156 541H484" marker-end="url(#example-knative-teal-arrow)"/>
  <text class="secondary teal" x="188" y="525">5 · Another request</text>
  <path class="flow data" d="M484 587H1264" marker-end="url(#example-knative-teal-arrow)"/>
  <text class="secondary teal" x="913" y="571">6 · Reuse cached endpoint</text>
  <text class="secondary amber" x="530" y="567">Cached reuse ≠ Clone RPC</text>

  <path class="divider" d="M48 619H1392"/>
  <text class="secondary muted" x="48" y="650">Idle timeout</text>
  <path class="flow control" d="M484 685H844" marker-end="url(#example-knative-blue-arrow)"/>
  <text class="secondary blue" x="520" y="667">7 · Park(fiber, sync=false)</text>
  <text class="secondary muted" x="912" y="670">Guest stops; state retained</text>
  <text class="secondary muted" x="520" y="717">Clear cached fiber on success</text>

  <path class="divider" d="M48 743H1392"/>
  <text class="secondary muted" x="48" y="775">After idle</text>
  <path class="flow data" d="M156 809H484" marker-end="url(#example-knative-teal-arrow)"/>
  <text class="secondary teal" x="188" y="793">8 · Next HTTP request</text>
  <path class="flow control" d="M484 849H844" marker-end="url(#example-knative-blue-arrow)"/>
  <text class="secondary blue" x="520" y="833">9 · Clone(same session)</text>
  <path class="flow control return" d="M844 892H484" marker-end="url(#example-knative-blue-arrow)"/>
  <text class="secondary blue" x="520" y="876">10 · RESUME · new fence</text>
  <path class="flow data" d="M484 935H1264" marker-end="url(#example-knative-teal-arrow)"/>
  <text class="secondary teal" x="913" y="919">11 · Forward; counter continues</text>

  <rect class="boundary failure" x="48" y="968" width="1344" height="62" rx="5"/>
  <text class="secondary red" x="72" y="993">No capacity in this demo: SHED → 503 + Retry-After</text>
  <text class="secondary red" x="72" y="1017">DEFERRED_FALLBACK → 503 + X-Fiberd-Preferred-Home, when supplied</text>
  <text class="secondary muted" x="48" y="1063">Standalone consumer, not a Knative install · busy slots may add fibers up to concurrency · HTTP replies omitted for clarity.</text>
</svg>
