<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="890" viewBox="0 0 1440 890" role="img" aria-labelledby="networking-title networking-desc">
  <title id="networking-title">Control asks the agent; workload traffic goes to the fiber</title>
  <desc id="networking-desc">In this DIRECT TCP example, the caller sends Clone to the agent's control endpoint and receives tcp://10.244.0.8:30001 plus a fence. It then connects to fiber A, without sending workload traffic through the agent. Fiber B shares the home address but has another port. The home outline is a network scope, not a service. Proc and runc support direct TCP and Unix; gVisor and Hyperlight support Unix only. HANDOFF is a different path: a shared home listener reads the TLS ClientHello and passes the connection to the selected fiber, which terminates TLS. Handoff requires proc or runc, a bound client certificate, routing-key SNI, and a pinned fiber key.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.secondary{font-size:17px}.muted{fill:var(--muted)}.center{text-anchor:middle}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}
    .scope{fill:none;stroke:var(--teal);stroke-width:1.5}.service{fill:var(--panel);stroke:var(--teal);stroke-width:2}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:2}.actor{fill:var(--panel);stroke:var(--blue);stroke-width:2}.port{fill:var(--bg);stroke:var(--teal);stroke-width:2}
    .divider{fill:none;stroke:var(--border);stroke-width:1.5}.flow{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.control{stroke:var(--blue)}.response{stroke-dasharray:7 6}.data{stroke:var(--violet);stroke-width:3}.number{font-size:17px;font-weight:700;text-anchor:middle}.blue-number{fill:var(--blue-bg);stroke:var(--blue)}.violet-number{fill:var(--violet-bg);stroke:var(--violet)}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs>
    <marker id="networking-blue-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--blue)"/></marker>
    <marker id="networking-violet-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--violet)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="890"/>
  <text class="title" x="48" y="66">Control asks the agent. Traffic goes to the fiber.</text>
  <text class="secondary muted" x="48" y="100">DIRECT TCP example · one home address does not mean one connection.</text>
  <path class="divider" d="M48 130H1392"/>

  <rect class="scope" x="684" y="174" width="708" height="492" rx="16"/>
  <text class="heading teal" x="712" y="213">Home · 10.244.0.8</text>
  <text class="secondary muted" x="712" y="244">Shared address · separate control and workload ports</text>

  <circle class="actor" cx="166" cy="304" r="19"/>
  <path class="actor" d="M130 365V353C130 324 202 324 202 353V365"/>
  <text class="heading center" x="166" y="452">Caller / router</text>
  <text class="secondary center muted" x="166" y="481">Keeps returned route</text>

  <rect class="service" x="720" y="282" width="294" height="132" rx="4"/>
  <text class="heading teal" x="744" y="320">fiberd agent</text>
  <text class="secondary" x="744" y="353">Control endpoint · :8484</text>
  <text class="secondary muted" x="744" y="383">Clone · Park · Release</text>
  <circle class="port" cx="720" cy="328" r="6"/>
  <circle class="port" cx="720" cy="394" r="6"/>

  <path class="flow control" d="M230 328H714" marker-end="url(#networking-blue-arrow)"/>
  <circle class="blue-number" cx="276" cy="294" r="13"/>
  <text class="number blue" x="276" y="300">1</text>
  <text class="label blue" x="302" y="301">Clone + grant + session</text>
  <path class="flow control response" d="M714 394H246" marker-end="url(#networking-blue-arrow)"/>
  <circle class="blue-number" cx="276" cy="359" r="13"/>
  <text class="number blue" x="276" y="365">2</text>
  <text class="secondary blue" x="302" y="366">tcp://10.244.0.8:30001 + fence</text>

  <circle class="fiber" cx="1228" cy="337" r="61"/>
  <text class="label center violet" x="1228" y="337">Fiber B</text>
  <text class="secondary center" x="1228" y="365">:30002</text>
  <text class="secondary center muted" x="1228" y="425">Another workload</text>

  <circle class="fiber" cx="1228" cy="552" r="79"/>
  <text class="heading center violet" x="1228" y="546">Fiber A</text>
  <text class="secondary center" x="1228" y="577">:30001</text>
  <path class="flow data" d="M166 499V552H1149" marker-end="url(#networking-violet-arrow)"/>
  <circle class="violet-number" cx="360" cy="490" r="13"/>
  <text class="number violet" x="360" y="496">3</text>
  <text class="heading violet" x="388" y="497">Connect to returned fiber</text>
  <text class="secondary violet" x="388" y="527">Workload traffic · agent bypassed</text>
  <text class="secondary muted" x="712" y="629">No per-fiber IP or discovery record</text>

  <path class="divider" d="M48 714H1392"/>
  <text class="heading violet" x="48" y="755">DIRECT endpoint support</text>
  <text class="secondary" x="48" y="789">proc / runc: TCP or Unix · gVisor / Hyperlight: Unix</text>
  <text class="secondary" x="48" y="818">Unix needs an accessible path; a route is not authentication.</text>
  <text class="heading amber" x="760" y="755">HANDOFF is a different path · proc / runc</text>
  <text class="secondary" x="760" y="789">Shared TLS listener → selected fiber terminates TLS</text>
  <text class="secondary" x="760" y="818">Routing-key SNI · bound client certificate · pinned fiber key</text>
  <text class="secondary muted" x="48" y="865">Park / Resume retain the endpoint; cross-home resume needs a target that can bind and route it.</text>
</svg>
