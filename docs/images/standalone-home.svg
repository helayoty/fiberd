<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Helvetica Neue, Arial, sans-serif">
  <title>The standalone home</title>
  <desc>A standalone host runs cmd/fiberd: the platform's issuer signs a CapacityGrant once and publishes its keys; the agent verifies the grant offline, warms the template, and mints fibers under a delegated cgroup subtree; callers clone over gRPC or the JSON gateway and dial the endpoint they are handed; status and audit flow back to the platform asynchronously.</desc>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arwd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#777"/></marker>
  </defs>
  <rect width="820" height="470" fill="#ffffff"/>

  <rect x="30" y="30" width="760" height="280" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="45" y="54" font-size="13" font-weight="600" fill="#333">Standalone host: cmd/fiberd, the standalone home, warm path only</text>

  <rect x="50" y="72" width="200" height="98" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="150" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">caller / router</text>
  <text x="150" y="114" text-anchor="middle" font-size="11" fill="#1a1a1a">Clone(grant JWT, session)</text>
  <text x="150" y="130" text-anchor="middle" font-size="11" fill="#1a1a1a">gRPC :8484 or JSON -http</text>
  <text x="150" y="146" text-anchor="middle" font-size="11" fill="#1a1a1a">dials the endpoint it is handed</text>
  <text x="150" y="162" text-anchor="middle" font-size="10.5" fill="#1a1a1a">misses: SHED / DEFERRED_FALLBACK</text>

  <rect x="290" y="72" width="240" height="98" rx="6" fill="#b0e3e6" stroke="#0e8088"/>
  <text x="410" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">fiberd (pkg/agent)</text>
  <text x="410" y="114" text-anchor="middle" font-size="11" fill="#1a1a1a">verifies the grant against cached JWKS</text>
  <text x="410" y="130" text-anchor="middle" font-size="11" fill="#1a1a1a">grants: -grants-dir or the first Clone</text>
  <text x="410" y="146" text-anchor="middle" font-size="11" fill="#1a1a1a">ledger, fences, budget, ladder, audit</text>
  <text x="410" y="162" text-anchor="middle" font-size="11" fill="#1a1a1a">liveness: the issuer's keys keep refreshing</text>

  <rect x="570" y="72" width="200" height="98" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="670" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">template + fibers</text>
  <text x="670" y="114" text-anchor="middle" font-size="11" fill="#1a1a1a">one warm zygote per grant</text>
  <text x="670" y="130" text-anchor="middle" font-size="11" fill="#1a1a1a">fibers: fork or snapshot restore</text>
  <text x="670" y="146" text-anchor="middle" font-size="11" fill="#1a1a1a">unix sockets under -run-dir, or</text>
  <text x="670" y="162" text-anchor="middle" font-size="11" fill="#1a1a1a">tcp on -endpoint-host, a port each</text>

  <polyline points="250,110 290,110" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="270" y="102" text-anchor="middle" font-size="10" fill="#333">Clone</text>
  <polyline points="530,110 570,110" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="550" y="102" text-anchor="middle" font-size="10" fill="#333">mint</text>
  <polyline points="150,170 150,185 670,185 670,170" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="410" y="197" text-anchor="middle" font-size="10" fill="#333">endpoint + fence returned by Clone; nothing else knows the fiber</text>

  <rect x="50" y="210" width="720" height="82" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="410" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">-cgroup-root: a delegated cgroup v2 subtree the agent owns</text>
  <text x="410" y="252" text-anchor="middle" font-size="11" fill="#1a1a1a">fiberd/&lt;grant&gt;/zygote and f-&lt;epoch&gt;-&lt;seq&gt;; grant ceiling memory.high; per-fiber memory.max, W priced from the leaf</text>
  <text x="410" y="268" text-anchor="middle" font-size="11" fill="#1a1a1a">fabric: -devices, a static list every grant's engine may drive; scope: none beyond min(lease, fence)</text>
  <text x="410" y="284" text-anchor="middle" font-size="11" fill="#1a1a1a">state: -state holds the epoch file, the ledger snapshot, parked deltas and audit.jsonl</text>

  <rect x="30" y="340" width="760" height="110" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="4 3"/>
  <text x="45" y="364" font-size="13" font-weight="600" fill="#333">Platform control plane: any stack, cold path, asynchronous</text>

  <rect x="50" y="378" width="340" height="60" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="220" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">grant-issuer (or your issuer)</text>
  <text x="220" y="416" text-anchor="middle" font-size="11" fill="#1a1a1a">signs the CapacityGrant once (aud = -node-id); publishes JWKS</text>
  <text x="220" y="430" text-anchor="middle" font-size="11" fill="#1a1a1a">billing charges the block at issue, never per fiber</text>

  <rect x="430" y="378" width="340" height="60" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="600" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">placer / router</text>
  <text x="600" y="416" text-anchor="middle" font-size="11" fill="#1a1a1a">the grant is the unit of placement, disruption and reclaim</text>
  <text x="600" y="430" text-anchor="middle" font-size="11" fill="#1a1a1a">routes on ready from the Watch stream; reads status and audit</text>

  <polyline points="220,378 220,292" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arwd)"/>
  <text x="130" y="330" text-anchor="middle" font-size="10" fill="#555">signed grant; JWKS fetched and cached</text>
  <polyline points="600,292 600,378" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arwd)"/>
  <text x="700" y="330" text-anchor="middle" font-size="10" fill="#555">Watch status; the audit spool ships</text>
</svg>
