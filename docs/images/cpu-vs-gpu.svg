<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arwp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#9673a6"/></marker>
  </defs>
  <rect width="860" height="380" fill="#ffffff"/>

  <text x="40" y="36" font-size="13" font-weight="600" fill="#333">CPU side - cloned (fork / CoW)</text>
  <text x="820" y="36" text-anchor="end" font-size="13" font-weight="600" fill="#333">GPU side - multiplexed (KV-cache slices)</text>
  <line x1="565" y1="55" x2="565" y2="350" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="40" y="150" width="150" height="70" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="115" y="190" text-anchor="middle" font-size="13" fill="#1a1a1a">zygote</text>

  <rect x="365" y="80" width="130" height="46" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="430" y="108" text-anchor="middle" font-size="12" fill="#1a1a1a">fiber A</text>
  <rect x="365" y="157" width="130" height="46" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="430" y="185" text-anchor="middle" font-size="12" fill="#1a1a1a">fiber B</text>
  <rect x="365" y="234" width="130" height="46" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="430" y="262" text-anchor="middle" font-size="12" fill="#1a1a1a">fiber C</text>

  <rect x="640" y="115" width="180" height="70" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="730" y="143" text-anchor="middle" font-size="13" fill="#1a1a1a">engine</text>
  <text x="730" y="161" text-anchor="middle" font-size="10" fill="#1a1a1a">owns CUDA context,</text>
  <text x="730" y="174" text-anchor="middle" font-size="10" fill="#1a1a1a">VRAM, KV cache</text>

  <rect x="620" y="240" width="200" height="95" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="720" y="260" text-anchor="middle" font-size="11" fill="#333">KV cache - each fiber holds a slice</text>
  <rect x="632" y="285" width="50" height="34" rx="5" fill="#b0e3e6" stroke="#0e8088"/>
  <text x="657" y="307" text-anchor="middle" font-size="12" fill="#1a1a1a">A</text>
  <rect x="695" y="285" width="50" height="34" rx="5" fill="#b0e3e6" stroke="#0e8088"/>
  <text x="720" y="307" text-anchor="middle" font-size="12" fill="#1a1a1a">B</text>
  <rect x="758" y="285" width="50" height="34" rx="5" fill="#b0e3e6" stroke="#0e8088"/>
  <text x="783" y="307" text-anchor="middle" font-size="12" fill="#1a1a1a">C</text>

  <line x1="190" y1="172" x2="365" y2="103" stroke="#9673a6" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwp)"/>
  <line x1="190" y1="185" x2="365" y2="180" stroke="#9673a6" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwp)"/>
  <line x1="190" y1="198" x2="365" y2="257" stroke="#9673a6" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwp)"/>
  <text x="250" y="150" font-size="11" fill="#9673a6">fork (CoW)</text>

  <line x1="495" y1="103" x2="640" y2="140" stroke="#333" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="495" y1="180" x2="640" y2="150" stroke="#333" stroke-width="1.4" marker-end="url(#arw)"/>
  <line x1="495" y1="257" x2="640" y2="165" stroke="#333" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="560" y="205" text-anchor="middle" font-size="11" fill="#333">local IPC</text>

  <line x1="730" y1="185" x2="730" y2="240" stroke="#333" stroke-width="1.4" marker-end="url(#arw)"/>
</svg>
