<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="752" viewBox="0 0 1440 752" role="img" aria-labelledby="benchmark-methodology-title benchmark-methodology-desc">
  <title id="benchmark-methodology-title">One request, three measurement boundaries</title>
  <desc id="benchmark-methodology-desc">One representative uncached HTTP activation, read left to right. Nested colored spans share the same process strip: the HTTP client measures request to response, the activator measures Clone RPC send to result, and the runtime measurement covers call to readiness. The activator sends Clone; fiberd verifies and admits the grant as needed and resolves the ledger before forking or restoring a fiber. Audit and commit precede the Clone result. Endpoint connection and workload execution follow before the HTTP response. The circles on span edges mark clock boundaries, not processes. ATTACH and cached routes can bypass activation. This is a schematic, not a duration comparison.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:600}.body{font-size:18px}.center{text-anchor:middle}.muted{fill:var(--muted)}.violet{fill:var(--violet)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}
    .span{stroke-width:2}.http-span{fill:var(--violet-bg);stroke:var(--violet)}.clone-span{fill:var(--blue-bg);stroke:var(--blue)}.runtime-span{fill:var(--teal-bg);stroke:var(--teal)}.phase{fill:var(--panel);stroke:var(--border);stroke-width:1.5}
    .flow{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.port{fill:var(--panel);stroke-width:2}.http-port{stroke:var(--violet)}.clone-port{stroke:var(--blue)}.runtime-port{stroke:var(--teal)}.actor{fill:var(--panel);stroke:var(--violet);stroke-width:2}
  </style>
  <defs>
    <marker id="benchmark-methodology-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--ink)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="752"/>
  <text class="title" x="48" y="66">One request, three measurement boundaries</text>
  <text class="body muted" x="48" y="104">Uncached activation · CREATE or RESUME</text>

  <rect class="boundary span http-span" x="80" y="164" width="1280" height="448" rx="12"/>
  <circle class="actor" cx="119" cy="200" r="10"/>
  <path class="actor" d="M100 232V225C100 207 138 207 138 225V232"/>
  <text class="label violet" x="160" y="207">HTTP client</text>
  <text class="label violet" x="160" y="238">request → response</text>

  <rect class="boundary span clone-span" x="350" y="268" width="784" height="304" rx="8"/>
  <text class="label blue" x="378" y="308">Activator clock</text>
  <text class="label blue" x="608" y="308">Clone RPC send → result</text>

  <rect class="boundary span runtime-span" x="686" y="344" width="238" height="192" rx="6"/>
  <text class="label teal center" x="805" y="380">Runtime clock</text>
  <text class="label teal center" x="805" y="410">call → ready</text>

  <rect class="phase" x="144" y="444" width="170" height="76" rx="4"/>
  <text class="label center" x="229" y="489">Activator</text>
  <rect class="phase" x="378" y="444" width="264" height="76" rx="4"/>
  <text class="label center" x="510" y="475">Verify / admit</text>
  <text class="label center" x="510" y="504">Ledger</text>
  <rect class="phase" x="704" y="444" width="202" height="76" rx="4"/>
  <text class="label teal center" x="805" y="489">Fork / restore</text>
  <rect class="phase" x="950" y="444" width="158" height="76" rx="4"/>
  <text class="label center" x="1029" y="475">Audit</text>
  <text class="label center" x="1029" y="504">Commit</text>
  <rect class="phase" x="1164" y="444" width="148" height="76" rx="4"/>
  <text class="label center" x="1238" y="475">Connect</text>
  <text class="label center" x="1238" y="504">Execute</text>

  <path class="flow" d="M80 482H144" marker-end="url(#benchmark-methodology-arrow)"/>
  <path class="flow" d="M314 482H378" marker-end="url(#benchmark-methodology-arrow)"/>
  <path class="flow" d="M642 482H704" marker-end="url(#benchmark-methodology-arrow)"/>
  <path class="flow" d="M906 482H950" marker-end="url(#benchmark-methodology-arrow)"/>
  <path class="flow" d="M1108 482H1164" marker-end="url(#benchmark-methodology-arrow)"/>
  <path class="flow" d="M1312 482H1360" marker-end="url(#benchmark-methodology-arrow)"/>
  <circle class="port http-port" cx="80" cy="482" r="6"/>
  <circle class="port clone-port" cx="350" cy="482" r="6"/>
  <circle class="port runtime-port" cx="686" cy="482" r="6"/>
  <circle class="port runtime-port" cx="924" cy="482" r="6"/>
  <circle class="port clone-port" cx="1134" cy="482" r="6"/>
  <circle class="port http-port" cx="1360" cy="482" r="6"/>

  <text class="label violet" x="104" y="586">HTTP request</text>
  <text class="label violet" x="1336" y="586" text-anchor="end">HTTP response</text>
  <text class="body muted" x="80" y="665">ATTACH / cached routes skip activation.</text>
  <text class="body muted" x="80" y="703">Schematic, not to scale; compare the same boundary.</text>
</svg>
