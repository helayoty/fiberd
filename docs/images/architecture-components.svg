<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="914" viewBox="0 0 1440 914" role="img" aria-labelledby="architecture-components-title architecture-components-desc">
  <title id="architecture-components-title">Which components make up one fiberd agent?</title>
  <desc id="architecture-components-desc">The components of one fiberd agent, grouped in three bordered lanes, with the path of one Clone numbered in blue. Above the agent sit two callers. The issuer signs grants, and the grant verifier reads its published signing keys. The consumer is any caller of the agent. The control lane holds the grant verifier, the control API, the home and the handoff router. The record lane holds admission and pressure, the ledger and the audit spool. The execution lane holds artifact and mobility, the runtime host and the backends. Below the agent sit the registry, the zygote and the fibers. The Clone path runs as follows. 1, the consumer calls the control API over gRPC or JSON with mutual TLS. 2, the control API has the grant verifier check the grant. 3, the control API calls the ledger. 4, the ledger calls the runtime host. 5, the runtime host calls a backend. 6, a fiber starts. On proc and runc the backend drives the zygote, the warm template's own process, which forks the fiber. On gVisor and Hyperlight the backend restores the fiber instead. Other calls are drawn in grey. The home delivers grants, health and scope to the ledger. The ledger consults admission and pressure, which can ask the ledger to reclaim fibers. The ledger records every change in the audit spool. The runtime host calls artifact and mobility, which pulls from and publishes to the untrusted registry. Separately, the consumer opens a TLS connection to the handoff router, which passes it to its fiber without decrypting it.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.name{font-size:20px;font-weight:700}.label{font-size:20px;font-weight:600}.lane{font-size:17px;font-weight:700}.secondary{font-size:17px}.muted{fill:var(--muted)}.center{text-anchor:middle}.end{text-anchor:end}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}
    .divider{fill:none;stroke:var(--border);stroke-width:1.5}.scope{fill:none;stroke:var(--border);stroke-width:1.5}.outside{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
    .band{stroke-width:1.5;fill-opacity:.5;stroke-opacity:.55}.band-control{fill:var(--blue-bg);stroke:var(--blue)}.band-record{fill:var(--teal-bg);stroke:var(--teal)}.band-exec{fill:var(--green-bg);stroke:var(--green)}
    .box{fill:var(--panel);stroke-width:2}.control{stroke:var(--blue)}.record{stroke:var(--teal)}.exec{stroke:var(--green)}.ledger{fill:var(--teal-bg);stroke:var(--teal);stroke-width:2}.template{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:2}
    .flow{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.clone{stroke:var(--blue)}.call{stroke:var(--muted);stroke-width:1.5}.traffic{stroke:var(--violet);stroke-dasharray:7 6}
    .number{font-size:17px;font-weight:700;text-anchor:middle}.blue-number{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs>
    <marker id="architecture-components-blue-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--blue)"/></marker>
    <marker id="architecture-components-muted-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 11 6 1 11Z" fill="var(--muted)"/></marker>
    <marker id="architecture-components-violet-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--violet)"/></marker>
  </defs>
