<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="architecture-components-title architecture-components-desc">
  <title id="architecture-components-title">One invariant core, replaceable collaborators</title>
  <desc id="architecture-components-desc">Selected structural relationships, not an execution sequence. Primary labels use repository package names or the concrete core.Spool type; subtitles describe roles. pkg/rpc calls core.Agent. pkg/home delivers grants and supplies health, scope, and fabric callbacks. pkg/core uses pkg/grant through core.Verifier and core.Spool through core.Auditor. The circular core.Runtime port selects pkg/runtime/host or pkg/runtime/stub. The host-only outline groups pkg/runtime/host with its pkg/backend and pkg/artifact dependencies. pkg/runtime/stub has neither dependency. pkg/agent.Run assembles these collaborators.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.focal{font-size:28px;font-weight:700}.body{font-size:18px}.muted{fill:var(--muted)}.center{text-anchor:middle}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.green{fill:var(--green)}
    .scope{fill:none;stroke:var(--border);stroke-width:1.5}.component{fill:var(--panel);stroke-width:2}.api{stroke:var(--blue)}.home{stroke:var(--violet)}.policy{fill:var(--teal-bg);stroke:var(--teal)}.plugin{stroke:var(--violet)}.host{stroke:var(--green)}.detail{stroke:var(--border);stroke-width:1.5}.stub{stroke:var(--border);stroke-width:1.5}.port{fill:var(--bg);stroke:var(--green);stroke-width:2}
    .divider{fill:none;stroke:var(--border);stroke-width:1.5}.flow{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.binding{fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:7 6;stroke-linejoin:round}
  </style>
  <defs>
    <marker id="architecture-components-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--ink)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="840"/>
  <text class="title" x="48" y="66">One invariant core, replaceable collaborators</text>
  <text class="body muted" x="48" y="100">Code architecture · packages, types, and interfaces — not deployment units.</text>
  <path class="divider" d="M48 130H1392"/>

  <rect class="component api" x="48" y="248" width="300" height="110" rx="4"/>
  <text class="heading blue" x="72" y="290">pkg/rpc</text>
  <text class="body muted" x="72" y="324">gRPC · JSON gateway</text>
  <path class="flow" d="M348 303H434V407H512" marker-end="url(#architecture-components-arrow)"/>
  <text class="body" x="360" y="287">requests</text>

  <rect class="component home" x="48" y="524" width="300" height="120" rx="4"/>
  <text class="heading violet" x="72" y="566">pkg/home</text>
  <text class="body muted" x="72" y="600">Grants · health · scope</text>
  <path class="flow" d="M348 552H412V480H512" marker-end="url(#architecture-components-arrow)"/>
  <text class="body" x="354" y="536">grants</text>
  <path class="flow" d="M512 520H466V616H348" marker-end="url(#architecture-components-arrow)"/>
  <text class="body" x="354" y="644">callbacks</text>

  <rect class="component policy" x="512" y="356" width="300" height="192" rx="8"/>
  <text class="focal teal center" x="662" y="433">pkg/core</text>
  <text class="body center" x="662" y="471">Admission · sessions · fences</text>

  <rect class="component plugin" x="512" y="176" width="340" height="102" rx="4"/>
  <text class="heading violet" x="536" y="215">pkg/grant</text>
  <text class="body muted" x="536" y="249">Signed-grant verification</text>
  <path class="flow" d="M682 356V278" marker-end="url(#architecture-components-arrow)"/>
  <text class="body violet" x="702" y="322">core.Verifier</text>

  <rect class="component plugin" x="512" y="672" width="340" height="102" rx="4"/>
  <text class="heading violet" x="536" y="711">core.Spool</text>
  <text class="body muted" x="536" y="745">Audit log · pkg/core</text>
  <path class="flow" d="M682 548V672" marker-end="url(#architecture-components-arrow)"/>
  <text class="body violet" x="702" y="616">core.Auditor</text>

  <path class="flow" d="M812 445H868" marker-end="url(#architecture-components-arrow)"/>
  <circle class="port" cx="878" cy="445" r="10"/>
  <text class="body green center" x="882" y="390">core.Runtime</text>
  <text class="body muted center" x="882" y="417">select one</text>
  <path class="binding" d="M888 445H964V270H1016"/>
  <path class="binding" d="M964 445V700H1056"/>
  <circle cx="964" cy="445" r="3" fill="var(--green)"/>

  <rect class="scope" x="992" y="170" width="400" height="386" rx="16"/>
  <rect class="component host" x="1016" y="214" width="352" height="112" rx="4"/>
  <text class="heading green" x="1040" y="257">pkg/runtime/host</text>
  <text class="body muted" x="1040" y="291">Host execution</text>
  <path class="flow" d="M1192 326V374H1100V422" marker-end="url(#architecture-components-arrow)"/>
  <path class="flow" d="M1192 374H1284V422" marker-end="url(#architecture-components-arrow)"/>
  <circle cx="1192" cy="374" r="3" fill="var(--ink)"/>
  <rect class="component detail" x="1016" y="422" width="168" height="94" rx="4"/>
  <text class="heading" x="1032" y="459">pkg/backend</text>
  <text class="body muted" x="1032" y="489">Mechanism</text>
  <rect class="component detail" x="1200" y="422" width="168" height="94" rx="4"/>
  <text class="heading" x="1216" y="459">pkg/artifact</text>
  <text class="body muted" x="1216" y="489">State storage</text>

  <rect class="component stub" x="1056" y="650" width="312" height="100" rx="4"/>
  <text class="heading" x="1080" y="689">pkg/runtime/stub</text>
  <text class="body muted" x="1080" y="722">In-memory simulation</text>
  <text class="body muted" x="1056" y="780">Dashed: alternative implementation</text>

  <text class="body muted" x="48" y="818">Selected relationships · pkg/agent.Run assembles the reference agent.</text>
</svg>
