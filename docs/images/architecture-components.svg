<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="architecture-components-title architecture-components-desc">
  <title id="architecture-components-title">fiberd implementation component boundaries</title>
  <desc id="architecture-components-desc">cmd/fiberd starts pkg/agent, which composes network servers, core policy, home, verifier, runtime, audit, and artifact seams. pkg/rpc calls pkg/core. The host runtime implements the core runtime interface and calls the selected backend. Artifact and several backend capability interfaces are optional. pkg/sys supplies Linux cgroup and CRIU mechanisms without entering the invariant core.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.bluebox{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.tealbox{fill:var(--teal-bg);stroke:var(--teal);stroke-width:1.5}.violetbox{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.amberbox{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.greenbox{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.cap{font-size:12px;font-weight:700;letter-spacing:.5px}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}.inject{fill:none;stroke:var(--violet);stroke-width:2;stroke-dasharray:7 5}
  </style>
  <defs><marker id="architecture-components-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#7b8794"/></marker><marker id="architecture-components-violet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#704aa1"/></marker></defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="42" y="48">Implementation composition: invariant core, injected environment</text>
  <text class="subtitle" x="42" y="74">Arrows show dependency or calls-toward direction. Dashed seams are injected; optional capabilities are explicitly marked.</text>
  <rect class="bluebox" x="42" y="122" width="214" height="90" rx="15"/>
  <text class="h blue" x="149" y="155" text-anchor="middle">cmd/fiberd</text><text class="b" x="149" y="184" text-anchor="middle">parse config · start agent</text>
  <rect class="violetbox" x="330" y="108" width="246" height="118" rx="17"/>
  <text class="h violet" x="453" y="141" text-anchor="middle">pkg/agent</text><text class="b" x="453" y="170" text-anchor="middle">composition root</text><text class="s" x="453" y="194" text-anchor="middle">wires servers, state, loops, seams</text><text class="s" x="453" y="212" text-anchor="middle">selected by configuration</text>
  <path class="arrow" d="M256 167h74" marker-end="url(#architecture-components-arrow)"/>

  <rect class="panel" x="42" y="284" width="534" height="214" rx="20"/>
  <text class="cap" x="68" y="318">PUBLIC ADAPTERS + INVARIANT POLICY</text>
  <rect class="bluebox" x="68" y="350" width="190" height="108" rx="15"/>
  <text class="h blue" x="163" y="382" text-anchor="middle">pkg/rpc</text><text class="b" x="163" y="411" text-anchor="middle">gRPC + JSON gateway</text><text class="s" x="163" y="437" text-anchor="middle">status / error mapping</text>
  <rect class="tealbox" x="342" y="340" width="206" height="128" rx="16"/>
  <text class="h teal" x="445" y="372" text-anchor="middle">pkg/core</text><text class="b" x="445" y="401" text-anchor="middle">admission · ledger · fences</text><text class="b" x="445" y="425" text-anchor="middle">budgets · pressure · snapshots</text><text class="s" x="445" y="450" text-anchor="middle">depends on interfaces, not platforms</text>
  <path class="arrow" d="M258 404h84" marker-end="url(#architecture-components-arrow)"/>
  <text class="s" x="300" y="393" text-anchor="middle">calls</text>
  <path class="arrow" d="M453 226v58" marker-end="url(#architecture-components-arrow)"/>

  <rect class="panel" x="620" y="108" width="538" height="390" rx="20"/>
  <text class="cap violet" x="648" y="142">INJECTED SEAMS</text>
  <rect class="violetbox" x="648" y="170" width="210" height="86" rx="14"/>
  <text class="h violet" x="753" y="201" text-anchor="middle">pkg/home</text><text class="s" x="753" y="228" text-anchor="middle">grants · health · scope · fabric*</text>
  <rect class="violetbox" x="920" y="170" width="210" height="86" rx="14"/>
  <text class="h violet" x="1025" y="201" text-anchor="middle">pkg/grant verifier</text><text class="s" x="1025" y="228" text-anchor="middle">JWT / JWKS → core.Grant</text>
  <rect class="violetbox" x="648" y="286" width="210" height="86" rx="14"/>
  <text class="h violet" x="753" y="317" text-anchor="middle">core.Auditor</text><text class="s" x="753" y="344" text-anchor="middle">local spool + durability policy</text>
  <rect class="amberbox" x="920" y="286" width="210" height="86" rx="14"/>
  <text class="h amber" x="1025" y="317" text-anchor="middle">pkg/artifact*</text><text class="s" x="1025" y="344" text-anchor="middle">templates · deltas · parity · registry</text>
  <rect class="greenbox" x="648" y="402" width="482" height="70" rx="15"/>
  <text class="h green" x="889" y="431" text-anchor="middle">core.Runtime implementation</text><text class="b" x="889" y="456" text-anchor="middle">stub or pkg/runtime/host</text>
  <path class="inject" d="M576 167h72M576 184h344M576 404h72M576 438h72" marker-end="url(#architecture-components-violet-arrow)"/>
  <text class="s" x="889" y="489" text-anchor="middle">* optional: fabric, registry exchange, and backend capability interfaces are not universally present</text>

  <rect class="panel" x="42" y="548" width="1116" height="160" rx="20"/>
  <text class="cap" x="68" y="582">HOST EXECUTION PATH</text>
  <rect class="greenbox" x="68" y="610" width="240" height="70" rx="14"/>
  <text class="h green" x="188" y="638" text-anchor="middle">pkg/runtime/host</text><text class="s" x="188" y="662" text-anchor="middle">grants · endpoints · W · deltas</text>
  <rect class="amberbox" x="388" y="610" width="394" height="70" rx="14"/>
  <text class="h amber" x="585" y="638" text-anchor="middle">pkg/backend</text><text class="s" x="585" y="662" text-anchor="middle">proc · runc · gVisor · Hyperlight</text>
  <rect class="bluebox" x="862" y="610" width="268" height="70" rx="14"/>
  <text class="h blue" x="996" y="638" text-anchor="middle">pkg/sys · Linux mechanisms</text><text class="s" x="996" y="662" text-anchor="middle">cgroup v2 · CRIU</text>
  <path class="arrow" d="M308 645h80M782 645h80" marker-end="url(#architecture-components-arrow)"/>
  <text class="s" x="348" y="634" text-anchor="middle">calls</text><text class="s" x="822" y="634" text-anchor="middle">uses where needed</text>
  <path class="inject" d="M889 472v76H188v62" marker-end="url(#architecture-components-violet-arrow)"/>
  <text class="s" x="600" y="740" text-anchor="middle">The selected backend may implement additional optional interfaces; the core consumes only capabilities it discovers.</text>
</svg>
