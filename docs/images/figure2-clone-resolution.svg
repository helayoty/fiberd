<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ab2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1a56db"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c62828"/>
    </marker>
    <marker id="ag2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8f98"/>
    </marker>
  </defs>
  <rect width="1500" height="620" fill="#fbfbfc"/>

  <!-- Router -->
  <rect x="45" y="230" width="180" height="110" rx="14" fill="#ffffff" stroke="#3d4a5c" stroke-width="2.5"/>
  <text x="135" y="295" text-anchor="middle" font-size="25" font-weight="bold" fill="#1f2937">Router / EPP</text>

  <!-- request path region -->
  <rect x="290" y="80" width="570" height="400" rx="20" fill="#e9f1ff" stroke="#7da2e8" stroke-width="2"/>
  <text x="575" y="126" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a56db">request path (ms) — node-local</text>

  <rect x="325" y="220" width="200" height="120" rx="12" fill="#ffffff" stroke="#1a56db" stroke-width="2.5"/>
  <text x="425" y="272" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Grant agent</text>
  <text x="425" y="303" text-anchor="middle" font-size="19" fill="#4b5563">verify · budget</text>

  <polygon points="690,185 825,280 690,375 555,280" fill="#ffffff" stroke="#e8a90c" stroke-width="2.5"/>
  <text x="690" y="272" text-anchor="middle" font-size="23" font-weight="bold" fill="#8a6100">session S</text>
  <text x="690" y="301" text-anchor="middle" font-size="23" font-weight="bold" fill="#8a6100">known?</text>

  <line x1="228" y1="283" x2="317" y2="283" stroke="#1a56db" stroke-width="3.5" marker-end="url(#ab2)"/>
  <text x="272" y="254" text-anchor="middle" font-size="20" fill="#1a56db">Clone(S)</text>
  <line x1="528" y1="280" x2="547" y2="280" stroke="#1a56db" stroke-width="3.5" marker-end="url(#ab2)"/>

  <!-- shed -->
  <rect x="325" y="500" width="200" height="90" rx="12" fill="#fdeceb" stroke="#c62828" stroke-width="2.5"/>
  <text x="425" y="546" text-anchor="middle" font-size="23" font-weight="bold" fill="#b71c1c">SHED · 429</text>
  <text x="425" y="575" text-anchor="middle" font-size="15" fill="#b71c1c">budget · GPU high · CP down</text>
  <line x1="425" y1="343" x2="425" y2="492" stroke="#c62828" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ar2)"/>
  <text x="510" y="428" text-anchor="middle" font-size="19" fill="#c62828">over budget</text>

  <rect x="565" y="500" width="260" height="90" rx="12" fill="#f4f4f6" stroke="#6b7280" stroke-width="2.5"/>
  <text x="695" y="546" text-anchor="middle" font-size="20" font-weight="bold" fill="#374151">DEFERRED_FALLBACK</text>
  <text x="695" y="574" text-anchor="middle" font-size="15" fill="#4b5563">CP healthy → pod path</text>
  <line x1="490" y1="343" x2="662" y2="494" stroke="#8a8f98" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ag2)"/>
  <text x="655" y="448" text-anchor="middle" font-size="17" fill="#6b7280">no capacity, CP up</text>

  <!-- outcomes (wider boxes, fitted text) -->
  <rect x="920" y="85" width="310" height="105" rx="12" fill="#eef7ee" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1075" y="130" text-anchor="middle" font-size="23" font-weight="bold" fill="#2e7d32">attach · ~0 ms</text>
  <text x="1075" y="162" text-anchor="middle" font-size="18" fill="#3d6b40">same endpoint · fence kept</text>

  <rect x="920" y="252" width="310" height="105" rx="12" fill="#e6f3f2" stroke="#00796b" stroke-width="2.5"/>
  <text x="1075" y="297" text-anchor="middle" font-size="23" font-weight="bold" fill="#00695c">resume · sub-second</text>
  <text x="1075" y="329" text-anchor="middle" font-size="18" fill="#2f6b64">state as parked · seq+1</text>

  <rect x="920" y="420" width="310" height="105" rx="12" fill="#f5ecf8" stroke="#7b1fa2" stroke-width="2.5"/>
  <text x="1075" y="465" text-anchor="middle" font-size="23" font-weight="bold" fill="#6a1b8a">fork zygote · ~ms</text>
  <text x="1075" y="497" text-anchor="middle" font-size="18" fill="#5e3a6e">from template · seq+1</text>

  <line x1="800" y1="220" x2="912" y2="150" stroke="#1a56db" stroke-width="3" marker-end="url(#ab2)"/>
  <text x="868" y="158" text-anchor="middle" font-size="19" fill="#1a56db">running</text>
  <line x1="829" y1="283" x2="912" y2="300" stroke="#1a56db" stroke-width="3" marker-end="url(#ab2)"/>
  <text x="872" y="268" text-anchor="middle" font-size="19" fill="#1a56db">parked</text>
  <line x1="800" y1="340" x2="912" y2="458" stroke="#1a56db" stroke-width="3" marker-end="url(#ab2)"/>
  <text x="838" y="418" text-anchor="middle" font-size="19" fill="#1a56db">new</text>

  <!-- endpoint pill -->
  <rect x="1305" y="245" width="165" height="120" rx="60" fill="#eef7ee" stroke="#2e7d32" stroke-width="3"/>
  <text x="1387" y="295" text-anchor="middle" font-size="23" font-weight="bold" fill="#2e7d32">endpoint</text>
  <text x="1387" y="326" text-anchor="middle" font-size="23" font-weight="bold" fill="#2e7d32">+ fence</text>

  <line x1="1234" y1="138" x2="1338" y2="250" stroke="#1a56db" stroke-width="3" marker-end="url(#ab2)"/>
  <line x1="1234" y1="305" x2="1297" y2="305" stroke="#1a56db" stroke-width="3" marker-end="url(#ab2)"/>
  <line x1="1234" y1="472" x2="1338" y2="362" stroke="#1a56db" stroke-width="3" marker-end="url(#ab2)"/>
</svg>
