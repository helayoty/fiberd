<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Helvetica Neue, Arial, sans-serif">
  <title>The Slurm example</title>
  <desc>The issuer mints a grant for the node; sbatch starts fiberd-job.sh, which runs fiberd-slurm inside the allocation; the agent verifies the grant, lives in the job step's cgroup under the job's memory limit, uses scontrol as liveness and the allocation's GRES as its fabric channel; the conformance suite and the overcommit storm run against allocations in Slurm-in-Docker.</desc>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect width="820" height="470" fill="#ffffff"/>

  <rect x="30" y="30" width="760" height="300" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="45" y="54" font-size="13" font-weight="600" fill="#333">Slurm node in Docker (slurmctld, slurmd, cgroup v2, task/cgroup)</text>

  <rect x="50" y="72" width="220" height="90" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="160" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">grant-issuer serve</text>
  <text x="160" y="114" text-anchor="middle" font-size="11" fill="#1a1a1a">the control plane</text>
  <text x="160" y="130" text-anchor="middle" font-size="11" fill="#1a1a1a">mint: aud = the node's name</text>
  <text x="160" y="146" text-anchor="middle" font-size="11" fill="#1a1a1a">JWKS at :8686</text>

  <rect x="300" y="72" width="220" height="90" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="410" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">sbatch fiberd-job.sh</text>
  <text x="410" y="114" text-anchor="middle" font-size="11" fill="#1a1a1a">--cpus-per-task 4 --mem 1G</text>
  <text x="410" y="130" text-anchor="middle" font-size="11" fill="#1a1a1a">FIBERD_GRANT in the environment</text>
  <text x="410" y="146" text-anchor="middle" font-size="11" fill="#1a1a1a">restarts the agent in place</text>

  <rect x="550" y="72" width="220" height="90" rx="6" fill="#b0e3e6" stroke="#0e8088"/>
  <text x="660" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">fiberd-slurm</text>
  <text x="660" y="114" text-anchor="middle" font-size="11" fill="#1a1a1a">verifies the grant offline, stages it</text>
  <text x="660" y="130" text-anchor="middle" font-size="11" fill="#1a1a1a">runs pkg/agent with the Slurm home</text>
  <text x="660" y="146" text-anchor="middle" font-size="11" fill="#1a1a1a">refuses fibers.max above the CPUs</text>

  <polyline points="270,117 300,117" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
  <polyline points="520,117 550,117" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="50" y="190" width="720" height="120" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="410" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">system.slice/slurmstepd.scope/job_1 (memory.max = --mem, the block ceiling)</text>
  <text x="410" y="236" text-anchor="middle" font-size="11" fill="#1a1a1a">step_batch/user/task_0/agent: fiberd-slurm and the job script</text>
  <text x="410" y="256" text-anchor="middle" font-size="11" fill="#1a1a1a">step_batch/user/task_0/fiberd/&lt;grant&gt;/zygote and f-&lt;epoch&gt;-&lt;seq&gt; (memory delegated; the step has no pids controller)</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" fill="#1a1a1a">liveness: scontrol show job says RUNNING · fabric: GRES · scope: job, user, partition, node, CPUs</text>
  <text x="410" y="296" text-anchor="middle" font-size="11" fill="#1a1a1a">the job ending: SIGTERM forwarded to the agent, which leaves with the allocation</text>

  <polyline points="660,162 660,190" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>

  <rect x="30" y="360" width="370" height="90" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="215" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">grant-conform on the host</text>
  <text x="215" y="404" text-anchor="middle" font-size="11" fill="#1a1a1a">C1 to C10 against the published port</text>
  <text x="215" y="422" text-anchor="middle" font-size="11" fill="#1a1a1a">hooks through docker exec; restart is the job script</text>
  <text x="215" y="438" text-anchor="middle" font-size="11" fill="#1a1a1a">restarting the agent in the same allocation</text>

  <rect x="420" y="360" width="370" height="90" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="605" y="382" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">the storm in a second allocation</text>
  <text x="605" y="404" text-anchor="middle" font-size="11" fill="#1a1a1a">--mem 384M, 160 MiB grant ceiling, 2x demand</text>
  <text x="605" y="422" text-anchor="middle" font-size="11" fill="#1a1a1a">first park at PSI ~50%, no OOM kill</text>
  <text x="605" y="438" text-anchor="middle" font-size="11" fill="#1a1a1a">the grant cgroup closes swap so the ladder sees pressure</text>

  <polyline points="215,360 215,310" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
  <polyline points="605,360 605,310" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
</svg>
