<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="slurm-title slurm-desc">
  <title id="slurm-title">Slurm example with a fiberd capacity home inside one allocation</title>
  <desc id="slurm-desc">A grant issuer signs capacity for a Slurm node. sbatch requests resources and Slurm creates a job-step cgroup. Inside the allocation, fiberd-job starts fiberd-slurm, stages the grant, and watches job state. The agent warms one template and creates fibers within the allocation. Callers use Clone and connect to the returned node address and fiber port.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.bluebox{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.allocation{fill:var(--teal-bg);stroke:var(--teal);stroke-width:2}.violetbox{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.amberbox{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.greenbox{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.cap{font-size:12px;font-weight:700;letter-spacing:.5px}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}.direct{fill:none;stroke:var(--green);stroke-width:2.5}.dash{stroke-dasharray:7 5}
  </style>
  <defs><marker id="slurm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#7b8794"/></marker><marker id="slurm-green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#287a4d"/></marker></defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="42" y="48">Slurm example: the allocation is the capacity home</text>
  <text class="subtitle" x="42" y="74">Slurm allocates CPU, memory, node, and devices; fiberd activates fibers only inside that allocation.</text>
  <text class="cap" x="42" y="112">BEFORE THE JOB SERVES</text>
  <rect class="violetbox" x="42" y="132" width="250" height="106" rx="15"/>
  <text class="h violet" x="167" y="164" text-anchor="middle">1 · Grant issuer</text><text class="b" x="167" y="194" text-anchor="middle">node audience + bounded capacity</text><text class="s" x="167" y="218" text-anchor="middle">signs JWT · publishes JWKS</text>
  <rect class="bluebox" x="392" y="132" width="250" height="106" rx="15"/>
  <text class="h blue" x="517" y="164" text-anchor="middle">2 · sbatch</text><text class="b" x="517" y="194" text-anchor="middle">requests CPU · memory · GRES</text><text class="s" x="517" y="218" text-anchor="middle">stages JWT · starts fiberd-job</text>
  <rect class="allocation" x="742" y="132" width="250" height="106" rx="15"/>
  <text class="h teal" x="867" y="164" text-anchor="middle">3 · Slurm scheduler</text><text class="b" x="867" y="194" text-anchor="middle">places job on one node</text><text class="s" x="867" y="218" text-anchor="middle">creates job-step cgroup</text>
  <path class="arrow" d="M292 185h100M642 185h100" marker-end="url(#slurm-arrow)"/>

  <rect class="allocation" x="232" y="292" width="926" height="356" rx="23"/>
  <text class="h teal" x="262" y="327">SLURM ALLOCATION + JOB-STEP CGROUP</text>
  <text class="s" x="1128" y="327" text-anchor="end">requested CPU and memory remain the aggregate ceiling</text>
  <rect class="panel" x="262" y="376" width="168" height="106" rx="15"/>
  <text class="h" x="346" y="408" text-anchor="middle">Router / client</text><text class="b" x="346" y="438" text-anchor="middle">1 · Clone</text><text class="s" x="346" y="463" text-anchor="middle">published agent address</text>
  <rect class="bluebox" x="500" y="358" width="220" height="145" rx="16"/>
  <text class="h blue" x="610" y="390" text-anchor="middle">4 · fiberd-slurm</text><text class="b" x="610" y="419" text-anchor="middle">verify grant for node</text><text class="b" x="610" y="443" text-anchor="middle">own cgroup subtree</text><text class="s" x="610" y="471" text-anchor="middle">enforce capacity + lifecycle</text>
  <rect class="panel" x="778" y="358" width="160" height="92" rx="15"/>
  <text class="h" x="858" y="390" text-anchor="middle">fiberd-job.sh</text><text class="s" x="858" y="419" text-anchor="middle">start / restart agent</text><text class="s" x="858" y="439" text-anchor="middle">scope loss on job end</text>
  <rect class="amberbox" x="778" y="482" width="160" height="88" rx="15"/>
  <text class="h amber" x="858" y="514" text-anchor="middle">Warm template</text><text class="s" x="858" y="541" text-anchor="middle">inside allocation</text>
  <rect class="greenbox" x="992" y="412" width="136" height="134" rx="15"/>
  <text class="h green" x="1060" y="445" text-anchor="middle">Fibers</text><text class="b" x="1060" y="476" text-anchor="middle">nodeIP:port</text><text class="s" x="1060" y="503" text-anchor="middle">process leaves</text><text class="s" x="1060" y="522" text-anchor="middle">up to max</text>
  <path class="arrow" d="M938 404h54M720 430h58M858 450v32M938 526h54" marker-end="url(#slurm-arrow)"/>
  <path class="arrow" d="M867 238v54" marker-end="url(#slurm-arrow)"/>
  <text class="s" x="882" y="270">allocation</text>
  <path class="arrow" d="M430 420h70" marker-end="url(#slurm-arrow)"/>
  <path class="arrow dash" d="M500 470h-42v38H346v-26" marker-end="url(#slurm-arrow)"/>
  <text class="s" x="428" y="524" text-anchor="middle">endpoint + fence</text>
  <path class="direct" d="M346 482v100h714v-36" marker-end="url(#slurm-green-arrow)"/>
  <text class="b green" x="690" y="606" text-anchor="middle">2 · connect directly to nodeIP:fiberPort</text>
  <text class="s" x="695" y="632" text-anchor="middle">Optional fabric devices are attached before the template warms; this example does not imply production GPU support.</text>
</svg>
