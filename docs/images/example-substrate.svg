<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="substrate-title substrate-desc">
  <title id="substrate-title">Agent Substrate example with embedded fiberd workers</title>
  <desc id="substrate-desc">Substrate provides its control plane, router, atelet supervisor, and snapshot movement. The router reaches each worker ingress over mutual TLS. atelet drives the herder over a shared local Unix socket. The herder embeds fiberd, obtains a grant, keeps one template warm, and routes the actor to a local fiber endpoint. Checkpointing parks and exports state from one worker; atelet or the Substrate snapshot path moves files for import and resume on another worker.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.worker{fill:var(--teal-bg);stroke:var(--teal);stroke-width:2}.bluebox{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.violetbox{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.amberbox{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.greenbox{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.cap{font-size:12px;font-weight:700;letter-spacing:.5px}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}.route{fill:none;stroke:var(--green);stroke-width:2.5}.move{fill:none;stroke:var(--amber);stroke-width:2.5;stroke-dasharray:8 5}
  </style>
  <defs><marker id="substrate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#7b8794"/></marker><marker id="substrate-green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#287a4d"/></marker><marker id="substrate-amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#a76500"/></marker></defs>
  <rect class="bg" width="1200" height="780"/>
  <text class="title" x="42" y="48">Agent Substrate example: actors as fibers</text>
  <text class="subtitle" x="42" y="74">Substrate supplies orchestration and routing; the worker image supplies herder, ingress, and embedded fiberd.</text>
  <rect class="panel" x="42" y="106" width="1116" height="144" rx="20"/>
  <text class="cap blue" x="68" y="140">SUBSTRATE-OWNED CONTROL AND DATA PLANE</text>
  <rect class="bluebox" x="68" y="164" width="230" height="62" rx="14"/><text class="h blue" x="183" y="190" text-anchor="middle">Control plane</text><text class="s" x="183" y="212" text-anchor="middle">schedule · suspend · restore</text>
  <rect class="violetbox" x="368" y="164" width="230" height="62" rx="14"/><text class="h violet" x="483" y="190" text-anchor="middle">atenet-router</text><text class="s" x="483" y="212" text-anchor="middle">actor assignment + request route</text>
  <rect class="bluebox" x="668" y="164" width="230" height="62" rx="14"/><text class="h blue" x="783" y="190" text-anchor="middle">atelet</text><text class="s" x="783" y="212" text-anchor="middle">drives worker lifecycle</text>
  <rect class="amberbox" x="968" y="164" width="164" height="62" rx="14"/><text class="h amber" x="1050" y="190" text-anchor="middle">Snapshot path</text><text class="s" x="1050" y="212" text-anchor="middle">upload / download</text>
  <path class="arrow" d="M298 195h70M598 195h70M898 195h70" marker-end="url(#substrate-arrow)"/>

  <rect class="worker" x="42" y="304" width="532" height="362" rx="22"/>
  <text class="h teal" x="70" y="339">WORKER A · one actor in current phase</text>
  <rect class="violetbox" x="70" y="374" width="198" height="84" rx="14"/>
  <text class="h violet" x="169" y="405" text-anchor="middle">ingress :443</text><text class="b" x="169" y="433" text-anchor="middle">router mTLS verified</text>
  <rect class="bluebox" x="320" y="374" width="226" height="84" rx="14"/>
  <text class="h blue" x="433" y="405" text-anchor="middle">herder · Ateom gRPC</text><text class="s" x="433" y="433" text-anchor="middle">atelet → shared local Unix socket</text>
  <rect class="panel" x="70" y="494" width="476" height="140" rx="16"/>
  <text class="cap teal" x="92" y="523">EMBEDDED FIBERD + WORKER HOME</text>
  <rect class="amberbox" x="92" y="545" width="182" height="66" rx="13"/><text class="h amber" x="183" y="572" text-anchor="middle">Warm template</text><text class="s" x="183" y="595" text-anchor="middle">grant sized for actor</text>
  <rect class="greenbox" x="326" y="545" width="198" height="66" rx="13"/><text class="h green" x="425" y="572" text-anchor="middle">Actor fiber</text><text class="s" x="425" y="595" text-anchor="middle">local Unix / TCP endpoint</text>
  <path class="arrow" d="M274 578h52" marker-end="url(#substrate-arrow)"/>
  <path class="route" d="M169 458v120h157" marker-end="url(#substrate-green-arrow)"/>
  <text class="s" x="232" y="568">proxy locally</text>
  <path class="arrow" d="M433 458v36" marker-end="url(#substrate-arrow)"/>

  <rect class="worker" x="626" y="304" width="532" height="362" rx="22"/>
  <text class="h teal" x="654" y="339">WORKER B · restore destination</text>
  <rect class="violetbox" x="654" y="374" width="198" height="84" rx="14"/>
  <text class="h violet" x="753" y="405" text-anchor="middle">ingress :443</text><text class="b" x="753" y="433" text-anchor="middle">router mTLS verified</text>
  <rect class="bluebox" x="904" y="374" width="226" height="84" rx="14"/>
  <text class="h blue" x="1017" y="405" text-anchor="middle">herder · Ateom gRPC</text><text class="s" x="1017" y="433" text-anchor="middle">ImportDelta → Clone = RESUME</text>
  <rect class="panel" x="654" y="494" width="476" height="140" rx="16"/>
  <text class="cap teal" x="676" y="523">EMBEDDED FIBERD + WORKER HOME</text>
  <rect class="amberbox" x="676" y="545" width="182" height="66" rx="13"/><text class="h amber" x="767" y="572" text-anchor="middle">Warm template</text><text class="s" x="767" y="595" text-anchor="middle">compatible parent</text>
  <rect class="greenbox" x="910" y="545" width="198" height="66" rx="13"/><text class="h green" x="1009" y="572" text-anchor="middle">Resumed fiber</text><text class="s" x="1009" y="595" text-anchor="middle">new local endpoint + fence</text>
  <path class="arrow" d="M858 578h52" marker-end="url(#substrate-arrow)"/>
  <path class="route" d="M753 458v120h157" marker-end="url(#substrate-green-arrow)"/>
  <path class="arrow" d="M1017 458v36" marker-end="url(#substrate-arrow)"/>

  <path class="route" d="M483 226v46H169v102" marker-end="url(#substrate-green-arrow)"/>
  <text class="s" x="330" y="264" text-anchor="middle">mTLS request tunnel</text>
  <path class="arrow" d="M783 226v46H433v102" marker-end="url(#substrate-arrow)"/>
  <text class="s" x="608" y="289" text-anchor="middle">Run / Checkpoint / Restore / Terminate</text>
  <path class="move" d="M433 634v58h617v-466" marker-end="url(#substrate-amber-arrow)"/>
  <text class="b amber" x="742" y="688" text-anchor="middle">Park(sync) + ExportDelta → atelet / snapshot path → ImportDelta</text>
  <path class="move" d="M1050 226v58h-33v90" marker-end="url(#substrate-amber-arrow)"/>
  <text class="s" x="600" y="734" text-anchor="middle">Checkpoint files contain full process-memory scope in this example; Substrate moves them, while fiberd owns the local park/resume mechanics.</text>
  <text class="s" x="600" y="754" text-anchor="middle">The integration is a consumer example, not a fork of Substrate and not a production control plane.</text>
</svg>
