<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="runtime-lifecycle-title runtime-lifecycle-desc">
  <title id="runtime-lifecycle-title">fiberd runtime lifecycle across process and sandbox backends</title>
  <desc id="runtime-lifecycle-desc">After a grant is admitted, fiberd warms one template. Create reserves a slot and establishes a new endpoint and fence for an incarnation. Observe tracks state, working set, exits, and grant lease. Park checkpoints an eligible named session and frees its running slot. Resume restores state as a new incarnation with a new fence and endpoint. Release destroys running state and may discard retained checkpoint data. Proc and runc use process and CRIU mechanisms; gVisor and Hyperlight use sandbox snapshots.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--red:#b33b32;--red-bg:#fff0ef;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--red:#ff8178;--red-bg:#321817;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.bluebox{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.tealbox{fill:var(--teal-bg);stroke:var(--teal);stroke-width:1.5}.violetbox{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.amberbox{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.redbox{fill:var(--red-bg);stroke:var(--red);stroke-width:1.5}.greenbox{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.cap{font-size:12px;font-weight:700;letter-spacing:.5px}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.red{fill:var(--red)}.green{fill:var(--green)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}.loop{fill:none;stroke:var(--violet);stroke-width:2;stroke-dasharray:7 5}
  </style>
  <defs><marker id="runtime-lifecycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#7b8794"/></marker><marker id="runtime-lifecycle-violet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#704aa1"/></marker></defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="42" y="48">Runtime lifecycle: one template, many incarnations</text>
  <text class="subtitle" x="42" y="74">The state machine is stable across backends; the process or sandbox mechanism underneath each transition differs.</text>
  <rect class="amberbox" x="42" y="144" width="196" height="126" rx="17"/>
  <text class="h amber" x="140" y="178" text-anchor="middle">WARM</text><text class="b" x="140" y="208" text-anchor="middle">prepare one template</text><text class="s" x="140" y="235" text-anchor="middle">grant becomes ready</text><text class="s" x="140" y="254" text-anchor="middle">idempotent per grant</text>
  <rect class="violetbox" x="282" y="144" width="196" height="126" rx="17"/>
  <text class="h violet" x="380" y="178" text-anchor="middle">CREATE</text><text class="b" x="380" y="208" text-anchor="middle">reserve slot · fork / restore</text><text class="s" x="380" y="235" text-anchor="middle">new endpoint + fence</text><text class="s" x="380" y="254" text-anchor="middle">incarnation begins</text>
  <rect class="tealbox" x="522" y="144" width="196" height="126" rx="17"/>
  <text class="h teal" x="620" y="178" text-anchor="middle">OBSERVE</text><text class="b" x="620" y="208" text-anchor="middle">W · exits · endpoint</text><text class="s" x="620" y="235" text-anchor="middle">grant lease + pressure</text><text class="s" x="620" y="254" text-anchor="middle">running session ledger</text>
  <polygon points="812,143 908,207 812,271 716,207" fill="var(--blue-bg)" stroke="var(--blue)" stroke-width="1.5"/>
  <text class="h blue" x="812" y="203" text-anchor="middle">Park or</text><text class="b" x="812" y="227" text-anchor="middle">release?</text>
  <rect class="amberbox" x="958" y="116" width="200" height="126" rx="17"/>
  <text class="h amber" x="1058" y="150" text-anchor="middle">PARK</text><text class="b" x="1058" y="180" text-anchor="middle">checkpoint named state</text><text class="s" x="1058" y="207" text-anchor="middle">running slot freed</text><text class="s" x="1058" y="226" text-anchor="middle">tier must support it</text>
  <rect class="redbox" x="958" y="296" width="200" height="126" rx="17"/>
  <text class="h red" x="1058" y="330" text-anchor="middle">RELEASE</text><text class="b" x="1058" y="360" text-anchor="middle">end running state</text><text class="s" x="1058" y="387" text-anchor="middle">free slot + session name</text><text class="s" x="1058" y="406" text-anchor="middle">discard can remove delta</text>
  <rect class="violetbox" x="718" y="324" width="190" height="98" rx="16"/>
  <text class="h violet" x="813" y="357" text-anchor="middle">RESUME</text><text class="b" x="813" y="386" text-anchor="middle">restore parked state</text><text class="s" x="813" y="408" text-anchor="middle">new endpoint + new fence</text>
  <path class="arrow" d="M238 207h44M478 207h44M718 207h-2M908 181h50M908 233h24v126h26" marker-end="url(#runtime-lifecycle-arrow)"/>
  <path class="arrow" d="M1058 242v42H813v40" marker-end="url(#runtime-lifecycle-arrow)"/>
  <path class="loop" d="M718 373H620V270" marker-end="url(#runtime-lifecycle-violet-arrow)"/>
  <text class="s" x="668" y="361" text-anchor="middle">new incarnation</text>

  <rect class="panel" x="42" y="492" width="534" height="192" rx="20"/>
  <text class="cap violet" x="68" y="527">PROCESS BACKENDS · proc / runc</text>
  <rect class="violetbox" x="68" y="552" width="220" height="96" rx="15"/>
  <text class="h violet" x="178" y="583" text-anchor="middle">Create</text><text class="b" x="178" y="611" text-anchor="middle">copy-on-write child</text><text class="s" x="178" y="634" text-anchor="middle">fiber cgroup leaf</text>
  <rect class="amberbox" x="328" y="552" width="220" height="96" rx="15"/>
  <text class="h amber" x="438" y="583" text-anchor="middle">Park / Resume</text><text class="b" x="438" y="611" text-anchor="middle">CRIU delta when available</text><text class="s" x="438" y="634" text-anchor="middle">runc keeps OCI container context</text>
  <rect class="panel" x="624" y="492" width="534" height="192" rx="20"/>
  <text class="cap blue" x="650" y="527">SANDBOX BACKENDS · gVisor / Hyperlight</text>
  <rect class="bluebox" x="650" y="552" width="220" height="96" rx="15"/>
  <text class="h blue" x="760" y="583" text-anchor="middle">Create</text><text class="b" x="760" y="611" text-anchor="middle">restore warm image</text><text class="s" x="760" y="634" text-anchor="middle">separate sandbox per fiber</text>
  <rect class="amberbox" x="910" y="552" width="220" height="96" rx="15"/>
  <text class="h amber" x="1020" y="583" text-anchor="middle">Park / Resume</text><text class="b" x="1020" y="611" text-anchor="middle">sandbox snapshot</text><text class="s" x="1020" y="634" text-anchor="middle">Hyperlight uses grant helper</text>
  <rect class="greenbox" x="42" y="708" width="1116" height="34" rx="13"/>
  <text class="b green" x="600" y="731" text-anchor="middle">Every successful CREATE or RESUME establishes a distinct incarnation; ATTACH reuses the running incarnation’s endpoint and fence.</text>
</svg>
