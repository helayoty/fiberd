<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="988" viewBox="0 0 1440 988" role="img" aria-labelledby="runtime-lifecycle-title runtime-lifecycle-desc">
  <title id="runtime-lifecycle-title">Running incarnations change; named sessions can survive</title>
  <desc id="runtime-lifecycle-desc">State transitions for one local session, with successful operations on the arrows. Absent or removed means no retained session record; Clone resolves to CREATE when no resumable state is found locally or through configured registry lookup. CREATE reuses the separate warm template, reserves a live slot, and mints a new fence and endpoint. Running named sessions ATTACH to themselves, preserving fence and endpoint. Successful Park on a checkpoint-capable backend ends the running incarnation and retains the name and delta without a live slot. Clone of parked state resolves to RESUME, restores that state, reserves a slot, and mints a new fence. Release, exit, or revocation removes running state and forgets its name; no direct public Release transition exists from parked state. Anonymous Clone always creates; an anonymous Park has no name by which to resume its delta. Restart advances the durable epoch and does not recover running fibers. It rewarms valid grants and can recover compatible parked state when its metadata and delta survive. Revocation and orphan cleanup are best effort. A remotely claimed or exported delta can cease to be owned locally; mobility and garbage collection are not expanded here.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--red:#b33b32;--red-bg:#fff0ef;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--red:#ff8178;--red-bg:#321817;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:17px}.muted{fill:var(--muted)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.red{fill:var(--red)}.center{text-anchor:middle}
    .template{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.state{stroke-width:2}.absent{fill:var(--panel);stroke:var(--border)}.running{fill:var(--violet-bg);stroke:var(--violet)}.parked{fill:var(--amber-bg);stroke:var(--amber)}.divider{stroke:var(--border);stroke-width:1.5}.transition{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.create{stroke:var(--violet)}.attach{stroke:var(--teal)}.park{stroke:var(--amber)}.remove{stroke:var(--red)}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs>
    <marker id="runtime-lifecycle-violet-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--violet)"/></marker>
    <marker id="runtime-lifecycle-teal-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--teal)"/></marker>
    <marker id="runtime-lifecycle-amber-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--amber)"/></marker>
    <marker id="runtime-lifecycle-red-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--red)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="988"/>
  <text class="title" x="48" y="66">Running incarnations change; named sessions can survive</text>
  <text class="body muted" x="48" y="100">States are nodes. Successful operations are transitions — not a fixed sequence.</text>
  <path class="divider" d="M48 130H1392"/>

  <rect class="template" x="80" y="188" width="308" height="116" rx="3"/>
  <rect class="template" x="72" y="196" width="308" height="116" rx="3"/>
  <rect class="template" x="64" y="204" width="308" height="116" rx="3"/>
  <text class="heading amber" x="88" y="246">Warm template</text>
  <text class="body" x="88" y="279">Reusable resource for CREATE</text>
  <text class="body muted" x="64" y="352">Not a session state; not consumed.</text>

  <text class="label" x="1068" y="245">Named sessions</text>
  <text class="body muted" x="1068" y="279">Keep their name across Park.</text>
  <text class="body muted" x="1068" y="310">Resume needs checkpoint support.</text>

  <rect class="state absent" x="48" y="458" width="320" height="166" rx="42"/>
  <text class="heading center" x="208" y="506">Absent / removed</text>
  <text class="body center" x="208" y="545">No retained session record</text>
  <text class="body center" x="208" y="578">No live slot</text>
  <rect class="state running" x="552" y="458" width="336" height="166" rx="42"/>
  <text class="heading violet center" x="720" y="506">Running</text>
  <text class="body center" x="720" y="545">Endpoint + current fence</text>
  <text class="body center" x="720" y="578">One live slot</text>
  <rect class="state parked" x="1072" y="458" width="320" height="166" rx="42"/>
  <text class="heading amber center" x="1232" y="506">Parked</text>
  <text class="body center" x="1232" y="545">Name + retained delta</text>
  <text class="body center" x="1232" y="578">No live slot</text>

  <path class="transition create" d="M368 541H552" marker-end="url(#runtime-lifecycle-violet-arrow)"/>
  <text class="body violet center" x="460" y="509">Clone → CREATE</text>
  <text class="body center" x="460" y="573">New fence</text>

  <path class="transition attach" d="M612 458V334H828V458" marker-end="url(#runtime-lifecycle-teal-arrow)"/>
  <text class="body teal center" x="720" y="376">Clone → ATTACH</text>
  <text class="body center" x="720" y="407">Same fence + endpoint</text>

  <path class="transition park" d="M888 500H1072" marker-end="url(#runtime-lifecycle-amber-arrow)"/>
  <text class="label amber center" x="980" y="470">Park</text>
  <text class="body center" x="980" y="527">Checkpoint state</text>
  <path class="transition create" d="M1072 582H888" marker-end="url(#runtime-lifecycle-violet-arrow)"/>
  <text class="body violet center" x="980" y="620">Clone → RESUME</text>
  <text class="body center" x="980" y="651">New fence</text>

  <path class="transition remove" d="M720 624V778H208V624" marker-end="url(#runtime-lifecycle-red-arrow)"/>
  <text class="label red center" x="464" y="717">Release / exit / revocation</text>
  <text class="body center" x="464" y="750">Free the slot; forget the name</text>
  <text class="body muted" x="1072" y="726">Public Release cannot address</text>
  <text class="body muted" x="1072" y="757">an already parked session.</text>

  <path class="divider" d="M48 830H1392"/>
  <text class="body" x="48" y="871">Anonymous Clone always creates; anonymous Park has no resumable session name.</text>
  <text class="body" x="48" y="909">Restart advances the epoch: running fibers are not recovered; surviving compatible parked state may resume.</text>
  <text class="body muted" x="48" y="947">Valid grants rewarm after restart. Revocation and orphan cleanup are best effort.</text>
</svg>
