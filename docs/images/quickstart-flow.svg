<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" role="img" aria-labelledby="quickstart-flow-title quickstart-flow-desc">
  <title id="quickstart-flow-title">Demonstrate create, attach, park, resume, and epoch invalidation</title>
  <desc id="quickstart-flow-desc">A numbered experiment, not a component diagram. Prepare the local in-memory demo using the commands below the image: build, serve issuer keys, start fiberd, and mint a grant. Clone session S to CREATE fence g1/1/1. Clone S again to ATTACH the same endpoint and fence. Park the returned fiber ID to free a running slot and retain named state. Clone S to RESUME with a new sequence, g1/1/2. Restart fiberd with the same FIBERD_STATE directory: epoch advances from 1 to 2 and Park with an old fiber ID returns 404. Operation text is shorthand for the executable commands in the guide; running and parked shapes show observed session state. The portable runtime simulates fibers rather than starting Linux workloads.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed;--red:#b33b32;--red-bg:#fff0ef}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e;--red:#ff8178;--red-bg:#321817}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.secondary{font-size:17px}.muted{fill:var(--muted)}.center{text-anchor:middle}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}.red{fill:var(--red)}
    .command{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:20px}.divider{stroke:var(--border);stroke-width:1.5}.state{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.template{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.number-bg{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.number{font-size:17px;font-weight:700;text-anchor:middle;fill:var(--blue)}.flow{fill:none;stroke:var(--blue);stroke-width:2}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs><marker id="quickstart-flow-blue-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--blue)"/></marker></defs>
  <rect class="bg" width="1440" height="1070"/>
  <text class="title" x="48" y="66">Create, attach, park, resume—then restart</text>
  <text class="secondary muted" x="48" y="100">One named session · portable in-memory demo · operation shorthand for the commands below.</text>
  <path class="divider" d="M48 130H1392"/>

  <circle class="number-bg" cx="72" cy="188" r="16"/>
  <text class="number" x="72" y="194">1</text>
  <text class="heading blue" x="118" y="195">Prepare the demo</text>
  <text class="label" x="118" y="233">make build → issuer keygen + serve → start fiberd → mint grant</text>
  <text class="secondary muted" x="118" y="266">Wait for /healthz · keep FIBERD_STATE · grant g1: max 2, W 1 MiB, lease 10m</text>
  <path class="divider" d="M48 298H1392"/>
  <text class="secondary muted" x="118" y="332">RUN OPERATION</text>
  <text class="secondary muted" x="648" y="332">OBSERVE RESULT</text>
  <text class="secondary muted center" x="1228" y="332">SESSION S</text>

  <circle class="number-bg" cx="72" cy="391" r="16"/>
  <text class="number" x="72" y="397">2</text>
  <text class="command" x="118" y="398">Clone("S")</text>
  <text class="secondary muted" x="118" y="432">Name not yet known</text>
  <path class="flow" d="M492 398H606" marker-end="url(#quickstart-flow-blue-arrow)"/>
  <text class="heading green" x="648" y="398">CREATE · g1/1/1</text>
  <text class="secondary" x="648" y="432">New endpoint and fence</text>
  <ellipse class="state" cx="1228" cy="409" rx="116" ry="38"/>
  <text class="label green center" x="1228" y="416">Running</text>
  <path class="divider" d="M118 470H1392"/>

  <circle class="number-bg" cx="72" cy="515" r="16"/>
  <text class="number" x="72" y="521">3</text>
  <text class="command" x="118" y="522">Clone("S")</text>
  <text class="secondary muted" x="118" y="556">Repeat the same request</text>
  <path class="flow" d="M492 522H606" marker-end="url(#quickstart-flow-blue-arrow)"/>
  <text class="heading blue" x="648" y="522">ATTACH · g1/1/1</text>
  <text class="secondary" x="648" y="556">Same endpoint and fence</text>
  <ellipse class="state" cx="1228" cy="533" rx="116" ry="38"/>
  <text class="label green center" x="1228" y="540">Still running</text>
  <path class="divider" d="M118 594H1392"/>

  <circle class="number-bg" cx="72" cy="639" r="16"/>
  <text class="number" x="72" y="645">4</text>
  <text class="command" x="118" y="646">Park("g1/1/1")</text>
  <text class="secondary muted" x="118" y="680">Use the returned fiber ID</text>
  <path class="flow" d="M492 646H606" marker-end="url(#quickstart-flow-blue-arrow)"/>
  <text class="heading amber" x="648" y="646">Success · slot freed</text>
  <text class="secondary" x="648" y="680">Named state retained</text>
  <rect class="template" x="1124" y="615" width="224" height="66" rx="3"/>
  <rect class="template" x="1116" y="623" width="224" height="66" rx="3"/>
  <text class="label amber center" x="1228" y="663">Parked</text>
  <path class="divider" d="M118 718H1392"/>

  <circle class="number-bg" cx="72" cy="763" r="16"/>
  <text class="number" x="72" y="769">5</text>
  <text class="command" x="118" y="770">Clone("S")</text>
  <text class="secondary muted" x="118" y="804">Request the parked name</text>
  <path class="flow" d="M492 770H606" marker-end="url(#quickstart-flow-blue-arrow)"/>
  <text class="heading violet" x="648" y="770">RESUME · g1/1/2</text>
  <text class="secondary" x="648" y="804">Same endpoint; new fence</text>
  <ellipse class="state" cx="1228" cy="781" rx="116" ry="38"/>
  <text class="label green center" x="1228" y="788">Running again</text>
  <path class="divider" d="M48 852H1392"/>

  <circle class="number-bg" cx="72" cy="901" r="16"/>
  <text class="number" x="72" y="907">6</text>
  <text class="heading blue" x="118" y="908">Restart fiberd</text>
  <text class="secondary" x="118" y="942">Reuse the same FIBERD_STATE</text>
  <path class="flow" d="M492 908H606" marker-end="url(#quickstart-flow-blue-arrow)"/>
  <text class="heading red" x="648" y="908">Epoch 1 → 2</text>
  <text class="secondary" x="648" y="942">Prior fences invalid</text>
  <text class="label red" x="1072" y="908">Park(old ID) → 404</text>
  <text class="secondary muted" x="1072" y="942">NotFound, not RESUME</text>
  <text class="secondary muted" x="48" y="1012">Inspect status and audit along the way. Admission and capacity-failure probes are in the runnable script.</text>
  <text class="secondary muted" x="48" y="1042">Development-only transport and runtime; real workload backends need the documented Linux prerequisites.</text>
</svg>
