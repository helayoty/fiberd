<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="736" viewBox="0 0 1440 736" role="img" aria-labelledby="quickstart-flow-title quickstart-flow-desc">
  <title id="quickstart-flow-title">What does the quickstart run?</title>
  <desc id="quickstart-flow-desc">The quickstart's steps in four rows, read left to right. Set up builds fiberd and its tools, starts the issuer and an agent on the in-memory runtime, which works on any OS, and mints a grant for 2 fibers of 1 MiB each with a 10 minute lease. Session S then runs Clone S, which answers CREATE with fiber g1/1/1, Clone S again, which answers ATTACH with the same fence, Park g1/1/1, and Clone S, which answers RESUME with g1/1/2. Misses and restart probes the refusals, HTTP 400, 503 and 429, stops the agent so its signed audit record verifies, restarts on the same state at epoch 2, and shows that Park g1/1/2 returns 404 because the restart ended it. On Linux, a real agent starts on the proc backend with a real template. Clone S and two calls count to 2, Park and Clone S resume it as g1/1/2, and the next call returns 3 because the state was kept.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.name{font-size:20px;font-weight:700}.lane{font-size:17px;font-weight:700}.secondary{font-size:17px}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.amber{fill:var(--amber)}.green{fill:var(--green)}
    .divider{fill:none;stroke:var(--border);stroke-width:1.5}
    .band{stroke-width:1.5;fill-opacity:.5;stroke-opacity:.55}.band-control{fill:var(--blue-bg);stroke:var(--blue)}.band-record{fill:var(--teal-bg);stroke:var(--teal)}.band-amberband{fill:var(--amber-bg);stroke:var(--amber)}.band-exec{fill:var(--green-bg);stroke:var(--green)}
    .box{fill:var(--panel);stroke-width:2}.blue-stroke{stroke:var(--blue)}.teal-stroke{stroke:var(--teal)}.amber-stroke{stroke:var(--amber)}.green-stroke{stroke:var(--green)}
    .flow{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs>
    <marker id="quickstart-flow-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--muted)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="736"/>
  <text class="title" x="48" y="66">What does the quickstart run?</text>
  <text class="secondary muted" x="48" y="100">The guide's steps in order, on any machine and then on Linux.</text>
  <path class="divider" d="M48 130H1392"/>

  <rect class="band band-control" x="48" y="160" width="1344" height="108" rx="12"/>
  <text class="lane blue" x="72" y="220">Set up</text>
  <rect class="box blue-stroke" x="248" y="176" width="256" height="76" rx="4"/>
  <text class="name blue" x="272" y="209">Build</text>
  <text class="secondary" x="272" y="236">fiberd and its tools</text>
  <rect class="box blue-stroke" x="536" y="176" width="256" height="76" rx="4"/>
  <text class="name blue" x="560" y="209">Start issuer and agent</text>
  <text class="secondary" x="560" y="236">in-memory runtime, any OS</text>
  <rect class="box blue-stroke" x="824" y="176" width="256" height="76" rx="4"/>
  <text class="name blue" x="848" y="209">Mint a grant</text>
  <text class="secondary" x="848" y="236">2 fibers · 1 MiB each · 10 min</text>

  <rect class="band band-record" x="48" y="296" width="1344" height="108" rx="12"/>
  <text class="lane teal" x="72" y="356">Session S</text>
  <rect class="box teal-stroke" x="248" y="312" width="256" height="76" rx="4"/>
  <text class="name teal" x="272" y="345">Clone S</text>
  <text class="secondary" x="272" y="372">CREATE · g1/1/1</text>
  <rect class="box teal-stroke" x="536" y="312" width="256" height="76" rx="4"/>
  <text class="name teal" x="560" y="345">Clone S again</text>
  <text class="secondary" x="560" y="372">ATTACH · same fence</text>
  <rect class="box teal-stroke" x="824" y="312" width="256" height="76" rx="4"/>
  <text class="name teal" x="848" y="345">Park g1/1/1</text>
  <text class="secondary" x="848" y="372">session parked</text>
  <rect class="box teal-stroke" x="1112" y="312" width="256" height="76" rx="4"/>
  <text class="name teal" x="1136" y="345">Clone S</text>
  <text class="secondary" x="1136" y="372">RESUME · g1/1/2</text>

  <rect class="band band-amberband" x="48" y="432" width="1344" height="108" rx="12"/>
  <text class="lane amber" x="72" y="492">Misses and restart</text>
  <rect class="box amber-stroke" x="248" y="448" width="256" height="76" rx="4"/>
  <text class="name amber" x="272" y="481">Probe refusals</text>
  <text class="secondary" x="272" y="508">400 · 503 · 429</text>
  <rect class="box amber-stroke" x="536" y="448" width="256" height="76" rx="4"/>
  <text class="name amber" x="560" y="481">Stop the agent</text>
  <text class="secondary" x="560" y="508">signed audit verifies</text>
  <rect class="box amber-stroke" x="824" y="448" width="256" height="76" rx="4"/>
  <text class="name amber" x="848" y="481">Restart</text>
  <text class="secondary" x="848" y="508">same state, epoch 2</text>
  <rect class="box amber-stroke" x="1112" y="448" width="256" height="76" rx="4"/>
  <text class="name amber" x="1136" y="481">Park g1/1/2</text>
  <text class="secondary" x="1136" y="508">404 · restart ended it</text>

  <rect class="band band-exec" x="48" y="588" width="1344" height="108" rx="12"/>
  <text class="lane green" x="72" y="648">On Linux</text>
  <rect class="box green-stroke" x="248" y="604" width="256" height="76" rx="4"/>
  <text class="name green" x="272" y="637">Start a real agent</text>
  <text class="secondary" x="272" y="664">proc backend, real template</text>
  <rect class="box green-stroke" x="536" y="604" width="256" height="76" rx="4"/>
  <text class="name green" x="560" y="637">Clone S, call twice</text>
  <text class="secondary" x="560" y="664">counter 1, then 2</text>
  <rect class="box green-stroke" x="824" y="604" width="256" height="76" rx="4"/>
  <text class="name green" x="848" y="637">Park, then Clone S</text>
  <text class="secondary" x="848" y="664">RESUME · g1/1/2</text>
  <rect class="box green-stroke" x="1112" y="604" width="256" height="76" rx="4"/>
  <text class="name green" x="1136" y="637">Call again</text>
  <text class="secondary" x="1136" y="664">counter 3 · state kept</text>

  <path class="flow" d="M504 214H536" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M792 214H824" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M504 350H536" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M792 350H824" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M1080 350H1112" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M504 486H536" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M792 486H824" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M1080 486H1112" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M504 642H536" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M792 642H824" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M1080 642H1112" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M952 252V282H376V312" marker-end="url(#quickstart-flow-arrow)"/>
  <path class="flow" d="M1240 388V418H376V448" marker-end="url(#quickstart-flow-arrow)"/>
</svg>
