<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="example-kubernetes-title example-kubernetes-desc">
  <title id="example-kubernetes-title">The controller sets up grant Pods, requests use their local capacity</title>
  <desc id="example-kubernetes-desc">A setup-versus-serving view. The CapacityGrant custom resource is desired-state data, fiberd-k8s-controller is a service in its own project, and the grant Pod is a resource boundary rather than a processing stage. The controller reconciles the CapacityGrant into one Deployment, drawn as a frame holding one grant Pod, which holds one container named fiberd. Inside that container, fiberd's Kubernetes home presents the Pod's projected service-account token to the controller, receives a signed grant whose UID is the Pod UID, keeps it in a memory-backed directory fibers cannot see, and renews it at half lease. fiberd verifies the grant, warms its template, then sets the fiberd.io/zygote-ready readiness gate. A separate local request path calls Clone, which selects one of the Pod's many fibers and returns its endpoint and a fence, and the caller connects to that fiber directly on the Pod IP. fiberd, the template and the fibers share the Pod's cgroup ceiling. There is no grant object and no grant Secret. This image describes the model from the fiberd change that adds the grant fetcher to the Kubernetes home onward. Until then fiberd reads grants from its grants directory and this image does not apply.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.secondary{font-size:17px}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.center{text-anchor:middle}
    .scope{fill:none;stroke:var(--teal);stroke-width:1.5}.service{fill:var(--panel);stroke:var(--blue);stroke-width:2}.agent{stroke:var(--teal)}.document{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.template{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:2}.actor{fill:var(--panel);stroke:var(--teal);stroke-width:2}.divider{fill:none;stroke:var(--border);stroke-width:1.5}.flow{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.setup{stroke:var(--blue)}.local{stroke:var(--teal)}.activation{stroke:var(--violet)}.base{stroke:var(--amber)}.return{stroke-dasharray:7 6}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs>
    <marker id="example-kubernetes-blue-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--blue)"/></marker>
    <marker id="example-kubernetes-teal-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--teal)"/></marker>
    <marker id="example-kubernetes-violet-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--violet)"/></marker>
    <marker id="example-kubernetes-amber-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--amber)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="1090"/>
  <text class="title" x="48" y="66">Reconcile capacity once. Serve fibers inside the Pod.</text>
  <path class="divider" d="M48 130H1392"/>
  <text class="heading blue" x="48" y="179">Controller setup</text>

  <path class="document" d="M48 212H360L388 240V340H48Z"/>
  <path class="flow setup" d="M360 212V240H388"/>
  <text class="label blue" x="72" y="286">CapacityGrant</text>

  <rect class="service" x="500" y="212" width="400" height="116" rx="4"/>
  <text class="label blue" x="524" y="278">fiberd-k8s-controller</text>
  <path class="flow setup" d="M388 278H500" marker-end="url(#example-kubernetes-blue-arrow)"/>
  <text class="secondary blue center" x="444" y="260">observe</text>


  <rect class="scope" x="488" y="382" width="904" height="622" rx="16" style="stroke:var(--blue)"/>
  <text class="heading blue" x="520" y="418">Deployment</text>
  <rect class="scope" x="508" y="436" width="864" height="552" rx="12"/>
  <text class="heading teal" x="540" y="470">grant Pod</text>
  <rect class="scope" x="528" y="488" width="824" height="484" rx="10"/>
  <text class="label teal" x="560" y="520">fiberd container</text>
  <path class="flow setup" d="M600 328V382" marker-end="url(#example-kubernetes-blue-arrow)"/>
  <text class="secondary blue" x="612" y="363">creates</text>

  <rect class="service agent" x="560" y="620" width="330" height="310" rx="4"/>
  <text class="heading teal" x="584" y="660">fiberd</text>
  <text class="secondary" x="584" y="691">-home kubernetes</text>
  <text class="secondary" x="584" y="722">verify grant</text>
  <text class="secondary" x="584" y="791">serve Clone</text>
  <path class="divider" d="M584 824H866"/>
  <text class="secondary teal" x="584" y="890">fiberd.io/zygote-ready</text>
  <path class="flow setup return" d="M880 620V328" marker-end="url(#example-kubernetes-blue-arrow)"/>
  <text class="secondary blue" x="892" y="560">fetch grant</text>

  <rect class="template" x="1056" y="636" width="304" height="104" rx="3"/>
  <rect class="template" x="1048" y="644" width="304" height="104" rx="3"/>
  <rect class="template" x="1040" y="652" width="304" height="104" rx="3"/>
  <text class="label amber" x="1064" y="695">Warm template</text>
  <path class="flow local" d="M890 706H1040" marker-end="url(#example-kubernetes-teal-arrow)"/>
  <text class="secondary teal center" x="965" y="688">warm</text>
  <circle class="fiber" cx="1070" cy="883" r="52"/>
  <text class="label violet center" x="1070" y="890">Fiber</text>
  <circle class="fiber" cx="1196" cy="883" r="52"/>
  <text class="label violet center" x="1196" y="890">Fiber</text>
  <circle class="fiber" cx="1322" cy="883" r="52"/>
  <text class="label violet center" x="1322" y="890">Fiber</text>
  <path class="flow base" d="M1196 756V831" marker-end="url(#example-kubernetes-amber-arrow)"/>
  <text class="secondary amber" x="1220" y="800">CREATE</text>
  <path class="flow activation" d="M890 883H1018" marker-end="url(#example-kubernetes-violet-arrow)"/>
  <text class="secondary violet center" x="954" y="863">select</text>

  <text class="heading teal" x="48" y="619">Local serving</text>
  <circle class="actor" cx="160" cy="673" r="16"/>
  <path class="actor" d="M128 727V715C128 688 192 688 192 715V727"/>
  <text class="label center" x="160" y="769">Caller</text>
  <path class="flow local" d="M220 719H560" marker-end="url(#example-kubernetes-teal-arrow)"/>
  <text class="secondary teal" x="276" y="700">1 · Clone</text>
  <path class="flow local return" d="M560 758H244" marker-end="url(#example-kubernetes-teal-arrow)"/>
  <text class="secondary teal" x="292" y="793">endpoint + fence</text>
  <path class="flow local" d="M160 795V1020H1070V935" marker-end="url(#example-kubernetes-teal-arrow)"/>
  <text class="secondary teal" x="560" y="1042">2 · data</text>
  <text class="secondary muted" x="48" y="1074">Clone never schedules a Pod.</text>
</svg>
