<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="example-k8s-title example-k8s-desc">
  <title id="example-k8s-title">Kubernetes example from CapacityGrant to serving fibers</title>
  <desc id="example-k8s-desc">The reference grant controller reconciles a CapacityGrant into a signed grant Secret and one grant Pod. The projected JWT reaches fiberd-k8s, which verifies and admits the grant, warms a template, and publishes readiness. A router calls Clone and then connects to the returned Pod IP and fiber port. The Pod boundary contains the agent, template, helpers, and fibers.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.bluebox{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.pod{fill:var(--teal-bg);stroke:var(--teal);stroke-width:2}.tealbox{fill:var(--teal-bg);stroke:var(--teal);stroke-width:1.5}.violetbox{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.amberbox{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.greenbox{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.cap{font-size:12px;font-weight:700;letter-spacing:.5px}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}.direct{fill:none;stroke:var(--green);stroke-width:2.5}.dash{stroke-dasharray:7 5}
  </style>
  <defs><marker id="example-k8s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#7b8794"/></marker><marker id="example-k8s-green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#287a4d"/></marker></defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="42" y="48">Kubernetes example: a grant Pod becomes ready capacity</text>
  <text class="subtitle" x="42" y="74">This is the repository’s reference integration, not a claim that core fiberd depends on Kubernetes.</text>
  <text class="cap" x="42" y="112">CONTROL PLANE</text>
  <rect class="bluebox" x="42" y="132" width="250" height="106" rx="15"/>
  <text class="h blue" x="167" y="164" text-anchor="middle">1 · CapacityGrant</text><text class="b" x="167" y="194" text-anchor="middle">template · max · W · Pod resources</text><text class="s" x="167" y="218" text-anchor="middle">status updated asynchronously</text>
  <rect class="violetbox" x="392" y="132" width="250" height="106" rx="15"/>
  <text class="h violet" x="517" y="164" text-anchor="middle">2 · grant-controller</text><text class="b" x="517" y="194" text-anchor="middle">creates Pod + owned Secret</text><text class="s" x="517" y="218" text-anchor="middle">mints / renews audience-bound JWT</text>
  <rect class="tealbox" x="742" y="132" width="250" height="106" rx="15"/>
  <text class="h teal" x="867" y="164" text-anchor="middle">3 · Signed grant Secret</text><text class="b" x="867" y="194" text-anchor="middle">grant.jwt projected into Pod</text><text class="s" x="867" y="218" text-anchor="middle">file lane notices updates</text>
  <path class="arrow" d="M292 185h100M642 185h100" marker-end="url(#example-k8s-arrow)"/>
  <rect class="pod" x="232" y="292" width="926" height="356" rx="23"/>
  <text class="h teal" x="262" y="327">GRANT POD</text><text class="s" x="1128" y="327" text-anchor="end">Pod cgroup + network boundary</text>
  <rect class="panel" x="262" y="376" width="168" height="102" rx="15"/>
  <text class="h" x="346" y="408" text-anchor="middle">Router</text><text class="b" x="346" y="437" text-anchor="middle">1 · Clone</text><text class="s" x="346" y="461" text-anchor="middle">outside or beside Pod</text>
  <rect class="bluebox" x="500" y="358" width="234" height="140" rx="16"/>
  <text class="h blue" x="617" y="390" text-anchor="middle">4 · fiberd-k8s</text><text class="b" x="617" y="419" text-anchor="middle">verify + admit JWT</text><text class="b" x="617" y="443" text-anchor="middle">ledger + backend + Clone</text><text class="s" x="617" y="471" text-anchor="middle">readiness after template warm</text>
  <rect class="amberbox" x="794" y="358" width="190" height="92" rx="16"/>
  <text class="h amber" x="889" y="390" text-anchor="middle">5 · Warm template</text><text class="b" x="889" y="419" text-anchor="middle">prepared once</text><text class="s" x="889" y="439" text-anchor="middle">for this grant</text>
  <rect class="greenbox" x="1018" y="358" width="110" height="140" rx="15"/>
  <text class="h green" x="1073" y="391" text-anchor="middle">Fibers</text><text class="b" x="1073" y="423" text-anchor="middle">:30001</text><text class="b" x="1073" y="447" text-anchor="middle">:30002</text><text class="s" x="1073" y="475" text-anchor="middle">up to max</text>
  <path class="arrow" d="M430 427h70M734 404h60M984 404h34" marker-end="url(#example-k8s-arrow)"/>
  <path class="arrow dash" d="M500 470h-42v40H346v-32" marker-end="url(#example-k8s-arrow)"/>
  <text class="s" x="430" y="527" text-anchor="middle">endpoint + fence</text>
  <path class="direct" d="M346 478v91h727v-71" marker-end="url(#example-k8s-green-arrow)"/>
  <text class="b green" x="704" y="559" text-anchor="middle">2 · connect directly to returned PodIP:port</text>
  <rect class="greenbox" x="500" y="536" width="234" height="53" rx="14"/>
  <text class="b green" x="617" y="559" text-anchor="middle">readiness gate = True</text><text class="s" x="617" y="579" text-anchor="middle">only after warm succeeds</text>
  <path class="arrow" d="M867 238v54" marker-end="url(#example-k8s-arrow)"/>
  <text class="s" x="884" y="270">volume projection</text>
  <rect class="bluebox" x="262" y="608" width="866" height="24" rx="12"/>
  <text class="s" x="695" y="625" text-anchor="middle">Agent, warm template, backend helpers, and fibers all consume the Pod’s aggregate resources.</text>
</svg>
