<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <title>How fiberd responds to grant pressure</title>
  <desc>fiberd uses the higher of memory PSI and reported device occupancy. At the shed threshold it refuses new creates and resumes but allows attach. At the reclaim threshold it selects the running fiber with the largest working set, parks it when it has a named session, or releases it when anonymous. After three persistent checks with no victim left, fiberd yields the grant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafcff"/>
      <stop offset="1" stop-color="#f1f5fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#182230" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#667085"/>
    </marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b42318"/>
    </marker>
  </defs>

  <rect width="1100" height="590" fill="url(#bg)"/>
  <text x="40" y="43" font-size="22" font-weight="700" fill="#172033">Pressure escalates from refusal to reclamation</text>
  <text x="40" y="67" font-size="11" fill="#667085">The higher pressure source drives one grant-wide response. Existing ATTACH requests remain available while fiberd sheds new runtime work.</text>

  <rect x="40" y="126" width="210" height="76" rx="14" fill="#ffffff" stroke="#7f9dc8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="157" text-anchor="middle" font-size="13" font-weight="700" fill="#24466f">Memory PSI</text>
  <text x="145" y="181" text-anchor="middle" font-size="10" fill="#52657c">grant cgroup some avg10</text>

  <rect x="40" y="244" width="210" height="76" rx="14" fill="#ffffff" stroke="#42a39a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="145" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#126b66">Device occupancy</text>
  <text x="145" y="299" text-anchor="middle" font-size="10" fill="#526d69">when the backend reports it</text>

  <polygon points="340,174 430,223 340,272 250,223" fill="#fff7dc" stroke="#d7a933" stroke-width="1.5"/>
  <text x="340" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#6f4d05">Use the higher</text>
  <text x="340" y="234" text-anchor="middle" font-size="10" fill="#805600">current pressure</text>

  <path d="M250 164H286" fill="none" stroke="#667085" stroke-width="1.8"/>
  <path d="M286 164V203" fill="none" stroke="#667085" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M250 282H286" fill="none" stroke="#667085" stroke-width="1.8"/>
  <path d="M286 282V243" fill="none" stroke="#667085" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="485" y="92" width="575" height="446" rx="22" fill="#ffffff" stroke="#b7c7e0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="515" y="126" font-size="14" font-weight="700" fill="#172033">One escalation ladder</text>

  <rect x="520" y="154" width="270" height="80" rx="14" fill="#fff7dc" stroke="#d7a933" stroke-width="1.5"/>
  <text x="655" y="181" text-anchor="middle" font-size="12" font-weight="700" fill="#6f4d05">1  Shed threshold: 10%</text>
  <text x="655" y="203" text-anchor="middle" font-size="10" fill="#805600">refuse CREATE and RESUME</text>
  <text x="655" y="220" text-anchor="middle" font-size="10" fill="#805600">allow ATTACH to running sessions</text>

  <path d="M430 223H520" fill="none" stroke="#667085" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="520" y="278" width="270" height="76" rx="14" fill="#fff0dc" stroke="#d88a20" stroke-width="1.5"/>
  <text x="655" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5200">2  Reclaim threshold: 25%</text>
  <text x="655" y="329" text-anchor="middle" font-size="10.5" fill="#8a5200">select the running fiber with largest W</text>
  <text x="655" y="346" text-anchor="middle" font-size="9.5" fill="#8a5200">repeat while a victim remains</text>

  <path d="M655 234V278" fill="none" stroke="#667085" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="674" y="261" font-size="9.5" fill="#667085">pressure rises</text>

  <polygon points="886,273 970,316 886,359 802,316" fill="#f5f0f9" stroke="#9875ba" stroke-width="1.5"/>
  <text x="886" y="311" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4b3158">Named</text>
  <text x="886" y="328" text-anchor="middle" font-size="10" fill="#704a80">session?</text>

  <path d="M790 316H802" fill="none" stroke="#667085" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="805" y="389" width="150" height="58" rx="13" fill="#e5f6ed" stroke="#3c9b67" stroke-width="1.5"/>
  <text x="880" y="414" text-anchor="middle" font-size="11.5" font-weight="700" fill="#245c3d">Park</text>
  <text x="880" y="433" text-anchor="middle" font-size="9.5" fill="#36704f">retain named state</text>

  <rect x="520" y="389" width="180" height="58" rx="13" fill="#f5f0f9" stroke="#9875ba" stroke-width="1.5"/>
  <text x="610" y="414" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4b3158">Release</text>
  <text x="610" y="433" text-anchor="middle" font-size="9.5" fill="#704a80">anonymous has no name</text>

  <path d="M886 359V389" fill="none" stroke="#667085" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="900" y="379" font-size="9.5" fill="#667085">yes</text>
  <path d="M802 316H744V418H700" fill="none" stroke="#667085" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="749" y="337" font-size="9.5" fill="#667085">no</text>

  <rect x="735" y="476" width="290" height="44" rx="13" fill="#fce8e6" stroke="#b42318" stroke-width="1.5"/>
  <text x="880" y="495" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8f241e">3  Yield the grant</text>
  <text x="880" y="512" text-anchor="middle" font-size="9.5" fill="#a33a34">after 3 persistent checks with no victim</text>

  <path d="M520 338H492V498H735" fill="none" stroke="#b42318" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#redArrow)"/>
  <text x="507" y="475" font-size="9.5" fill="#a33a34">no victim for 3 checks</text>
</svg>
