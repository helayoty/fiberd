<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
  </defs>
  <rect width="700" height="300" fill="#ffffff"/>

  <rect x="30" y="70" width="220" height="56" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="140" y="93" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">kernel PSI</text>
  <text x="140" y="110" text-anchor="middle" font-size="11" fill="#1a1a1a">(CPU / mem on the grant slice)</text>

  <rect x="30" y="180" width="220" height="66" rx="6" fill="#b0e3e6" stroke="#0e8088"/>
  <text x="140" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#1a1a1a">ledger device pressure</text>
  <text x="140" y="222" text-anchor="middle" font-size="10.5" fill="#1a1a1a">(engine KV occupancy +</text>
  <text x="140" y="236" text-anchor="middle" font-size="10.5" fill="#1a1a1a">queue depth)</text>

  <rect x="300" y="50" width="380" height="230" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="490" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#333">one ladder - expensive step last</text>

  <rect x="330" y="95" width="320" height="46" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="490" y="123" text-anchor="middle" font-size="12.5" fill="#1a1a1a">1. SHED - refuse new clones</text>
  <rect x="330" y="155" width="320" height="46" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="490" y="183" text-anchor="middle" font-size="12.5" fill="#1a1a1a">2. PARK - over-quota capacity first</text>
  <rect x="330" y="215" width="320" height="46" rx="6" fill="#f8cecc" stroke="#b85450"/>
  <text x="490" y="243" text-anchor="middle" font-size="12.5" fill="#1a1a1a">3. YIELD / evict - take the grant</text>

  <polyline points="250,105 290,105 290,118 330,118" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>
  <polyline points="250,210 285,210 285,178 330,178" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arw)"/>

  <polyline points="490,141 490,155" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <polyline points="490,201 490,215" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
</svg>
