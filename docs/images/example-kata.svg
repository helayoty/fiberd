<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="kata-title kata-desc">
  <title id="kata-title">Kata-shaped containerd shim mapping a Pod container to a fiber</title>
  <desc id="kata-desc">A Pod selects the fiberd runtime handler and carries grant, home, session, and stop policy. Kubelet calls containerd, which invokes the runtime-v2 fiberd shim. The shim records the sandbox and maps application Create to Clone, Kill to Park or Release, and the returned endpoint and fence to its container record. A parked named session resumes for a later Pod. This consumer mapping does not make a fiber an OCI container.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--red:#b33b32;--red-bg:#fff0ef;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--red:#ff8178;--red-bg:#321817;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.home{fill:var(--teal-bg);stroke:var(--teal);stroke-width:2}.bluebox{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.violetbox{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.amberbox{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.redbox{fill:var(--red-bg);stroke:var(--red);stroke-width:1.5}.greenbox{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.cap{font-size:12px;font-weight:700;letter-spacing:.5px}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.red{fill:var(--red)}.green{fill:var(--green)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}.dash{stroke-dasharray:7 5}
  </style>
  <defs><marker id="kata-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#7b8794"/></marker></defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="42" y="48">Kata-shaped example: container lifecycle outside, fiber lifecycle inside</text>
  <text class="subtitle" x="42" y="74">The shim translates containerd operations. It does not turn a fiber into an OCI container.</text>
  <text class="cap" x="42" y="112">KUBERNETES NODE</text>
  <rect class="panel" x="42" y="132" width="282" height="134" rx="16"/>
  <text class="h" x="66" y="165">1 · Pod specification</text><text class="b" x="66" y="195">runtimeClassName: fiberd</text><text class="b" x="66" y="219">grant + home + named session</text><text class="b" x="66" y="243">on-stop: park or release</text>
  <rect class="bluebox" x="420" y="132" width="282" height="134" rx="16"/>
  <text class="h blue" x="444" y="165">2 · kubelet → containerd</text><text class="b" x="444" y="195">select runtime handler</text><text class="b" x="444" y="219">pass fiberd annotations</text><text class="b" x="444" y="243">Create · Start · Kill · Delete</text>
  <rect class="violetbox" x="798" y="132" width="360" height="134" rx="16"/>
  <text class="h violet" x="822" y="165">3 · containerd-shim-fiberd-v1</text><text class="b" x="822" y="195">sandbox Create: record only</text><text class="b" x="822" y="219">app Create: Clone(session)</text><text class="b" x="822" y="243">Kill: Park or Release by policy</text>
  <path class="arrow" d="M324 199h96M702 199h96" marker-end="url(#kata-arrow)"/>
  <text class="s" x="372" y="188" text-anchor="middle">Pod admitted</text><text class="s" x="750" y="188" text-anchor="middle">runtime-v2 API</text>
  <rect class="home" x="244" y="314" width="914" height="250" rx="22"/>
  <text class="h teal" x="272" y="349">FIBERD HOME IN THE GRANT POD</text>
  <text class="s" x="1130" y="349" text-anchor="end">reached by gRPC in this example</text>
  <rect class="bluebox" x="284" y="393" width="250" height="120" rx="16"/>
  <text class="h blue" x="409" y="425" text-anchor="middle">Agent + ledger</text><text class="b" x="409" y="455" text-anchor="middle">resolve session</text><text class="b" x="409" y="479" text-anchor="middle">return kind + endpoint + fence</text><text class="s" x="409" y="500" text-anchor="middle">owns Park and Release</text>
  <rect class="amberbox" x="634" y="403" width="190" height="96" rx="16"/>
  <text class="h amber" x="729" y="435" text-anchor="middle">Warm template</text><text class="b" x="729" y="465" text-anchor="middle">already initialized</text><text class="s" x="729" y="486" text-anchor="middle">for the grant</text>
  <rect class="greenbox" x="924" y="393" width="190" height="120" rx="16"/>
  <text class="h green" x="1019" y="425" text-anchor="middle">Fiber</text><text class="b" x="1019" y="455" text-anchor="middle">named session</text><text class="b" x="1019" y="479" text-anchor="middle">endpoint + fence</text><text class="s" x="1019" y="500" text-anchor="middle">state retained only by Park</text>
  <path class="arrow" d="M534 453h100M824 453h100" marker-end="url(#kata-arrow)"/>
  <path class="arrow" d="M978 266v30H409v97" marker-end="url(#kata-arrow)"/><text class="s" x="694" y="289" text-anchor="middle">Clone · Park · Release</text>
  <path class="arrow dash" d="M409 393v-66h569v-61" marker-end="url(#kata-arrow)"/><text class="s" x="694" y="323" text-anchor="middle">shim container record: kind + endpoint + fence</text>
  <text class="cap" x="42" y="610">TWO-POD ACCEPTANCE FLOW</text>
  <rect class="bluebox" x="42" y="634" width="190" height="78" rx="14"/><text class="h blue" x="137" y="665" text-anchor="middle">Pod 1 · Create</text><text class="b" x="137" y="692" text-anchor="middle">CREATE session</text>
  <rect class="amberbox" x="272" y="634" width="190" height="78" rx="14"/><text class="h amber" x="367" y="665" text-anchor="middle">Delete Pod 1</text><text class="b" x="367" y="692" text-anchor="middle">Park state</text>
  <rect class="greenbox" x="502" y="634" width="190" height="78" rx="14"/><text class="h green" x="597" y="665" text-anchor="middle">Pod 2 · Create</text><text class="b" x="597" y="692" text-anchor="middle">RESUME session</text>
  <rect class="violetbox" x="732" y="634" width="190" height="78" rx="14"/><text class="h violet" x="827" y="665" text-anchor="middle">State continues</text><text class="b" x="827" y="692" text-anchor="middle">new fence</text>
  <rect class="redbox" x="962" y="634" width="196" height="78" rx="14"/><text class="h red" x="1060" y="665" text-anchor="middle">Delete Pod 2</text><text class="b" x="1060" y="692" text-anchor="middle">Release + discard</text>
  <path class="arrow" d="M232 673h40M462 673h40M692 673h40M922 673h40" marker-end="url(#kata-arrow)"/>
  <text class="s" x="600" y="744" text-anchor="middle">A parked session resumes only when its runtime satisfies the checkpoint tier; it never silently becomes fresh state.</text>
</svg>
