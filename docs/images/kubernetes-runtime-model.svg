<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="k8s-model-title k8s-model-desc">
  <title id="k8s-model-title">Kubernetes runtime model for a fiberd grant Pod</title>
  <desc id="k8s-model-desc">In the reference Kubernetes example, an external platform creates a CapacityGrant, the grant controller signs it and creates one grant Pod, and the Pod runs fiberd with one warm template and multiple fibers. A caller sends Clone and receives an endpoint and fence. Scaling out repeats the grant and Pod unit.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.bluebox{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.pod{fill:var(--teal-bg);stroke:var(--teal);stroke-width:2}.violetbox{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.amberbox{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.greenbox{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.cap{font-size:12px;font-weight:700;letter-spacing:.5px}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}.dash{stroke-dasharray:7 5}
  </style>
  <defs><marker id="k8s-model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#7b8794"/></marker></defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="42" y="48">Reference Kubernetes model: one grant becomes one warm Pod</text>
  <text class="subtitle" x="42" y="74">Kubernetes places the Pod; fiberd resolves fibers locally inside the Pod’s aggregate resource and network boundary.</text>
  <rect class="panel" x="42" y="108" width="1116" height="132" rx="18"/>
  <text class="cap blue" x="68" y="139">CONTROL PLANE</text>
  <rect class="bluebox" x="68" y="158" width="214" height="58" rx="13"/><text class="b blue" x="175" y="182" text-anchor="middle">External platform</text><text class="s" x="175" y="202" text-anchor="middle">placement + scale policy</text>
  <rect class="bluebox" x="368" y="158" width="214" height="58" rx="13"/><text class="b blue" x="475" y="182" text-anchor="middle">CapacityGrant</text><text class="s" x="475" y="202" text-anchor="middle">template + max + resources</text>
  <rect class="violetbox" x="668" y="158" width="214" height="58" rx="13"/><text class="b violet" x="775" y="182" text-anchor="middle">grant-controller</text><text class="s" x="775" y="202" text-anchor="middle">signs grant + creates Pod</text>
  <rect class="greenbox" x="968" y="158" width="164" height="58" rx="13"/><text class="b green" x="1050" y="182" text-anchor="middle">grant Pod</text><text class="s" x="1050" y="202" text-anchor="middle">example mapping</text>
  <path class="arrow" d="M282 187h86M582 187h86M882 187h86" marker-end="url(#k8s-model-arrow)"/>

  <rect class="panel" x="42" y="358" width="212" height="124" rx="16"/>
  <text class="h blue" x="148" y="392" text-anchor="middle">Caller or router</text>
  <text class="b" x="148" y="425" text-anchor="middle">Clone</text>
  <text class="s" x="148" y="451" text-anchor="middle">then uses returned endpoint</text>
  <rect class="pod" x="302" y="278" width="856" height="326" rx="22"/>
  <text class="h teal" x="332" y="313">GRANT POD</text>
  <text class="s" x="1128" y="313" text-anchor="end">one Pod IP · one aggregate CPU and memory ceiling</text>
  <rect class="panel" x="334" y="350" width="230" height="178" rx="16"/>
  <text class="h teal" x="449" y="382" text-anchor="middle">fiberd-k8s</text>
  <text class="b" x="449" y="414" text-anchor="middle">verify + ledger + lifecycle</text>
  <text class="b" x="449" y="439" text-anchor="middle">public Clone endpoint</text>
  <text class="s" x="449" y="469" text-anchor="middle">publishes aggregate readiness</text>
  <rect class="amberbox" x="626" y="350" width="230" height="102" rx="16"/>
  <text class="h amber" x="741" y="383" text-anchor="middle">Warm template</text>
  <text class="b" x="741" y="414" text-anchor="middle">one per admitted grant</text>
  <text class="s" x="741" y="437" text-anchor="middle">backend-specific source</text>
  <rect class="violetbox" x="906" y="350" width="112" height="132" rx="14"/>
  <text class="h violet" x="962" y="385" text-anchor="middle">Fiber A</text><text class="b" x="962" y="418" text-anchor="middle">endpoint</text><text class="b" x="962" y="442" text-anchor="middle">+ fence</text><text class="s" x="962" y="466" text-anchor="middle">incarnation</text>
  <rect class="violetbox" x="1038" y="350" width="88" height="132" rx="14" stroke-dasharray="7 5"/>
  <text class="h violet" x="1082" y="407" text-anchor="middle">+ N</text><text class="s" x="1082" y="438" text-anchor="middle">up to max</text>
  <path class="arrow" d="M564 405h62M856 405h50" marker-end="url(#k8s-model-arrow)"/>
  <rect class="bluebox" x="334" y="548" width="792" height="34" rx="13"/>
  <text class="b blue" x="730" y="571" text-anchor="middle">Agent, template, backend helpers, and fibers stay within the Pod’s aggregate limits.</text>
  <path class="arrow" d="M254 397h80" marker-end="url(#k8s-model-arrow)"/>
  <text class="s" x="294" y="387" text-anchor="middle">1 · Clone</text>
  <path class="arrow dash" d="M334 454h-42v48H148v-20" marker-end="url(#k8s-model-arrow)"/>
  <text class="s" x="248" y="519" text-anchor="middle">2 · endpoint + fence</text>
  <rect class="amberbox" x="302" y="632" width="856" height="54" rx="15"/>
  <text class="h amber" x="332" y="664">Scale out</text><text class="b" x="446" y="664">another CapacityGrant</text><text class="b" x="680" y="664">→ another grant Pod</text><text class="s" x="1128" y="664" text-anchor="end">external platform decision</text>
</svg>
