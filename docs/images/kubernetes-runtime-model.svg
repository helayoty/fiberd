<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <title>Kubernetes runtime model</title>
  <desc>An external platform creates a CapacityGrant. The grant controller signs the grant and creates one grant Pod. The Pod has one agent container with fiberd, one warm template, and multiple fibers. A caller sends Clone to the agent and receives the fiber endpoint and fence. Scaling out repeats the CapacityGrant and grant Pod unit.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafcff"/>
      <stop offset="1" stop-color="#f1f5fb"/>
    </linearGradient>
    <linearGradient id="podBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fffc"/>
      <stop offset="1" stop-color="#e8f7f3"/>
    </linearGradient>
    <linearGradient id="containerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f9fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#182230" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#667085"/>
    </marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3165b5"/>
    </marker>
    <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#704a80"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="url(#pageBg)"/>
  <text x="40" y="41" font-size="22" font-weight="700" fill="#172033">One CapacityGrant becomes one warm grant Pod</text>
  <text x="40" y="64" font-size="11" fill="#667085">Fibers are created locally inside that Pod, and additional Pods require additional grants</text>

  <!-- Control-plane flow -->
  <rect x="40" y="84" width="1020" height="142" rx="18" fill="#ffffff" stroke="#b7c7e0" filter="url(#shadow)"/>
  <text x="64" y="112" font-size="12" font-weight="700" fill="#24466f">Kubernetes control plane</text>

  <rect x="66" y="135" width="182" height="62" rx="12" fill="#fff7dc" stroke="#d7a933"/>
  <text x="157" y="159" text-anchor="middle" font-size="11" font-weight="700" fill="#6f4d05">External platform</text>
  <text x="157" y="178" text-anchor="middle" font-size="9" fill="#805600">placement and scale policy</text>

  <path d="M248 166H304" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="276" y="155" text-anchor="middle" font-size="8.5" fill="#667085">creates</text>

  <rect x="304" y="135" width="202" height="62" rx="12" fill="#e8f0fd" stroke="#7f9dc8"/>
  <text x="405" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#24466f">CapacityGrant</text>
  <text x="405" y="177" text-anchor="middle" font-size="9" fill="#52657c">template, max, W, Pod spec</text>

  <path d="M506 166H562" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="534" y="155" text-anchor="middle" font-size="8.5" fill="#667085">reconciles</text>

  <rect x="562" y="135" width="202" height="62" rx="12" fill="#f5f0f9" stroke="#9875ba"/>
  <text x="663" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#4b3158">grant-controller</text>
  <text x="663" y="177" text-anchor="middle" font-size="9" fill="#667085">signs grant, creates Pod</text>

  <path d="M764 166H820" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="792" y="155" text-anchor="middle" font-size="8.5" fill="#667085">produces</text>

  <rect x="820" y="135" width="210" height="62" rx="12" fill="#edf9f7" stroke="#42a39a"/>
  <text x="925" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#126b66">One grant Pod</text>
  <text x="925" y="177" text-anchor="middle" font-size="9" fill="#526d69">one Pod per CapacityGrant</text>

  <!-- Caller -->
  <rect x="40" y="368" width="174" height="104" rx="15" fill="#ffffff" stroke="#7f9dc8" filter="url(#shadow)"/>
  <text x="127" y="399" text-anchor="middle" font-size="13" font-weight="700" fill="#24466f">Caller or router</text>
  <rect x="69" y="420" width="116" height="27" rx="8" fill="#e8f0fd"/>
  <text x="127" y="438" text-anchor="middle" font-size="9.5" font-weight="700" fill="#24466f">protocol consumer</text>

  <!-- Grant Pod -->
  <rect x="250" y="258" width="810" height="350" rx="22" fill="url(#podBg)" stroke="#42a39a" stroke-width="2" filter="url(#shadow)"/>
  <text x="278" y="292" font-size="16" font-weight="700" fill="#126b66">Grant Pod</text>
  <text x="278" y="312" font-size="10" fill="#526d69">scheduled like any other Pod</text>
  <rect x="778" y="274" width="250" height="28" rx="14" fill="#ffffff" stroke="#9bc9c4"/>
  <text x="903" y="292" text-anchor="middle" font-size="9.5" font-weight="700" fill="#126b66">one per grant | not a DaemonSet</text>

  <!-- Agent container -->
  <rect x="278" y="330" width="750" height="245" rx="17" fill="url(#containerBg)" stroke="#aeb7c4"/>
  <text x="300" y="356" font-size="11" font-weight="700" fill="#344054">Agent container and parent cgroup</text>

  <rect x="302" y="379" width="190" height="126" rx="14" fill="#edf9f7" stroke="#42a39a" stroke-width="1.5"/>
  <text x="397" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#126b66">fiberd-k8s</text>
  <text x="397" y="425" text-anchor="middle" font-size="9" fill="#526d69">PID 1</text>
  <rect x="323" y="444" width="148" height="24" rx="8" fill="#d8f1ec"/>
  <text x="397" y="460" text-anchor="middle" font-size="9" font-weight="700" fill="#126b66">verify | ledger | lifecycle</text>
  <text x="397" y="488" text-anchor="middle" font-size="9" fill="#667085">publishes readiness</text>

  <path d="M492 423H542" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="517" y="412" text-anchor="middle" font-size="8.5" fill="#667085">warms</text>

  <rect x="542" y="379" width="220" height="86" rx="14" fill="#fff7dc" stroke="#d7a933"/>
  <text x="652" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#6f4d05">Warm template</text>
  <text x="652" y="426" text-anchor="middle" font-size="9" fill="#805600">one per admitted grant</text>
  <text x="652" y="445" text-anchor="middle" font-size="9" fill="#6e6250">fork or snapshot source</text>

  <path d="M762 422H798" stroke="#704a80" stroke-width="1.5" marker-end="url(#purpleArrow)"/>
  <text x="780" y="411" text-anchor="middle" font-size="8.5" fill="#704a80">local</text>

  <rect x="798" y="370" width="104" height="105" rx="13" fill="#f5f0f9" stroke="#9875ba"/>
  <text x="850" y="397" text-anchor="middle" font-size="11" font-weight="700" fill="#4b3158">Fiber A</text>
  <text x="850" y="418" text-anchor="middle" font-size="9" fill="#667085">process or</text>
  <text x="850" y="433" text-anchor="middle" font-size="9" fill="#667085">sandbox</text>
  <rect x="815" y="446" width="70" height="18" rx="9" fill="#eee6f6"/>
  <text x="850" y="459" text-anchor="middle" font-size="8" font-weight="700" fill="#704a80">endpoint A</text>

  <rect x="914" y="370" width="90" height="105" rx="13" fill="#f8f5fb" stroke="#9875ba" stroke-dasharray="5 4"/>
  <text x="959" y="400" text-anchor="middle" font-size="16" font-weight="700" fill="#704a80">+ N</text>
  <text x="959" y="423" text-anchor="middle" font-size="9" fill="#667085">fibers</text>
  <text x="959" y="443" text-anchor="middle" font-size="8.5" fill="#704a80">up to max</text>

  <rect x="302" y="526" width="702" height="29" rx="10" fill="#edf2fb"/>
  <text x="653" y="545" text-anchor="middle" font-size="9.5" font-weight="600" fill="#24466f">Agent, template, and every fiber share the container's aggregate CPU and memory limits.</text>

  <!-- Clone flow -->
  <path d="M214 397H302" stroke="#3165b5" stroke-width="2" marker-end="url(#blueArrow)"/>
  <rect x="220" y="369" width="78" height="22" rx="11" fill="#e8f0fd"/>
  <text x="259" y="384" text-anchor="middle" font-size="9" font-weight="700" fill="#24466f">1  Clone</text>

  <path d="M302 475H248V493H127V472" fill="none" stroke="#3165b5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#blueArrow)"/>
  <rect x="151" y="500" width="155" height="23" rx="11" fill="#e8f0fd"/>
  <text x="228" y="516" text-anchor="middle" font-size="9" font-weight="700" fill="#24466f">2  endpoint + fence</text>

  <!-- Scale-out unit -->
  <rect x="250" y="634" width="810" height="57" rx="16" fill="#ffffff" stroke="#d7a933"/>
  <text x="278" y="668" font-size="11" font-weight="700" fill="#805600">Scale out</text>
  <rect x="382" y="648" width="167" height="29" rx="10" fill="#e8f0fd" stroke="#9fb3ce"/>
  <text x="465" y="667" text-anchor="middle" font-size="9.5" font-weight="700" fill="#24466f">another CapacityGrant</text>
  <path d="M549 662H630" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="630" y="648" width="167" height="29" rx="10" fill="#edf9f7" stroke="#76bdb6"/>
  <text x="713" y="667" text-anchor="middle" font-size="9.5" font-weight="700" fill="#126b66">another grant Pod</text>
  <text x="824" y="667" font-size="9.5" fill="#667085">handled by the external platform</text>
</svg>
