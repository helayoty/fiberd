<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="942" viewBox="0 0 1440 942" role="img" aria-labelledby="kubernetes-runtime-model-title kubernetes-runtime-model-desc">
  <title id="kubernetes-runtime-model-title">Kubernetes schedules grant Pods, not fibers</title>
  <desc id="kubernetes-runtime-model-desc">Reference deployment topology, not a timed request flow. External platform policy creates a CapacityGrant API resource. The grant-issuer Deployment runs the grant-controller program, which reconciles that resource, creates one owned grant Pod, and creates or renews a Secret containing its signed grant JWT. The Secret is projected into the Pod's sole agent container. That container runs fiberd-k8s as PID 1 and contains one warm template and locally activated fibers. Kubernetes schedules the Pod; a Clone request does not schedule another Pod. The Pod supplies its IP, while the container supplies aggregate resource limits.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.scope{fill:none;stroke-width:1.5}.deployment{stroke:var(--violet)}.pod{stroke:var(--blue)}.container{stroke:var(--teal)}.actor{fill:var(--panel);stroke:var(--blue);stroke-width:2}.service{fill:var(--panel);stroke-width:2}.controller{stroke:var(--violet)}.agent{stroke:var(--teal)}.document{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.secret{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.template{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:2}
    .title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:17px}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}.center{text-anchor:middle}.divider{stroke:var(--border);stroke-width:1.5}.relation{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.platform{stroke:var(--blue)}.reconcile{stroke:var(--violet)}.projection{stroke:var(--green)}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs>
    <marker id="kubernetes-runtime-model-blue-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--blue)"/></marker>
    <marker id="kubernetes-runtime-model-violet-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--violet)"/></marker>
    <marker id="kubernetes-runtime-model-green-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--green)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="942"/>
  <text class="title" x="48" y="66">Kubernetes schedules grant Pods, not fibers</text>
  <text class="body muted" x="48" y="100">One CapacityGrant maps to one Pod. Fibers start inside that Pod.</text>
  <path class="divider" d="M48 130H1392"/>

  <rect class="actor" x="48" y="184" width="284" height="126" rx="4"/>
  <text class="heading blue" x="72" y="225">External platform</text>
  <text class="body" x="72" y="264">Placement + scale policy</text>
  <path class="document" d="M426 184H696L722 210V310H426Z"/>
  <path class="relation platform" d="M696 184V210H722"/>
  <text class="heading blue" x="450" y="225">CapacityGrant</text>
  <text class="body" x="450" y="264">Kubernetes API resource</text>
  <path class="relation platform" d="M332 247H426" marker-end="url(#kubernetes-runtime-model-blue-arrow)"/>
  <text class="body blue center" x="379" y="226">creates</text>

  <rect class="scope deployment" x="862" y="164" width="530" height="164" rx="12"/>
  <text class="label violet" x="886" y="200">grant-issuer Deployment</text>
  <rect class="service controller" x="886" y="219" width="482" height="85" rx="4"/>
  <text class="heading violet" x="910" y="254">grant-controller</text>
  <text class="body" x="910" y="283">Grant reconciliation + lease renewal</text>
  <path class="relation reconcile" d="M886 258H722" marker-end="url(#kubernetes-runtime-model-violet-arrow)"/>
  <text class="body violet center" x="792" y="240">reconciles</text>

  <path class="relation reconcile" d="M1080 304V378H198V574" marker-end="url(#kubernetes-runtime-model-violet-arrow)"/>
  <text class="body violet" x="224" y="364">creates / renews Secret</text>
  <path class="relation reconcile" d="M1270 304V416" marker-end="url(#kubernetes-runtime-model-violet-arrow)"/>
  <text class="body violet" x="1290" y="375">creates</text>
  <path class="secret" d="M48 574H320L348 602V704H48Z"/>
  <path class="relation projection" d="M320 574V602H348"/>
  <text class="heading green" x="72" y="617">Grant Secret</text>
  <text class="body" x="72" y="653">Signed JWT</text>
  <text class="body" x="72" y="683">Audience = grant Pod name</text>

  <rect class="scope pod" x="442" y="416" width="950" height="486" rx="16"/>
  <text class="heading blue" x="470" y="452">Grant Pod</text>
  <text class="body muted" x="638" y="452">Kubernetes scheduling unit · Pod IP</text>
  <rect class="scope container" x="470" y="494" width="894" height="380" rx="10"/>
  <text class="label teal" x="498" y="528">One container</text>
  <text class="body muted" x="706" y="528">Aggregate CPU + memory limits</text>
  <rect class="service agent" x="498" y="578" width="272" height="180" rx="4"/>
  <text class="heading teal" x="522" y="618">fiberd-k8s</text>
  <text class="body" x="522" y="652">PID 1 · local Clone handling</text>
  <text class="body" x="522" y="690">Verifies the projected grant</text>
  <text class="body" x="522" y="722">Manages template + fibers</text>
  <path class="relation projection" d="M348 639H498" marker-end="url(#kubernetes-runtime-model-green-arrow)"/>
  <text class="body green" x="360" y="618">projected</text>

  <rect class="template" x="884" y="570" width="428" height="100" rx="3"/>
  <rect class="template" x="876" y="578" width="428" height="100" rx="3"/>
  <rect class="template" x="868" y="586" width="428" height="100" rx="3"/>
  <text class="heading amber" x="894" y="626">One warm template</text>
  <text class="body" x="894" y="658">Admitted grant workload</text>
  <circle class="fiber" cx="978" cy="782" r="62"/>
  <text class="label violet center" x="978" y="782">Fiber A</text>
  <text class="body center" x="978" y="810">local</text>
  <circle class="fiber" cx="1212" cy="782" r="62"/>
  <text class="label violet center" x="1212" y="782">Fiber B</text>
  <text class="body center" x="1212" y="810">local</text>

</svg>
