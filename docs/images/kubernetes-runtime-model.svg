<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="942" viewBox="0 0 1440 942" role="img" aria-labelledby="kubernetes-runtime-model-title kubernetes-runtime-model-desc">
  <title id="kubernetes-runtime-model-title">Kubernetes schedules grant Pods, not fibers</title>
  <desc id="kubernetes-runtime-model-desc">Deployment topology, not a timed request flow. A tenant or platform creates a CapacityGrant API resource. The fiberd-k8s-controller Deployment, a separate project, reconciles it into one Deployment of grant Pods and lists the readiness gate fiberd.io/zygote-ready on them. The kubelet projects a service-account token bound to the Pod, with the controller as audience, into the Pod's only container, named fiberd. In that container fiberd runs with the Kubernetes home, which presents the token to the controller's grant endpoint, receives a signed grant whose UID is the Pod UID, keeps it in memory, handles Clone locally and answers the exec probes fiberd healthz and fiberd readyz. The container also holds one warm template and many locally activated fibers, which share its resource limits. There is no grant object and no grant Secret. Kubernetes schedules the Pod. A Clone request does not schedule another Pod. This image describes the model from the fiberd change that adds the grant fetcher to the Kubernetes home onward. Until then fiberd reads grants from its grants directory and this image does not apply.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.scope{fill:none;stroke-width:1.5}.deployment{stroke:var(--violet)}.pod{stroke:var(--blue)}.container{stroke:var(--teal)}.actor{fill:var(--panel);stroke:var(--blue);stroke-width:2}.service{fill:var(--panel);stroke-width:2}.controller{stroke:var(--violet)}.agent{stroke:var(--teal)}.document{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.template{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:2}
    .title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:17px}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}.center{text-anchor:middle}.divider{stroke:var(--border);stroke-width:1.5}.relation{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.platform{stroke:var(--blue)}.reconcile{stroke:var(--violet)}.projection{stroke:var(--green)}.fetch{stroke:var(--teal);stroke-dasharray:7 6}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
