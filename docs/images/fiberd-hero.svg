<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">fiberd places capacity once and activates fibers locally</title>
  <desc id="hero-desc">A control plane issues a signed CapacityGrant to a home. The fiberd agent verifies it, prepares a warm template, and resolves Clone requests locally. Each fiber incarnation receives an endpoint and fence while remaining inside grant and backend boundaries. Local operation during a control-plane outage depends on the grant lease, valid home scope, and healthy local runtime.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)} .bg{fill:var(--bg)} .panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.home{fill:var(--teal-bg);stroke:var(--teal);stroke-width:2}.control{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.warm{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.note{fill:var(--green-bg);stroke:var(--green)}.title{font-size:28px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.label{font-size:12px;font-weight:700}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}.dash{stroke-dasharray:7 5}
  </style>
  <defs><marker id="hero-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#7b8794"/></marker></defs>
  <rect class="bg" width="1240" height="700"/>
  <text class="title" x="44" y="48">Place capacity once. Activate fibers locally.</text>
  <text class="subtitle" x="44" y="74">Placement establishes a bounded grant; Clone resolves an already-admitted workload inside that boundary.</text>

  <rect class="control" x="44" y="128" width="250" height="154" rx="18"/>
  <text class="h" x="169" y="160" text-anchor="middle">Control plane</text>
  <text class="b" x="169" y="191" text-anchor="middle">places bounded capacity</text>
  <text class="b" x="169" y="214" text-anchor="middle">signs CapacityGrant</text>
  <text class="s" x="169" y="242" text-anchor="middle">lease + template + policy</text>

  <rect class="panel" x="44" y="374" width="250" height="154" rx="18"/>
  <text class="h" x="169" y="406" text-anchor="middle">Caller or router</text>
  <text class="b" x="169" y="437" text-anchor="middle">Clone(session)</text>
  <text class="b" x="169" y="460" text-anchor="middle">retains endpoint + fence</text>
  <text class="s" x="169" y="489" text-anchor="middle">then connects directly</text>

  <rect class="home" x="374" y="104" width="822" height="458" rx="22"/>
  <text class="h teal" x="402" y="139">Home / resource boundary</text>
  <text class="s" x="402" y="161">one agent can hold one or more separately bounded grants</text>
  <rect class="panel" x="404" y="205" width="222" height="176" rx="16"/>
  <text class="h teal" x="515" y="238" text-anchor="middle">fiberd agent</text>
  <text class="b" x="515" y="270" text-anchor="middle">verifies grant locally</text>
  <text class="b" x="515" y="293" text-anchor="middle">owns ledger + fences</text>
  <text class="b" x="515" y="316" text-anchor="middle">enforces grant policy</text>
  <text class="s" x="515" y="349" text-anchor="middle">reports aggregate status</text>

  <rect class="panel" x="670" y="183" width="490" height="319" rx="18"/>
  <text class="label teal" x="694" y="213">Admitted grant / backend boundary</text>
  <rect class="warm" x="706" y="239" width="418" height="76" rx="15"/>
  <text class="h amber" x="915" y="269" text-anchor="middle">Warm template</text>
  <text class="b" x="915" y="294" text-anchor="middle">prepared once; forked or restored by the selected backend</text>
  <path class="arrow" d="M915 315v34M915 349H790v32M915 349h125v32" marker-end="url(#hero-arrow)"/>
  <rect class="fiber" x="706" y="383" width="168" height="91" rx="14"/>
  <text class="h violet" x="790" y="411" text-anchor="middle">Fiber A</text>
  <text class="b" x="790" y="436" text-anchor="middle">endpoint + fence</text>
  <text class="s" x="790" y="458" text-anchor="middle">one incarnation</text>
  <rect class="fiber" x="956" y="383" width="168" height="91" rx="14"/>
  <text class="h violet" x="1040" y="411" text-anchor="middle">Fiber B</text>
  <text class="b" x="1040" y="436" text-anchor="middle">endpoint + fence</text>
  <text class="s" x="1040" y="458" text-anchor="middle">one incarnation</text>

  <path class="arrow" d="M294 205h54v71h54" marker-end="url(#hero-arrow)"/>
  <circle cx="348" cy="241" r="14" fill="var(--blue-bg)" stroke="var(--blue)"/><text class="label blue" x="348" y="245" text-anchor="middle">1</text>
  <path class="arrow" d="M626 263h42" marker-end="url(#hero-arrow)"/>
  <circle cx="647" cy="248" r="14" fill="var(--teal-bg)" stroke="var(--teal)"/><text class="label teal" x="647" y="252" text-anchor="middle">2</text>
  <path class="arrow" d="M294 419h74v-92h34" marker-end="url(#hero-arrow)"/>
  <circle cx="344" cy="419" r="14" fill="var(--violet-bg)" stroke="var(--violet)"/><text class="label violet" x="344" y="423" text-anchor="middle">3</text>
  <path class="arrow dash" d="M404 353h-68v116h-42" marker-end="url(#hero-arrow)"/>
  <circle cx="336" cy="438" r="14" fill="var(--violet-bg)" stroke="var(--violet)"/><text class="label violet" x="336" y="442" text-anchor="middle">4</text>
  <path class="arrow" d="M169 528v65h621V476" marker-end="url(#hero-arrow)"/>
  <circle cx="486" cy="593" r="14" fill="var(--violet-bg)" stroke="var(--violet)"/><text class="label violet" x="486" y="597" text-anchor="middle">5</text>

  <rect class="note" x="44" y="625" width="1152" height="48" rx="14"/>
  <text class="label" x="66" y="647">Outage boundary</text>
  <text class="b" x="190" y="647">Local serving and activation can continue only while the grant lease and home scope remain valid and the local runtime/template stay healthy.</text>
  <text class="s" x="66" y="665">1 grant → 2 warm → 3 Clone → 4 endpoint + fence → 5 direct connection. Fibers remain inside grant and backend limits.</text>
</svg>
