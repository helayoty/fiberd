<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="hyperlight-helper-protocol-title hyperlight-helper-protocol-desc">
  <title id="hyperlight-helper-protocol-title">PARKED acknowledges a snapshot write, not crash durability</title>
  <desc id="hyperlight-helper-protocol-desc">A sequence between a caller, the fiberd host runtime, and one Hyperlight helper per warm template. The helper owns the warm snapshot and all its fence-named sandboxes inside the grant cgroup. Control uses one line per message on helper fd 3, a Unix socketpair. A lifecycle primer shows CLONE followed by CLONED. The synchronous Park sequence is ordered: caller requests Park; runtime sends PARK with sync 1; helper stops serving and writes the snapshot while retaining the sandbox; helper sends PARKED, which does not establish crash durability; runtime fsyncs top-level snapshot files and their directory, then sends KILL. The runtime writes manifest.json while the sandbox exits; EXITED and manifest writing can race. Park returns after manifest writing and exit cleanup. The current host implementation does not sync that later manifest or recursively sync nested snapshot files, so the sequence is not a complete crash-durability guarantee. Later RESUME supplies a new fence, state directory and endpoint, and CLONED acknowledges that the restored sandbox serves. W and ERROR are asynchronous helper reports and are omitted from the main sequence.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--red:#b33b32;--red-bg:#fff0ef;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--red:#ff8178;--red-bg:#321817;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.secondary{font-size:17px}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.green{fill:var(--green)}.red{fill:var(--red)}.center{text-anchor:middle}
    .service{fill:var(--panel);stroke:var(--blue);stroke-width:2}.helper{stroke:var(--violet)}.scope{fill:none;stroke:var(--teal);stroke-width:1.5}.actor{fill:var(--panel);stroke:var(--blue);stroke-width:2}.template{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:2}.divider{fill:none;stroke:var(--border);stroke-width:1.5}.lifeline{stroke:var(--border);stroke-width:1.5;stroke-dasharray:5 6}.flow{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.request{stroke:var(--violet)}.reply{stroke:var(--blue);stroke-dasharray:7 6}.call{stroke:var(--blue)}.sync{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.warning{fill:var(--red-bg)}.action{fill:var(--bg)}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs>
    <marker id="hyperlight-helper-protocol-blue-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--blue)"/></marker>
    <marker id="hyperlight-helper-protocol-violet-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--violet)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="1160"/>
  <text class="title" x="48" y="66">PARKED is not a durability guarantee.</text>
  <text class="secondary muted" x="48" y="100">Hyperlight helper protocol · fd 3 Unix socketpair · one line per message · one outstanding operation per fence.</text>
  <path class="divider" d="M48 130H1392"/>

  <circle class="actor" cx="152" cy="205" r="16"/>
  <path class="actor" d="M120 258V246C120 219 184 219 184 246V258"/>
  <text class="label center" x="152" y="292">Caller</text>
  <rect class="service" x="406" y="188" width="332" height="100" rx="4"/>
  <text class="label blue center" x="572" y="228">fiberd host runtime</text>
  <text class="secondary center" x="572" y="261">Lifecycle + host-side sync</text>
  <rect class="scope" x="938" y="156" width="454" height="166" rx="12"/>
  <text class="secondary" x="962" y="181">Helper ownership · inside the grant cgroup</text>
  <rect class="service helper" x="962" y="196" width="406" height="52" rx="4"/>
  <text class="label violet center" x="1165" y="230">One helper per template</text>
  <rect class="template" x="970" y="260" width="160" height="42" rx="2"/>
  <rect class="template" x="965" y="265" width="160" height="42" rx="2"/>
  <text class="secondary center" x="1045" y="291">warm snapshot</text>
  <circle class="fiber" cx="1150" cy="284" r="12"/>
  <text class="secondary" x="1174" y="290">fence IDs, not PIDs</text>

  <path class="lifeline" d="M152 497V959M572 288V1080M1165 322V1080"/>
  <text class="secondary muted" x="48" y="356">Warm helper · READY received before Clone</text>
  <path class="flow request" d="M572 385H1165" marker-end="url(#hyperlight-helper-protocol-violet-arrow)"/>
  <text class="secondary violet" x="614" y="369">CLONE fence endpoint deadline payload</text>
  <path class="flow reply" d="M1165 426H572" marker-end="url(#hyperlight-helper-protocol-blue-arrow)"/>
  <text class="secondary blue" x="614" y="410">CLONED fence · now serving</text>

  <path class="divider" d="M48 455H1392"/>
  <text class="heading" x="48" y="491">Synchronous Park</text>
  <path class="flow call" d="M152 534H572" marker-end="url(#hyperlight-helper-protocol-blue-arrow)"/>
  <text class="secondary blue" x="214" y="517">1 · Park(sync=true)</text>
  <path class="flow request" d="M572 576H1165" marker-end="url(#hyperlight-helper-protocol-violet-arrow)"/>
  <text class="secondary violet" x="614" y="559">2 · PARK fence dir 1</text>
  <rect class="boundary action" x="994" y="593" width="380" height="59"/>
  <text class="secondary violet" x="1010" y="615">Stop serving; write snapshot</text>
  <text class="secondary" x="1010" y="642">Retain sandbox until KILL</text>
  <path class="flow reply" d="M1165 682H572" marker-end="url(#hyperlight-helper-protocol-blue-arrow)"/>
  <text class="secondary blue" x="614" y="666">3 · PARKED fence bytes · write complete only</text>

  <rect class="boundary sync" x="550" y="702" width="550" height="72" rx="5"/>
  <text class="label green" x="578" y="731">4 · Host fsync before teardown</text>
  <text class="secondary" x="578" y="759">Current syncDir: top-level files + directory</text>
  <path class="flow request" d="M572 810H1165" marker-end="url(#hyperlight-helper-protocol-violet-arrow)"/>
  <text class="secondary violet" x="614" y="794">5 · KILL fence</text>
  <path class="flow reply" d="M1165 852H572" marker-end="url(#hyperlight-helper-protocol-blue-arrow)"/>
  <text class="secondary blue" x="614" y="836">6 · EXITED fence · sandbox gone</text>
  <rect class="boundary action" x="550" y="866" width="628" height="33"/>
  <text class="secondary" x="578" y="889">Manifest write races EXITED; wait for both before return</text>
  <path class="flow reply" d="M572 927H152" marker-end="url(#hyperlight-helper-protocol-blue-arrow)"/>
  <text class="secondary blue" x="214" y="911">7 · Park returns to caller</text>

  <path class="divider" d="M48 960H1392"/>
  <text class="heading" x="48" y="999">Later Resume</text>
  <path class="flow request" d="M572 1016H1165" marker-end="url(#hyperlight-helper-protocol-violet-arrow)"/>
  <text class="secondary violet" x="614" y="999">RESUME new-fence dir endpoint deadline</text>
  <path class="flow reply" d="M1165 1058H572" marker-end="url(#hyperlight-helper-protocol-blue-arrow)"/>
  <text class="secondary blue" x="614" y="1042">CLONED new-fence · restored state serves again</text>

  <rect class="boundary warning" x="48" y="1090" width="1344" height="47" rx="4"/>
  <text class="secondary red" x="72" y="1120">Crash-durability limit: the later manifest and nested snapshot files are not covered by this host fsync path.</text>
</svg>
