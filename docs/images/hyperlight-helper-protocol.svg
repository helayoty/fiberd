<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="hyperlight-title hyperlight-desc">
  <title id="hyperlight-title">Hyperlight helper process protocol and durability boundary</title>
  <desc id="hyperlight-desc">The fiberd host runtime starts one helper process per warm template inside the grant cgroup and connects over a Unix socketpair exposed as helper file descriptor 3. The helper owns one warm snapshot and multiple Hyperlight sandboxes. fiberd sends CLONE, PARK, RESUME, and KILL. The helper sends READY, CLONED, PARKED, EXITED, working-set updates, and errors. PARKED means snapshot writing completed; for sync true, the host fsyncs the snapshot tree afterward before killing the retained sandbox. Crash durability still depends on the filesystem and artifact path.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--red:#b33b32;--red-bg:#fff0ef;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--red:#ff8178;--red-bg:#321817;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.grant{fill:var(--teal-bg);stroke:var(--teal);stroke-width:2}.bluebox{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.violetbox{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.amberbox{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.redbox{fill:var(--red-bg);stroke:var(--red);stroke-width:1.5}.greenbox{fill:var(--green-bg);stroke:var(--green);stroke-width:1.5}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.cap{font-size:12px;font-weight:700;letter-spacing:.5px}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.red{fill:var(--red)}.green{fill:var(--green)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}.tohelper{fill:none;stroke:var(--violet);stroke-width:2}.tohost{fill:none;stroke:var(--blue);stroke-width:2}
  </style>
  <defs><marker id="hyperlight-violet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#704aa1"/></marker><marker id="hyperlight-blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#3165b5"/></marker></defs>
  <rect class="bg" width="1200" height="780"/>
  <text class="title" x="42" y="48">Hyperlight helper: one warm snapshot, many sandboxes</text>
  <text class="subtitle" x="42" y="74">The Rust host API stays behind a small line protocol; the helper and every sandbox remain inside the grant cgroup.</text>
  <rect class="grant" x="42" y="108" width="1116" height="420" rx="22"/>
  <text class="cap teal" x="68" y="142">GRANT CGROUP</text>
  <rect class="bluebox" x="76" y="182" width="294" height="240" rx="17"/>
  <text class="h blue" x="223" y="216" text-anchor="middle">fiberd host runtime</text>
  <text class="b" x="100" y="252">• grant ledger + endpoint policy</text>
  <text class="b" x="100" y="280">• park directory + manifest</text>
  <text class="b" x="100" y="308">• W budget + lifecycle commit</text>
  <text class="b" x="100" y="336">• fsync path when sync=true</text>
  <text class="s" x="100" y="376">starts helper per warm template</text>
  <text class="s" x="100" y="397">cleans endpoints after EXITED</text>
  <rect class="panel" x="428" y="206" width="260" height="190" rx="17"/>
  <text class="h" x="558" y="240" text-anchor="middle">Unix socketpair</text>
  <text class="h violet" x="558" y="272" text-anchor="middle">helper fd 3</text>
  <text class="b" x="558" y="306" text-anchor="middle">one line per message</text>
  <text class="s" x="558" y="335" text-anchor="middle">one outstanding operation</text>
  <text class="s" x="558" y="354" text-anchor="middle">per fence</text>
  <text class="mono violet" x="558" y="382" text-anchor="middle">fence names a sandbox</text>
  <rect class="violetbox" x="746" y="164" width="378" height="316" rx="18"/>
  <text class="h violet" x="935" y="199" text-anchor="middle">One helper process / warm template</text>
  <text class="s" x="935" y="225" text-anchor="middle">Hyperlight helper or fakehelper</text>
  <rect class="amberbox" x="780" y="256" width="310" height="70" rx="15"/>
  <text class="h amber" x="935" y="284" text-anchor="middle">Warm guest snapshot</text>
  <text class="s" x="935" y="307" text-anchor="middle">READY after guest init + snapshot</text>
  <rect class="greenbox" x="780" y="358" width="136" height="82" rx="14"/>
  <text class="h green" x="848" y="388" text-anchor="middle">Sandbox A</text><text class="s" x="848" y="415" text-anchor="middle">fiber · no PID</text>
  <rect class="greenbox" x="954" y="358" width="136" height="82" rx="14"/>
  <text class="h green" x="1022" y="388" text-anchor="middle">Sandbox B</text><text class="s" x="1022" y="415" text-anchor="middle">fiber · no leaf</text>
  <path class="tohelper" d="M370 280h58M688 280h58" marker-end="url(#hyperlight-violet-arrow)"/>
  <path class="tohost" d="M746 326h-58M428 326h-58" marker-end="url(#hyperlight-blue-arrow)"/>
  <text class="s violet" x="558" y="192" text-anchor="middle">fiberd → helper</text>
  <text class="s blue" x="558" y="422" text-anchor="middle">helper → fiberd</text>
  <rect class="violetbox" x="76" y="447" width="520" height="56" rx="14"/>
  <text class="mono violet" x="96" y="472">CLONE · PARK · RESUME · KILL</text>
  <text class="s" x="96" y="492">endpoint, deadline, payload, snapshot directory, sync flag</text>
  <rect class="bluebox" x="620" y="447" width="504" height="56" rx="14"/>
  <text class="mono blue" x="640" y="472">READY · CLONED · PARKED · EXITED · W · ERROR</text>
  <text class="s" x="640" y="492">readiness, completion, exits, dirtied bytes, operation errors</text>

  <text class="cap" x="42" y="574">PARK COMPLETION VS CRASH DURABILITY</text>
  <rect class="amberbox" x="42" y="600" width="252" height="108" rx="16"/>
  <text class="h amber" x="168" y="632" text-anchor="middle">1 · PARK ... sync=1</text>
  <text class="b" x="168" y="662" text-anchor="middle">helper stops serving</text><text class="s" x="168" y="687" text-anchor="middle">sandbox remains alive for now</text>
  <rect class="bluebox" x="334" y="600" width="252" height="108" rx="16"/>
  <text class="h blue" x="460" y="632" text-anchor="middle">2 · PARKED fence bytes</text>
  <text class="b" x="460" y="662" text-anchor="middle">snapshot write completed</text><text class="s" x="460" y="687" text-anchor="middle">helper operation is complete</text>
  <rect class="greenbox" x="626" y="600" width="252" height="108" rx="16"/>
  <text class="h green" x="752" y="632" text-anchor="middle">3 · Host fsyncs tree</text>
  <text class="b" x="752" y="662" text-anchor="middle">occurs after PARKED</text><text class="s" x="752" y="687" text-anchor="middle">then host kills retained sandbox</text>
  <rect class="redbox" x="918" y="600" width="240" height="108" rx="16"/>
  <text class="h red" x="1038" y="632" text-anchor="middle">Durability boundary</text>
  <text class="b" x="1038" y="662" text-anchor="middle">PARKED ≠ universal</text><text class="b" x="1038" y="683" text-anchor="middle">crash-durability guarantee</text>
  <path class="arrow" d="M294 654h40M586 654h40M878 654h40" stroke="var(--muted)" marker-end="url(#hyperlight-blue-arrow)"/>
  <text class="s" x="600" y="746" text-anchor="middle">Final guarantees still depend on the configured filesystem and artifact store; sync=false ends the sandbox as part of checkpointing without the host fsync step.</text>
</svg>
