<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arwo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#d79b00"/></marker>
  </defs>
  <rect width="820" height="380" fill="#ffffff"/>

  <rect x="30" y="40" width="360" height="300" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="210" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#333">After fork() - nothing copied yet</text>
  <rect x="70" y="95" width="120" height="44" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="130" y="122" text-anchor="middle" font-size="13" fill="#1a1a1a">zygote</text>
  <rect x="240" y="95" width="120" height="44" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="300" y="122" text-anchor="middle" font-size="13" fill="#1a1a1a">fiber</text>
  <rect x="95" y="210" width="230" height="86" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="210" y="250" text-anchor="middle" font-size="12" fill="#1a1a1a">shared pages (128 MB)</text>
  <text x="210" y="268" text-anchor="middle" font-size="12" fill="#1a1a1a">one physical copy</text>
  <line x1="130" y1="139" x2="160" y2="210" stroke="#82b366" stroke-width="1.5"/>
  <line x1="300" y1="139" x2="270" y2="210" stroke="#82b366" stroke-width="1.5"/>
  <text x="210" y="322" text-anchor="middle" font-size="11" fill="#555">both map the same physical pages</text>

  <rect x="430" y="40" width="360" height="300" rx="10" fill="#f5f5f5" stroke="#999"/>
  <text x="610" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#333">Fiber dirties 4 MB - only those pages copy</text>
  <rect x="470" y="95" width="120" height="44" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="530" y="122" text-anchor="middle" font-size="13" fill="#1a1a1a">zygote</text>
  <rect x="640" y="95" width="120" height="44" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="700" y="122" text-anchor="middle" font-size="13" fill="#1a1a1a">fiber</text>
  <rect x="460" y="210" width="175" height="86" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="547" y="257" text-anchor="middle" font-size="12" fill="#1a1a1a">shared 124 MB</text>
  <rect x="655" y="210" width="115" height="86" rx="6" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="712" y="248" text-anchor="middle" font-size="11" fill="#1a1a1a">private 4 MB</text>
  <text x="712" y="264" text-anchor="middle" font-size="11" fill="#1a1a1a">(copied on write)</text>
  <line x1="530" y1="139" x2="540" y2="210" stroke="#82b366" stroke-width="1.5"/>
  <line x1="690" y1="139" x2="600" y2="210" stroke="#82b366" stroke-width="1.5"/>
  <line x1="705" y1="139" x2="712" y2="210" stroke="#d79b00" stroke-width="1.7" marker-end="url(#arwo)"/>
  <text x="610" y="322" text-anchor="middle" font-size="11" fill="#555">unwritten pages stay shared; only the dirtied page is private</text>

  <polyline points="390,190 430,190" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="410" y="180" text-anchor="middle" font-size="11" fill="#333">write</text>
</svg>
