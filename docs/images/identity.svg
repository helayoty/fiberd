<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <title>How identity flows through fiberd</title>
  <desc>An issuer signs a capacity grant. A caller carries the grant in Clone, and the fiberd agent verifies it before resolving the request. The agent mints or reuses a fence, starts or attaches to a fiber, and returns the endpoint and fence. The fence and home scope are written to audit records. Scope loss advances the epoch, makes old fences stale, and releases running fibers. Fibers receive an incarnation handle but no per-fiber cryptographic credential.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafcff"/>
      <stop offset="1" stop-color="#f1f5fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#182230" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#667085"/>
    </marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3165b5"/>
    </marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b42318"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#172033">How identity flows through fiberd</text>
  <text x="40" y="66" font-size="11" fill="#667085">Capacity authority leads to one fiber incarnation, while audit scope and workload credentials remain separate</text>

  <!-- Main causal flow -->
  <rect x="40" y="92" width="1120" height="210" rx="20" fill="#ffffff" stroke="#b7c7e0" filter="url(#shadow)"/>
  <text x="64" y="121" font-size="12" font-weight="700" fill="#24466f">Clone path</text>

  <rect x="65" y="151" width="140" height="66" rx="12" fill="#e8f0fd" stroke="#7f9dc8"/>
  <text x="135" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#24466f">Issuer</text>
  <text x="135" y="196" text-anchor="middle" font-size="9" fill="#52657c">holds signing key</text>

  <path d="M205 184H239" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="222" y="172" text-anchor="middle" font-size="8.5" fill="#667085">signs</text>

  <rect x="239" y="151" width="160" height="66" rx="12" fill="#e8f0fd" stroke="#7f9dc8"/>
  <text x="319" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#24466f">Grant JWT</text>
  <text x="319" y="196" text-anchor="middle" font-size="9" fill="#52657c">capacity authority</text>

  <path d="M399 184H433" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="416" y="172" text-anchor="middle" font-size="8.5" fill="#667085">carried by</text>

  <rect x="433" y="151" width="170" height="66" rx="12" fill="#f5f0f9" stroke="#9875ba"/>
  <text x="518" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#4b3158">Caller: Clone</text>
  <text x="518" y="196" text-anchor="middle" font-size="9" fill="#667085">grant JWT + session</text>

  <path d="M603 184H637" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="172" text-anchor="middle" font-size="8.5" fill="#667085">sends</text>

  <rect x="637" y="142" width="180" height="84" rx="12" fill="#edf9f7" stroke="#42a39a" stroke-width="1.5"/>
  <text x="727" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="#126b66">fiberd agent</text>
  <text x="727" y="189" text-anchor="middle" font-size="9" fill="#526d69">verifies grant</text>
  <text x="727" y="207" text-anchor="middle" font-size="9" fill="#526d69">resolves session</text>

  <path d="M817 184H851" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="834" y="172" text-anchor="middle" font-size="8.5" fill="#667085">mints or reuses</text>

  <rect x="851" y="142" width="160" height="84" rx="12" fill="#eee6f6" stroke="#9875ba" stroke-width="1.5"/>
  <text x="931" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="#4b3158">Fence</text>
  <text x="931" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#704a80">grant / epoch / seq</text>
  <text x="931" y="208" text-anchor="middle" font-size="8.5" fill="#667085">incarnation handle</text>

  <path d="M1011 184H1041" stroke="#704a80" stroke-width="1.7" marker-end="url(#arrow)"/>

  <rect x="1041" y="142" width="94" height="84" rx="12" fill="#f8f5fb" stroke="#9875ba"/>
  <text x="1088" y="171" text-anchor="middle" font-size="11" font-weight="700" fill="#4b3158">Fiber</text>
  <text x="1088" y="191" text-anchor="middle" font-size="9" fill="#667085">running</text>
  <text x="1088" y="208" text-anchor="middle" font-size="9" fill="#704a80">endpoint</text>

  <path d="M1088 226V264H518V217" fill="none" stroke="#3165b5" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#blueArrow)"/>
  <rect x="701" y="250" width="204" height="25" rx="12" fill="#e8f0fd"/>
  <text x="803" y="267" text-anchor="middle" font-size="9.5" font-weight="700" fill="#24466f">Clone response: endpoint + fence</text>

  <!-- Audit and revocation -->
  <rect x="40" y="330" width="690" height="360" rx="20" fill="#ffffff" stroke="#42a39a" filter="url(#shadow)"/>
  <text x="64" y="360" font-size="13" font-weight="700" fill="#126b66">Audit and revocation</text>

  <rect x="70" y="393" width="200" height="76" rx="12" fill="#edf9f7" stroke="#76bdb6"/>
  <text x="170" y="418" text-anchor="middle" font-size="10.5" font-weight="700" fill="#126b66">Home scope</text>
  <text x="170" y="438" text-anchor="middle" font-size="9" fill="#526d69">namespace, Pod, SA, node</text>
  <text x="170" y="455" text-anchor="middle" font-size="9" fill="#526d69">issuer, resource claim</text>

  <rect x="304" y="393" width="148" height="76" rx="12" fill="#eee6f6" stroke="#9875ba"/>
  <text x="378" y="418" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4b3158">Fence</text>
  <text x="378" y="438" text-anchor="middle" font-size="9" fill="#667085">which incarnation</text>
  <text x="378" y="455" text-anchor="middle" font-size="9" fill="#667085">performed the event</text>

  <path d="M270 431H304" stroke="#667085" stroke-width="1.5"/>
  <path d="M452 431H493" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="493" y="393" width="205" height="76" rx="12" fill="#f4fbf9" stroke="#76bdb6"/>
  <text x="595" y="418" text-anchor="middle" font-size="10.5" font-weight="700" fill="#126b66">Audit record</text>
  <text x="595" y="438" text-anchor="middle" font-size="9" fill="#526d69">event + fence + scope</text>
  <text x="595" y="455" text-anchor="middle" font-size="9" fill="#526d69">written before acknowledgement</text>

  <path d="M931 226V316H378V393" fill="none" stroke="#9875ba" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <path d="M170 469V516" stroke="#b42318" stroke-width="1.5" marker-end="url(#redArrow)"/>
  <rect x="70" y="516" width="150" height="49" rx="11" fill="#fff0ee" stroke="#e5a39d"/>
  <text x="145" y="537" text-anchor="middle" font-size="10" font-weight="700" fill="#8f241e">Scope lost</text>
  <text x="145" y="553" text-anchor="middle" font-size="8.5" fill="#a33a34">namespace, claim, issuer</text>

  <path d="M220 540H257" stroke="#b42318" stroke-width="1.5" marker-end="url(#redArrow)"/>
  <rect x="257" y="516" width="120" height="49" rx="11" fill="#fff0ee" stroke="#e5a39d"/>
  <text x="317" y="537" text-anchor="middle" font-size="10" font-weight="700" fill="#8f241e">Epoch++</text>
  <text x="317" y="553" text-anchor="middle" font-size="8.5" fill="#a33a34">persisted</text>

  <path d="M377 540H414" stroke="#b42318" stroke-width="1.5" marker-end="url(#redArrow)"/>
  <rect x="414" y="516" width="130" height="49" rx="11" fill="#fff0ee" stroke="#e5a39d"/>
  <text x="479" y="537" text-anchor="middle" font-size="10" font-weight="700" fill="#8f241e">Old fences</text>
  <text x="479" y="553" text-anchor="middle" font-size="8.5" fill="#a33a34">become stale</text>

  <path d="M544 540H581" stroke="#b42318" stroke-width="1.5" marker-end="url(#redArrow)"/>
  <rect x="581" y="516" width="117" height="49" rx="11" fill="#fff0ee" stroke="#e5a39d"/>
  <text x="639" y="537" text-anchor="middle" font-size="10" font-weight="700" fill="#8f241e">Running fibers</text>
  <text x="639" y="553" text-anchor="middle" font-size="8.5" fill="#a33a34">released</text>

  <rect x="70" y="604" width="628" height="50" rx="12" fill="#edf2fb"/>
  <text x="384" y="625" text-anchor="middle" font-size="9.5" font-weight="700" fill="#24466f">Scope is an audit fact, not another credential.</text>
  <text x="384" y="643" text-anchor="middle" font-size="9" fill="#52657c">The fence makes stale incarnations detectable and revocable.</text>

  <!-- Workload credential result -->
  <rect x="760" y="330" width="400" height="360" rx="20" fill="#ffffff" stroke="#d19a32" filter="url(#shadow)"/>
  <text x="784" y="360" font-size="13" font-weight="700" fill="#805600">What the running fiber receives</text>

  <path d="M1088 226V316H960V386" fill="none" stroke="#704a80" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="790" y="386" width="340" height="66" rx="12" fill="#f5f0f9" stroke="#9875ba"/>
  <text x="960" y="409" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4b3158">Incarnation context</text>
  <text x="960" y="429" text-anchor="middle" font-size="9" fill="#667085">FIBERD_FENCE + endpoint + optional payload</text>
  <text x="960" y="444" text-anchor="middle" font-size="8.5" fill="#704a80">the fence is not a secret</text>

  <path d="M960 452V480" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="790" y="480" width="340" height="45" rx="12" fill="#fff0ee" stroke="#e5a39d"/>
  <text x="960" y="508" text-anchor="middle" font-size="10" font-weight="700" fill="#8f241e">No per-fiber certificate, JWT, or SPIFFE ID is minted</text>

  <path d="M960 525V550H870V568" fill="none" stroke="#667085" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M960 550H1050V568" fill="none" stroke="#667085" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="790" y="568" width="160" height="78" rx="12" fill="#fff8e7" stroke="#d7a933"/>
  <text x="870" y="590" text-anchor="middle" font-size="10" font-weight="700" fill="#6f4d05">Kubernetes + proc</text>
  <text x="870" y="609" text-anchor="middle" font-size="8.5" fill="#6e6250">Pod mounts are visible</text>
  <text x="870" y="626" text-anchor="middle" font-size="8.5" fill="#8a5d00">SA token may be readable</text>

  <rect x="970" y="568" width="160" height="78" rx="12" fill="#f7f8fa" stroke="#aeb7c4"/>
  <text x="1050" y="590" text-anchor="middle" font-size="10" font-weight="700" fill="#344054">Sandbox backend</text>
  <text x="1050" y="609" text-anchor="middle" font-size="8.5" fill="#667085">separate filesystem view</text>
  <text x="1050" y="626" text-anchor="middle" font-size="8.5" fill="#667085">no automatic SA token</text>

  <rect x="234" y="718" width="732" height="25" rx="12" fill="#edf2fb"/>
  <text x="600" y="735" text-anchor="middle" font-size="9.5" font-weight="600" fill="#24466f">Grant JWT authorizes capacity. Fence identifies an incarnation. Endpoint tells callers where to connect.</text>
</svg>
