<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1072" viewBox="0 0 1440 1072" role="img" aria-labelledby="identity-title identity-desc">
  <title id="identity-title">Authority is not incarnation identity</title>
  <desc id="identity-desc">An identity relationship map, not a sequence of interchangeable components. An issuer signs a CapacityGrant JWT, which the caller carries with Clone to its named home. The grant is capacity authority; it may be bearer authority or explicitly bound to a client certificate. The home outline marks the audience and verification boundary, not a universal workload sandbox. fiberd verifies the signed grant and manages a running fiber. The fiber is identified by fence data: grant UID, agent epoch, and sequence. CREATE and RESUME mint a new fence; ATTACH preserves the existing one. The fence is neither signed authentication nor a secret. Home scope facts accompany events and fences in audit records rather than authorizing the workload. Restart or scope loss advances the epoch, making prior fences stale; old-running-fiber cleanup is best effort. A separate configured-credentials document has a dashed access relationship to the fiber: credentials are usable only if exposed by the backend and configuration. fiberd does not mint a generic per-fiber workload credential. Configured HANDOFF instead supplies a grant TLS identity and binds access to the caller certificate; it does not turn a fence into a credential. Durable epoch storage is required for continuity across home replacement.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--border:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--red:#b33b32;--red-bg:#fff0ef;--green:#287a4d;--green-bg:#e8f6ed}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--border:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--red:#ff8178;--red-bg:#321817;--green:#63cf8e;--green-bg:#142b1e}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;fill:var(--ink)}
    .bg{fill:var(--bg)}.boundary{fill:none;stroke:var(--teal);stroke-width:1.5;stroke-dasharray:9 6}.service{fill:var(--panel);stroke:var(--teal);stroke-width:2}.actor{fill:var(--panel);stroke:var(--blue);stroke-width:2}.document{stroke-width:1.5}.grant{fill:var(--blue-bg);stroke:var(--blue)}.data{fill:var(--violet-bg);stroke:var(--violet)}.credentials{fill:var(--amber-bg);stroke:var(--amber)}.fiber{fill:var(--violet-bg);stroke:var(--violet);stroke-width:2}
    .title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.label{font-size:20px;font-weight:600}.body{font-size:17px}.muted{fill:var(--muted)}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.red{fill:var(--red)}.center{text-anchor:middle}.divider{stroke:var(--border);stroke-width:1.5}.relation{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.authority{stroke:var(--blue)}.management{stroke:var(--teal)}.identifies{stroke:var(--violet);stroke-dasharray:6 5}.access{stroke:var(--amber);stroke-dasharray:7 6}
    text.amber{fill:#9e5e00}@media(prefers-color-scheme:dark){text.amber{fill:var(--amber)}}
  </style>
  <defs>
    <marker id="identity-blue-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--blue)"/></marker>
    <marker id="identity-teal-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--teal)"/></marker>
    <marker id="identity-amber-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 11 6 1 11Z" fill="var(--amber)"/></marker>
  </defs>
  <rect class="bg" width="1440" height="1072"/>
  <text class="title" x="48" y="66">Authority is not incarnation identity</text>
  <text class="body muted" x="48" y="100">A grant authorizes capacity. A fence names an incarnation. Workload credentials remain separate.</text>
  <path class="divider" d="M48 130H1392"/>

  <text class="heading blue" x="48" y="202">Capacity authority</text>
  <circle class="actor" cx="112" cy="273" r="16"/>
  <path class="actor" d="M80 326V314C80 287 144 287 144 314V326"/>
  <text class="label blue center" x="112" y="364">Issuer</text>
  <path class="document grant" d="M258 248H540L568 276V412H258Z"/>
  <path class="relation authority" d="M540 248V276H568"/>
  <text class="heading blue" x="282" y="295">CapacityGrant</text>
  <text class="body" x="282" y="330">Signed JWT</text>
  <text class="body" x="282" y="363">Bearer or client-bound</text>
  <text class="body muted" x="258" y="453">Carried by the caller with Clone</text>
  <path class="relation authority" d="M152 326H258" marker-end="url(#identity-blue-arrow)"/>
  <text class="body blue center" x="205" y="305">signs</text>

  <rect class="boundary" x="636" y="178" width="756" height="558" rx="16"/>
  <text class="heading teal" x="664" y="218">Named home</text>
  <text class="body muted" x="854" y="218">Audience + local verification boundary</text>
  <rect class="service" x="672" y="258" width="292" height="166" rx="4"/>
  <text class="heading teal" x="696" y="299">fiberd agent</text>
  <text class="body" x="696" y="335">Verifies capacity authority</text>
  <text class="body" x="696" y="374">Signature · issuer · audience</text>
  <path class="relation authority" d="M568 330H672" marker-end="url(#identity-blue-arrow)"/>
  <text class="body blue center" x="620" y="307">Clone</text>

  <circle class="fiber" cx="1240" cy="348" r="86"/>
  <text class="heading violet center" x="1240" y="341">Running fiber</text>
  <text class="body center" x="1240" y="376">one incarnation</text>
  <path class="relation management" d="M964 348H1154" marker-end="url(#identity-teal-arrow)"/>
  <text class="body teal center" x="1059" y="324">manages</text>

  <text class="label teal" x="672" y="488">Home scope</text>
  <text class="body" x="672" y="521">Audit facts, not authorization</text>
  <text class="body muted" x="672" y="559">Logged with event + fence</text>

  <path class="document data" d="M1024 512H1322L1350 540V666H1024Z"/>
  <path class="relation identifies" d="M1322 512V540H1350"/>
  <text class="heading violet" x="1048" y="554">Fence data</text>
  <text class="body" x="1048" y="592">grant UID / epoch / sequence</text>
  <text class="body red" x="1048" y="633">Not a credential or secret</text>
  <path class="relation identifies" d="M1240 434V512"/>
  <text class="body violet" x="1050" y="484">identified by</text>
  <text class="body" x="672" y="611">ATTACH keeps the fence.</text>
  <text class="body" x="672" y="642">CREATE / RESUME mint a new one.</text>
  <text class="body red" x="664" y="708">Restart / scope loss advances the epoch; prior fences become stale.</text>

  <path class="divider" d="M48 784H1392"/>
  <text class="heading amber" x="48" y="827">Workload credentials</text>
  <path class="document credentials" d="M48 852H356L384 880V1010H48Z"/>
  <path class="relation access" d="M356 852V880H384"/>
  <text class="label amber" x="72" y="901">Configured credentials</text>
  <text class="body" x="72" y="937">Mounts / workload TLS</text>
  <text class="body" x="72" y="974">Not a generic per-fiber identity</text>
  <path class="relation access" d="M384 932H1416V348H1326" marker-end="url(#identity-amber-arrow)"/>
  <text class="body amber" x="452" y="911">Usable only if exposed by the backend + configuration</text>
  <text class="body" x="452" y="978">Configured HANDOFF: grant TLS identity + bound caller.</text>
  <text class="body muted" x="452" y="1012">Neither grant JWT nor fence becomes a per-fiber credential.</text>
</svg>
