<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="identity-title identity-desc">
  <title id="identity-title">Identity, fences, scope, and credentials in fiberd</title>
  <desc id="identity-desc">An issuer signs a CapacityGrant that a caller presents with Clone. fiberd verifies the grant, resolves a session, and returns an endpoint and incarnation fence. Audit records include fence and home scope. Restart or scope loss advances the epoch and invalidates prior fences. A fence is not a secret and fiberd does not mint a per-fiber certificate or JWT.</desc>
  <style>
    :root{--bg:#f7f9fc;--panel:#fff;--ink:#172033;--muted:#5d6b7d;--line:#b8c4d4;--blue:#3165b5;--blue-bg:#eaf1ff;--teal:#13776f;--teal-bg:#e8f7f4;--violet:#704aa1;--violet-bg:#f2edfa;--amber:#a76500;--amber-bg:#fff3d6;--red:#b33b32;--red-bg:#fff0ef}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#a3adba;--line:#3d4652;--blue:#79a7ff;--blue-bg:#17243d;--teal:#53c7b8;--teal-bg:#102923;--violet:#c09cff;--violet-bg:#251b35;--amber:#f0b44d;--amber-bg:#30240f;--red:#ff8178;--red-bg:#321817}}
    text{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:var(--ink)}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.bluebox{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.5}.tealbox{fill:var(--teal-bg);stroke:var(--teal);stroke-width:1.5}.violetbox{fill:var(--violet-bg);stroke:var(--violet);stroke-width:1.5}.amberbox{fill:var(--amber-bg);stroke:var(--amber);stroke-width:1.5}.redbox{fill:var(--red-bg);stroke:var(--red);stroke-width:1.5}.title{font-size:27px;font-weight:750}.subtitle{font-size:14px;fill:var(--muted)}.h{font-size:16px;font-weight:700}.b{font-size:13px}.s{font-size:11px;fill:var(--muted)}.cap{font-size:12px;font-weight:700;letter-spacing:.5px}.blue{fill:var(--blue)}.teal{fill:var(--teal)}.violet{fill:var(--violet)}.amber{fill:var(--amber)}.red{fill:var(--red)}.arrow{fill:none;stroke:var(--muted);stroke-width:2}.dash{stroke-dasharray:7 5}
  </style>
  <defs><marker id="identity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#7b8794"/></marker></defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="42" y="48">Authority, incarnation, route, and workload identity are distinct</text>
  <text class="subtitle" x="42" y="74">Grant JWT authorizes capacity · fence identifies one incarnation · endpoint is the route · scope anchors audit and revocation.</text>

  <rect class="panel" x="42" y="104" width="1116" height="214" rx="20"/>
  <text class="cap blue" x="68" y="137">CLONE PATH</text>
  <rect class="bluebox" x="68" y="164" width="150" height="92" rx="14"/>
  <text class="h blue" x="143" y="195" text-anchor="middle">Issuer</text><text class="b" x="143" y="225" text-anchor="middle">signing key</text>
  <rect class="bluebox" x="258" y="164" width="170" height="92" rx="14"/>
  <text class="h blue" x="343" y="195" text-anchor="middle">CapacityGrant JWT</text><text class="s" x="343" y="225" text-anchor="middle">capacity authority</text>
  <rect class="violetbox" x="468" y="164" width="160" height="92" rx="14"/>
  <text class="h violet" x="548" y="195" text-anchor="middle">Caller</text><text class="b" x="548" y="225" text-anchor="middle">Clone + session</text>
  <rect class="tealbox" x="668" y="154" width="182" height="112" rx="14"/>
  <text class="h teal" x="759" y="185" text-anchor="middle">fiberd</text><text class="b" x="759" y="214" text-anchor="middle">verify + resolve</text><text class="s" x="759" y="239" text-anchor="middle">ledger serialization</text>
  <rect class="violetbox" x="890" y="154" width="220" height="112" rx="14"/>
  <text class="h violet" x="1000" y="184" text-anchor="middle">Fiber incarnation</text><text class="b" x="1000" y="212" text-anchor="middle">fence: grant / epoch / seq</text><text class="s" x="1000" y="238" text-anchor="middle">endpoint returned with fence</text>
  <path class="arrow" d="M218 210h40M428 210h40M628 210h40M850 210h40" marker-end="url(#identity-arrow)"/>
  <text class="s" x="238" y="198" text-anchor="middle">signs</text><text class="s" x="448" y="198" text-anchor="middle">carries</text><text class="s" x="648" y="198" text-anchor="middle">sends</text>
  <path class="arrow dash" d="M1000 266v28H548v-38" marker-end="url(#identity-arrow)"/>
  <text class="s" x="774" y="290" text-anchor="middle">Clone response: kind + endpoint + fence</text>

  <rect class="panel" x="42" y="348" width="704" height="350" rx="20"/>
  <text class="cap teal" x="68" y="381">AUDIT + REVOCATION</text>
  <rect class="tealbox" x="68" y="411" width="200" height="88" rx="14"/>
  <text class="h teal" x="168" y="440" text-anchor="middle">Home scope</text><text class="s" x="168" y="466" text-anchor="middle">issuer + resource claim</text><text class="s" x="168" y="485" text-anchor="middle">environment-specific facts</text>
  <rect class="violetbox" x="308" y="411" width="154" height="88" rx="14"/>
  <text class="h violet" x="385" y="440" text-anchor="middle">Fence</text><text class="s" x="385" y="466" text-anchor="middle">event incarnation</text>
  <rect class="tealbox" x="502" y="411" width="216" height="88" rx="14"/>
  <text class="h teal" x="610" y="440" text-anchor="middle">Audit record</text><text class="s" x="610" y="466" text-anchor="middle">event + scope + fence</text><text class="s" x="610" y="485" text-anchor="middle">durability follows policy</text>
  <path class="arrow" d="M268 455h40M462 455h40" marker-end="url(#identity-arrow)"/>
  <rect class="redbox" x="68" y="553" width="144" height="72" rx="14"/><text class="h red" x="140" y="582" text-anchor="middle">Restart or</text><text class="b" x="140" y="605" text-anchor="middle">scope loss</text>
  <rect class="redbox" x="260" y="553" width="130" height="72" rx="14"/><text class="h red" x="325" y="583" text-anchor="middle">Epoch++</text><text class="s" x="325" y="606" text-anchor="middle">persisted</text>
  <rect class="redbox" x="438" y="553" width="130" height="72" rx="14"/><text class="h red" x="503" y="582" text-anchor="middle">Old fences</text><text class="s" x="503" y="606" text-anchor="middle">invalid</text>
  <rect class="redbox" x="616" y="553" width="102" height="72" rx="14"/><text class="h red" x="667" y="582" text-anchor="middle">Running</text><text class="s" x="667" y="606" text-anchor="middle">released</text>
  <path class="arrow" d="M212 589h48M390 589h48M568 589h48" marker-end="url(#identity-arrow)"/>
  <text class="s" x="68" y="666">Running fibers are not recovered after agent restart; eligible parked named sessions may remain resumable.</text>

  <rect class="panel" x="778" y="348" width="380" height="350" rx="20"/>
  <text class="cap amber" x="804" y="381">WHAT A FIBER RECEIVES</text>
  <rect class="violetbox" x="804" y="411" width="328" height="86" rx="14"/>
  <text class="h violet" x="968" y="441" text-anchor="middle">Incarnation context</text>
  <text class="b" x="968" y="468" text-anchor="middle">endpoint + fence + optional payload</text>
  <rect class="redbox" x="804" y="527" width="328" height="64" rx="14"/>
  <text class="h red" x="968" y="554" text-anchor="middle">No per-fiber credential is minted</text>
  <text class="s" x="968" y="576" text-anchor="middle">the fence is not a secret</text>
  <rect class="amberbox" x="804" y="617" width="152" height="58" rx="13"/>
  <text class="b amber" x="880" y="642" text-anchor="middle">Process backend</text><text class="s" x="880" y="661" text-anchor="middle">home mounts may show</text>
  <rect class="amberbox" x="980" y="617" width="152" height="58" rx="13"/>
  <text class="b amber" x="1056" y="642" text-anchor="middle">Sandbox backend</text><text class="s" x="1056" y="661" text-anchor="middle">separate filesystem view</text>
</svg>
