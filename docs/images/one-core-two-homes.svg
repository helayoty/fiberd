<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker>
    <marker id="arwg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#999"/></marker>
  </defs>
  <rect width="820" height="430" fill="#ffffff"/>

  <rect x="30" y="60" width="240" height="270" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="45" y="84" font-size="13" font-weight="600" fill="#1a1a1a">Kubernetes home</text>
  <text x="45" y="116" font-size="11" fill="#1a1a1a">- grant: apiserver-&gt;node watch</text>
  <text x="45" y="140" font-size="11" fill="#1a1a1a">- ready: DRA binding conditions</text>
  <text x="45" y="164" font-size="11" fill="#1a1a1a">- scheduler places grants</text>
  <text x="45" y="188" font-size="11" fill="#1a1a1a">- inherits kubelet's pod sandbox</text>
  <text x="45" y="212" font-size="11" fill="#1a1a1a">- authn: cached JWKS</text>
  <text x="45" y="236" font-size="11" fill="#1a1a1a">- GPU: DRA claim per grant</text>

  <rect x="300" y="90" width="220" height="210" rx="10" fill="#d5e8d4" stroke="#82b366"/>
  <text x="410" y="116" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">core - invariant</text>
  <text x="410" y="134" text-anchor="middle" font-size="11" fill="#555">(never forks)</text>
  <text x="410" y="168" text-anchor="middle" font-size="12" fill="#1a1a1a">Agent</text>
  <text x="410" y="192" text-anchor="middle" font-size="12" fill="#1a1a1a">Ledger</text>
  <text x="410" y="216" text-anchor="middle" font-size="12" fill="#1a1a1a">Fence / Epoch</text>
  <text x="410" y="240" text-anchor="middle" font-size="12" fill="#1a1a1a">Budget</text>
  <text x="410" y="264" text-anchor="middle" font-size="12" fill="#1a1a1a">Runtime interface</text>

  <rect x="550" y="60" width="240" height="270" rx="10" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="565" y="84" font-size="13" font-weight="600" fill="#1a1a1a">Standalone home</text>
  <text x="565" y="116" font-size="11" fill="#1a1a1a">- grant: signed ed25519 artifact</text>
  <text x="565" y="140" font-size="11" fill="#1a1a1a">- ready: batched status stream</text>
  <text x="565" y="164" font-size="11" fill="#1a1a1a">- platform placer schedules</text>
  <text x="565" y="188" font-size="11" fill="#1a1a1a">- agent owns the sandbox</text>
  <text x="565" y="212" font-size="11" fill="#1a1a1a">- authn: JWKS (platform's)</text>
  <text x="565" y="236" font-size="11" fill="#1a1a1a">- GPU: agent mints IMEX channel</text>

  <polyline points="270,195 300,195" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="285" y="187" text-anchor="middle" font-size="11" fill="#333">adapter</text>
  <polyline points="550,195 520,195" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="535" y="187" text-anchor="middle" font-size="11" fill="#333">adapter</text>

  <polyline points="410,300 410,360" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arwg)"/>
  <rect x="260" y="360" width="300" height="44" rx="6" fill="#f5f5f5" stroke="#999" stroke-dasharray="5 3"/>
  <text x="410" y="387" text-anchor="middle" font-size="12" font-style="italic" fill="#333">conformant iff the core runs unmodified beneath it</text>
</svg>
