name: release

on:
  # Pushing a release tag releases it as it is.
  push:
    tags: ["v*"]
  # A manual run releases the commit it starts from under the tag it is
  # given, creating the tag if it is new. An existing tag is released by
  # a run started from that tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0, v1.9.2 or v2.0.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

# One release at a time. Cleanup deletes every image version pushed since
# its run started, so no other run may push in that window.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The input on a manual run, the pushed tag otherwise.
  TAG: ${{ inputs.tag || github.ref_name }}
  # The image's description, as docker/fiberd/Dockerfile labels it.
  DESCRIPTION: fiberd with criu and the zygote library

jobs:
  validate-tag:
    name: validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      python-version: ${{ steps.version.outputs.python-version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image-tags: ${{ steps.version.outputs.image-tags }}
      new-tag: ${{ steps.version.outputs.new-tag }}
      started: ${{ steps.version.outputs.started }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        name: validate the tag, its commit and its branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # vMAJOR.MINOR.PATCH, optionally with a pre-release suffix (v2.0.0-rc.1).
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "release tags look like v0.1.0, v1.9.2 or v2.0.0-rc.1" >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} pre=${BASH_REMATCH[4]}
          # Fail before building if the tag is already released, for example by
          # a tag push and a manual run for the same tag.
          if [[ $(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null) == false ]]; then
            echo "$TAG is already released" >&2
            exit 1
          fi
          # A new tag is created only when the release is published, so a
          # failed run leaves no tag.
          if tagged=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "$TAG points at $tagged, but this run started from $GITHUB_SHA ($GITHUB_REF_NAME): start the run from the tag" >&2
              exit 1
            fi
            echo "new-tag=false" >> "$GITHUB_OUTPUT"
            echo "releasing existing tag $TAG at $GITHUB_SHA"
          else
            echo "new-tag=true" >> "$GITHUB_OUTPUT"
            echo "tag $TAG does not exist yet: it will be created at $GITHUB_SHA ($GITHUB_REF_NAME)"
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG would release $GITHUB_SHA, which is not on main: start the run from main" >&2
            exit 1
          fi
          version=${TAG#v}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # PyPI takes the PEP 440 form, so v2.0.0-rc.1 is 2.0.0rc1, and a
          # pre-release suffix it cannot express is refused here.
          pyversion=$version
          if [[ -n "$pre" ]]; then
            if [[ ! "$pre" =~ ^-(alpha|beta|rc)\.?(0|[1-9][0-9]*)$ ]]; then
              echo "a pre-release tag looks like v2.0.0-rc.1, -beta.1 or -alpha.1, which PyPI can express" >&2
              exit 1
            fi
            case ${BASH_REMATCH[1]} in alpha) kind=a ;; beta) kind=b ;; *) kind=rc ;; esac
            pyversion=${version%"$pre"}$kind${BASH_REMATCH[2]}
          fi
          echo "python-version=$pyversion" >> "$GITHUB_OUTPUT"
          # Every release tags the image with its exact version. A final release
          # also moves MAJOR.MINOR, MAJOR and latest. MAJOR is skipped for 0.x,
          # which promises no stability. A pre-release moves none of them.
          tags=("type=raw,value=$version")
          if [[ -z "$pre" ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            tags+=("type=raw,value=$major.$minor")
            [[ "$major" != 0 ]] && tags+=("type=raw,value=$major")
            tags+=("type=raw,value=latest")
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "image-tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          printf 'image tags: %s\n' "${tags[*]}"

  # The five workflows that gate a merge gate the release the same way.
  ci:
    name: ci
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  integration:
    name: integration
    needs: validate-tag
    uses: ./.github/workflows/integration.yml

  conformance:
    name: conformance
    needs: validate-tag
    uses: ./.github/workflows/conformance.yml

  examples:
    name: examples
    needs: validate-tag
    uses: ./.github/workflows/examples.yml

  fuzz:
    name: fuzz
    needs: validate-tag
    uses: ./.github/workflows/fuzz.yml

  # The Python SDK. The sdist is built once and each wheel is built from
  # it, so PyPI and the release assets carry one sdist and its wheels.
  python-sdist:
    name: build the Python sdist
    needs: [validate-tag, ci, integration, conformance, examples, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: build the sdist
        env:
          FIBERD_PYTHON_VERSION: ${{ needs.validate-tag.outputs.python-version }}
        shell: bash
        run: |
          set -euo pipefail
          # PyPI shows the README, so its relative links point at the tag.
          sed -i -E "s|\]\(([^)#:][^):]*)\)|](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/sdk/python/\1)|g" sdk/python/README.md
          python -m pip install build==1.6.1
          python -m build --sdist --outdir "$RUNNER_TEMP/sdist" sdk/python
          ls "$RUNNER_TEMP/sdist/fiberd-$FIBERD_PYTHON_VERSION.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sdist
          path: ${{ runner.temp }}/sdist/
          if-no-files-found: error
          retention-days: 7

  python-wheels:
    name: build the Python wheel ${{ matrix.arch }}
    needs: [validate-tag, python-sdist]
    # cibuildwheel builds natively, in the manylinux_2_28 image of each
    # architecture, and tests the wheel (sdk/python/pyproject.toml).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-sdist
          path: ${{ runner.temp }}/sdist
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          package-dir: ${{ runner.temp }}/sdist/fiberd-${{ needs.validate-tag.outputs.python-version }}.tar.gz
          output-dir: ${{ runner.temp }}/wheelhouse
      # CRIU restores trap on a signed return address on a FEAT_FPAC CPU.
      - if: matrix.arch == 'aarch64'
        run: hack/python/pac.sh "$RUNNER_TEMP"/wheelhouse/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.arch }}
          path: ${{ runner.temp }}/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  # The TypeScript client. The tarball npm publishes is the one the
  # release assets carry.
  npm-package:
    name: build the TypeScript package
    needs: [validate-tag, ci, integration, conformance, examples, fuzz]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: pack @fiberd/client
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        shell: bash
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # npm shows the README, so its relative links point at the tag.
          sed -i -E "s|\]\(([^)#:][^):]*)\)|](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/sdk/typescript/\1)|g" README.md
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --pack-destination "$RUNNER_TEMP/npm"
          ls "$RUNNER_TEMP/npm/fiberd-client-$VERSION.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error
          retention-days: 7

  build-assets:
    name: build release archives
    needs: [validate-tag, ci, integration, conformance, examples, fuzz, python-sdist, python-wheels, npm-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The Python sdist and wheels and the npm tarball join the archives
      # under SHA256SUMS and the provenance attestation.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*
          path: ${{ runner.temp }}/python
          merge-multiple: true
      - name: install syft
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          echo "$SYFT_SHA256  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/syft"
          tar -xzf "$archive" -C "$RUNNER_TEMP/syft" syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"
      - name: build archives
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Fixed file times, owners and order, and no build id, make the
          # archives reproducible. The same commit always yields the same bytes.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          # Nothing is written into the checkout. An untracked file there
          # would stamp every later go build as modified (+dirty).
          dist="$RUNNER_TEMP/dist"
          mkdir "$dist"
          # pack <archive> <dir> writes the archive and its SPDX SBOM.
          pack() {
            tar -C "$2" --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
              --owner=0 --group=0 --numeric-owner -cf - . | gzip -9n > "$dist/$1"
            syft scan "dir:$2" --quiet --source-name "${1%%_*}" --source-version "$VERSION" \
              --output "spdx-json=$dist/$1.spdx.json"
          }
          # readme points a copied README's relative links at the tag on GitHub.
          readme() {
            sed -E "s|\]\(([^)#:][^):]*)\)|](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/$2\1)|g" "$1" > "$3"
          }
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
            staging="$(mktemp -d)"
            commands=(fiberd grant-issuer zygotectl audit-verify)
            for command in "${commands[@]}"; do
              go build -trimpath -ldflags="-s -w -buildid= -X main.version=$TAG" \
                -o "$staging/$command" "./cmd/$command"
            done
            hack/release/third-party-notices.sh "${commands[@]/#/./cmd/}" > "$staging/THIRD_PARTY_NOTICES"
            cp LICENSE NOTICE "$staging/"
            readme README.md "" "$staging/README.md"
            pack "fiberd_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "$staging"
            rm -rf "$staging"
          done
          # Ship the zygote library that templates link, as source (the
          # header and the Rust crate) and as a static library per Linux
          # architecture.
          lib="$(mktemp -d)"
          cp sdk/c/template/libfiberzygote.h LICENSE NOTICE "$lib/"
          mkdir "$lib/core"
          (cd sdk/c/template/core && cp -R Cargo.toml Cargo.lock rust-toolchain.toml build.rs src "$lib/core/")
          readme sdk/c/template/README.md sdk/c/template/ "$lib/README.md"
          pack "libfiberzygote_${VERSION}_src.tar.gz" "$lib"
          rm -r "$lib/core"
          # The library per architecture is cargo's archive alone, since no
          # C is left in it. A staticlib needs no cross linker. cargo runs
          # in the crate, so rustup takes the toolchain its
          # rust-toolchain.toml pins, and writes outside the checkout.
          # Rust emits no pointer authentication unless asked, which CRIU
          # restores cannot use.
          core="$RUNNER_TEMP/core"
          root="$PWD"
          (cd sdk/c/template/core && cargo --version &&
            rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu &&
            for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
              RUSTFLAGS="--remap-path-prefix=$root=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo" \
                cargo build --release --locked --target "$triple" --target-dir "$core"
            done)
          for arch in amd64 arm64; do
            triple=x86_64-unknown-linux-gnu
            if [[ "$arch" == arm64 ]]; then triple=aarch64-unknown-linux-gnu; fi
            cp "$core/$triple/release/libfiberzygote_core.a" "$lib/libfiberzygote.a"
            pack "libfiberzygote_${VERSION}_linux_${arch}.tar.gz" "$lib"
          done
          rm -rf "$lib"
          cp "$RUNNER_TEMP"/python/fiberd-*.tar.gz "$RUNNER_TEMP"/python/fiberd-*.whl "$RUNNER_TEMP"/npm/fiberd-client-*.tgz "$dist/"
          (cd "$dist" && sha256sum -- *.tar.gz *.whl *.tgz *.spdx.json > SHA256SUMS)
      - name: attest archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/dist/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  build-image:
    name: build image ${{ matrix.platform }}
    needs: [validate-tag, ci, integration, conformance, examples, fuzz]
    # Each platform builds on a native runner. Emulating arm64 under QEMU
    # makes the image's CRIU build many times slower.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # The version of the tag and the revision of the commit it marks.
          tags: type=raw,value=${{ needs.validate-tag.outputs.version }}
          # The action sets the description to the repository's, which may
          # be empty, so it is set here.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
      - id: build
        name: build and push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/fiberd/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.TAG }}
          labels: ${{ steps.metadata.outputs.labels }}
          # GHCR makes a new package private. Make it public once, after the first push.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      - name: record digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The steps that are hard to undo come last. The release is drafted
  # first, which makes no git tag. Then the image tags move. Publishing the
  # release creates the tag. Cleanup undoes what a failed or cancelled run
  # left behind.
  release-draft:
    name: draft GitHub release
    needs: [validate-tag, build-assets, build-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: create or refresh the draft
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ env.TAG }}
          name: ${{ env.TAG }}
          # Used only for a new tag. Publishing creates it at the commit that
          # was built and tested. A draft makes no tag.
          commit: ${{ github.sha }}
          draft: true
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          generateReleaseNotes: true
          artifacts: dist/*
          artifactErrorsFailBuild: true
          # A rerun refreshes its own draft. A published release is refused.
          allowUpdates: true
          updateOnlyUnreleased: true
          replacesArtifacts: true

  publish-image:
    name: publish multi-arch image
    needs: [validate-tag, build-image, release-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      previous: ${{ steps.previous.outputs.tags }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: previous
        name: record where each tag points before moving it
        shell: bash
        env:
          TAGS: ${{ needs.validate-tag.outputs.image-tags }}
        run: |
          set -euo pipefail
          # tag=digest for a tag that exists, tag= for one this run creates.
          prev=""
          while read -r line; do
            tag=${line#type=raw,value=}
            [[ -n "$tag" ]] || continue
            if d=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' 2>/dev/null | jq -er .digest); then
              prev+="$tag=$d "
            else
              prev+="$tag= "
            fi
          done <<< "$TAGS"
          echo "tags=$prev" >> "$GITHUB_OUTPUT"
          echo "before: $prev"
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # validate-tag computes these, since 0.x moves no MAJOR tag.
          tags: ${{ needs.validate-tag.outputs.image-tags }}
      - id: manifest
        name: create the multi-arch manifest
        shell: bash
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # GHCR shows a multi-arch image's description from the index.
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  publish-release:
    name: publish GitHub release
    needs: [validate-tag, release-draft, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: add the image to the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          PYTHON_VERSION: ${{ needs.validate-tag.outputs.python-version }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
        run: |
          set -euo pipefail
          {
            cat <<EOF
          ## Container image

          \`${IMAGE}:${VERSION}\`

          Digest: \`${IMAGE_DIGEST}\`

          ## Python SDK

          \`pip install 'fiberd[client]==${PYTHON_VERSION}'\`

          ## TypeScript SDK

          \`npm install @fiberd/client@${VERSION}\`

          ## Verify

          \`\`\`bash
          sha256sum -c SHA256SUMS
          gh attestation verify fiberd_${VERSION}_linux_amd64.tar.gz --repo ${GITHUB_REPOSITORY}
          gh attestation verify oci://${IMAGE}@${IMAGE_DIGEST} --repo ${GITHUB_REPOSITORY}
          \`\`\`

          EOF
            gh release view "$TAG" --json body --jq .body
          } > release-notes.md
      - name: publish the release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ env.TAG }}
          draft: false
          bodyFile: release-notes.md
          allowUpdates: true
          updateOnlyUnreleased: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          # A pre-release never becomes the repository's latest release.
          makeLatest: ${{ needs.validate-tag.outputs.prerelease == 'true' && 'false' || 'legacy' }}

  # PyPI comes last, since an upload can never be replaced. A failure here
  # leaves the GitHub release published, and re-running this job finishes
  # the release. Trusted publishing, so no token is stored. The publisher
  # on PyPI names this repository, release.yml and the pypi environment.
  publish-pypi:
    name: publish to PyPI
    needs: [validate-tag, python-sdist, python-wheels, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/fiberd/${{ needs.validate-tag.outputs.python-version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  # npm also comes after the GitHub release, since a published version can
  # never be reused. Re-running this job finishes a release whose publish
  # failed. Trusted publishing, so no token is stored. The publisher on
  # npm names this repository, release.yml and the npm environment, and
  # npm attaches the provenance statement itself. A pre-release goes to
  # the next dist-tag, so a plain install keeps the last final release.
  publish-npm:
    name: publish to npm
    needs: [validate-tag, npm-package, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@fiberd/client/v/${{ needs.validate-tag.outputs.version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: npm
      - name: publish @fiberd/client
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          DIST_TAG: ${{ needs.validate-tag.outputs.prerelease == 'true' && 'next' || 'latest' }}
          # Only for the first publish, before the package exists for a
          # trusted publisher to attach to. Delete the secret afterwards.
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Trusted publishing needs npm 11.5.1 or later.
          npm_version=$(npm --version)
          if [[ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != 11.5.1 ]]; then
            echo "npm $npm_version cannot use trusted publishing, which needs 11.5.1 or later" >&2
            exit 1
          fi
          if [[ -n "$NPM_BOOTSTRAP_TOKEN" ]]; then
            echo "::warning::publishing with NPM_BOOTSTRAP_TOKEN. Set up the trusted publisher on npm, then delete the secret and revoke the token."
            npmrc="$RUNNER_TEMP/npmrc"
            (umask 077 && printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_BOOTSTRAP_TOKEN" > "$npmrc")
            export NPM_CONFIG_USERCONFIG="$npmrc"
          fi
          # The ./ keeps npm from reading npm/<file> as a GitHub owner/repo.
          npm publish "./npm/fiberd-client-$VERSION.tgz" --access public --provenance --tag "$DIST_TAG"

  cleanup:
    name: clean up a failed or cancelled release
    needs: [validate-tag, ci, integration, conformance, examples, fuzz, python-sdist, python-wheels, npm-package, build-assets, build-image, release-draft, publish-image, publish-release, publish-pypi, publish-npm]
    if: >-
      always() && needs.validate-tag.result == 'success' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PREVIOUS: ${{ needs.publish-image.outputs.previous }}
      STARTED: ${{ needs.validate-tag.outputs.started }}
    steps:
      - id: release
        name: delete the draft release
        shell: bash
        run: |
          set -euo pipefail
          # Ask GitHub whether the release is live. The publish job can fail
          # after flipping it live, so its result is not proof either way.
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            echo "no release for $TAG"
            echo "published=false" >> "$GITHUB_OUTPUT"
          elif [[ "$draft" == true ]]; then
            # A draft never created the git tag, so there is no tag to remove.
            gh release delete "$TAG" --yes
            echo "deleted the draft release $TAG"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is published, so its image and tags stay"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.release.outputs.published == 'false'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.published == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: move image tags back and delete what this run pushed
        if: steps.release.outputs.published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          # Tags that existed point back where they were. A tag this run
          # created goes away with the version that carries it.
          kept=()
          for pair in $PREVIOUS; do
            tag=${pair%%=*} digest=${pair#*=}
            [[ -n "$digest" ]] || continue
            if docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE@$digest"; then
              echo "moved $tag back to $digest"
            else
              echo "::warning::could not move $tag back to $digest"
            fi
            kept+=("$tag")
          done
          owner=${GITHUB_REPOSITORY%/*} pkg=${GITHUB_REPOSITORY#*/}
          if [[ $(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.type) == Organization ]]; then
            base="orgs/$owner/packages/container/$pkg/versions"
          else
            base="users/$owner/packages/container/$pkg/versions"
          fi
          # Every version created since this run started is this run's, because
          # one release runs at a time. A version that still holds an older tag
          # is kept, since deleting it would remove that tag.
          keep=$(printf '%s\n' "${kept[@]}" | jq -R . | jq -sc .)
          if ! ids=$(gh api --paginate "$base" --jq ".[] | select(.created_at >= \"$STARTED\")
              | select((.metadata.container.tags - $keep) == .metadata.container.tags) | .id" 2>/dev/null); then
            echo "no image package yet; nothing pushed"
            exit 0
          fi
          # GHCR refuses to delete a package's last tagged version (a failed
          # first release). Report it and go on with the rest.
          for id in $ids; do
            if gh api -X DELETE "$base/$id"; then
              echo "deleted image version $id"
            else
              echo "::warning::could not delete image version $id; remove it by hand"
            fi
          done
