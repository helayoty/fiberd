name: examples

# The examples end to end: Kubernetes in kind, the Kata-shaped shim,
# Knative over Hyperlight (KVM), Slurm in Docker and Agent Substrate in
# kind.
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole suite on the commit it releases.
  # Every job checks out the commit the run started from, so a caller
  # cannot hand it another ref.
  workflow_call:

permissions:
  contents: read

jobs:
  conform-kind:
    name: example - Kubernetes integration in kind (grant-controller, grant Pod, C1-C10, overcommit storm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.29.0
          cluster_name: fiberd
          config: examples/kubernetes/kind/kind.yaml
      - run: make conform-kind
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-fiberd get pods -A -o wide
          kubectl --context kind-fiberd -n tenant-a get cg -o yaml
          kubectl --context kind-fiberd -n fiberd-system logs deploy/grant-issuer --tail=100 || true
          kubectl --context kind-fiberd -n tenant-a logs conform-grant --tail=200 || true
          kubectl --context kind-fiberd -n tenant-a logs conform-grant --previous --tail=100 || true
          kubectl --context kind-fiberd -n tenant-a logs storm-grant --tail=100 || true
          kubectl --context kind-fiberd -n tenant-a logs conform-runc-grant --tail=100 || true
          KIND_CLUSTER=fiberd examples/kubernetes/kind/conform.sh runc-logs conform-runc-grant || true

  example-kata:
    name: example - Kata-shaped containerd shim in kind (Pod containers are fibers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.29.0
          cluster_name: fiberd
          config: examples/kubernetes/kind/kind.yaml
      - run: make example-kata
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl --context kind-fiberd get pods -A -o wide
          kubectl --context kind-fiberd -n tenant-a describe pod kata-1 kata-2 || true
          docker exec fiberd-control-plane journalctl -u containerd --no-pager -n 100 || true
          kubectl --context kind-fiberd -n tenant-a logs conform-grant --tail=100 || true
          kubectl --context kind-fiberd -n tenant-a logs conform-runc-grant --tail=100 || true
          KIND_CLUSTER=fiberd examples/kubernetes/kind/conform.sh runc-logs conform-runc-grant || true

  example-knative:
    name: example - Knative scale-from-zero over Hyperlight (KVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: enable KVM for this runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - run: make hyperlight-helper
      - run: make example-knative
      - run: make example-knative-kvm
      - name: logs on failure
        if: failure()
        run: sudo tail -n 50 bin/knative-state/*.log || true

  conform-slurm:
    name: example - Slurm integration in Docker (allocation, C1-C10, overcommit storm and its baselines without fiberd)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The storm's baselines without fiberd run after it, in jobs of the
      # same size. Only the fiberd side decides the exit status.
      - shell: bash
        run: mkdir -p bin && make conform-slurm 2>&1 | tee bin/conform-slurm.log
      # Each storm side's "storm summary:" line on the run's summary page.
      - name: storm summary lines
        if: always()
        shell: bash
        run: |
          {
            echo '### Slurm storm, one line per side'
            echo '```'
            grep '^storm summary:' bin/conform-slurm.log || echo 'no summary lines (see the conform-slurm step)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: cluster state on failure
        if: failure()
        run: |
          docker exec fiberd-slurm sh -c 'squeue; sinfo; tail -50 /var/log/slurm/slurmd.log; tail -50 /var/log/fiberd-conform.out; tail -50 /var/log/fiberd-storm.out; tail -50 /var/log/storm-plain-*.out' || true

  example-substrate:
    name: example - Agent Substrate in kind (actors are fibers, suspended and resumed through Substrate)
    runs-on: ubuntu-24.04
    # The run took 7 minutes on a 4-CPU Docker host with warm Go caches. A
    # cold cache also builds every Substrate image, hence the margin.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The cache below holds the Go caches, keyed by Substrate's version.
          cache: false
      - name: Substrate version
        id: substrate
        run: echo "version=$(sed -n 's/^SUBSTRATE_VERSION=//p' examples/substrate/kind/run.sh)" >> "$GITHUB_OUTPUT"
      # Substrate's source and the Go caches its ko build fills. Only a new
      # Substrate version pays the full build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/substrate-src
            ~/.cache/go-build
            ~/go/pkg/mod
          key: substrate-${{ steps.substrate.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      - run: make example-substrate
        env:
          SUBSTRATE_SRC: ${{ github.workspace }}/bin/substrate-src
          # Substrate's go.mod can need a newer Go than fiberd's. setup-go
          # pins GOTOOLCHAIN=local, so let go fetch the version it names.
          GOTOOLCHAIN: auto
      - name: cluster state on failure
        if: failure()
        run: |
          ctx=kind-fiberd-substrate
          kubectl --context $ctx get pods -A -o wide || true
          kubectl --context $ctx -n ate-demo-fiberd get workerpool,deploy -o yaml || true
          kubectl --context $ctx -n ate-demo-fiberd describe pods || true
          kubectl --context $ctx -n ate-demo-fiberd logs -l ate.dev/worker-pool=fiberd --all-containers --tail=300 --prefix || true
          kubectl --context $ctx -n ate-system logs -l app=atelet --all-containers --tail=300 --prefix || true
          kubectl --context $ctx -n ate-system logs deploy/atenet-router --all-containers --tail=200 --prefix || true
          kubectl --context $ctx -n ate-system logs deploy/ate-api-server --all-containers --tail=200 --prefix || true
          kubectl --context $ctx -n ate-system logs deploy/ate-controller --all-containers --tail=200 --prefix || true
