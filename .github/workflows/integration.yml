name: integration

# The suites under tests/ and the examples' tests/, built with the
# integration tag and run as root in the Linux dev container, after the
# unit tests have run there as a non-root user.
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole suite on the commit it releases.
  # Every job checks out the commit the run started from, so a caller
  # cannot hand it another ref.
  workflow_call:

permissions:
  contents: read

jobs:
  linux-env:
    name: Linux dev container (cgroup v2, PSI, criu) + unit tests as uid 1001 + integration suites as root
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts --prefix sdk/typescript
      - run: make linux-check
      # The zygote library's archive, its undefined symbols against the
      # allowlist and its PAC count, before every suite links it.
      - run: hack/dev/run.sh make zygote-check
      - run: make linux-test
