name: ci

# Lint, proto, unit tests and the image build. The integration suites,
# conformance, the examples and fuzzing are workflows of their own
# (integration.yml, conformance.yml, examples.yml, fuzz.yml) with the
# same triggers, and the release calls all five.
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole suite on the commit it releases.
  # Every job checks out the commit the run started from, so a caller
  # cannot hand it another ref.
  workflow_call:

permissions:
  contents: read

jobs:
  proto-drift:
    name: proto lint + generated code up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - run: make proto-check

  lint:
    name: go vet + golangci-lint (depguard keeps pkg/core home-invariant, forbidigo keeps unit tests process-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
            examples/kubernetes/go.sum
      - run: make lint

  image:
    name: build the fiberd image the release publishes (linux/amd64, not pushed)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/fiberd/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=ci
          tags: fiberd:ci
          load: true
          push: false
      - run: docker run --rm fiberd:ci -version

  unit:
    name: unit tests (${{ matrix.os }}, non-root, coverage printed)
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      # Coverage is printed per package for the log only. Nothing fails on it.
      - run: make test TESTFLAGS=-cover

  python:
    name: "python SDK (${{ matrix.os }}, non-root): ruff, the extension built in tree on Linux, pytest unit, the client's messages up to date"
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # cryptography makes the client tests' certificates in process.
      - run: python -m pip install ruff pytest cryptography
      - run: ruff check sdk/python
      # On Linux this compiles fiberd._zygote against sdk/c/template with the
      # hardening flags. Off Linux the package has no extension. The client
      # extra brings grpcio and protobuf, so fiberd.client is tested too.
      - run: python -m pip install -e "sdk/python[client]"
      - run: python -m pytest -q sdk/python
      # Ubuntu's protobuf-compiler is the 3.21 protoc the dev image
      # generates fiberd.client's messages with (make python-proto).
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends protobuf-compiler
      - if: runner.os == 'Linux'
        run: make python-proto-check
