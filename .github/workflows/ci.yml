name: ci

# Lint, proto, unit tests and the image build. The integration suites,
# conformance, the examples and fuzzing are workflows of their own
# (integration.yml, conformance.yml, examples.yml, fuzz.yml) with the
# same triggers, and the release calls all five.
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole suite on the commit it releases.
  # On push and pull_request the ref is empty, so checkout uses its default.
  workflow_call:
    inputs:
      ref:
        description: "Commit to test"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  proto-drift:
    name: proto lint + generated code up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - run: make proto-check

  lint:
    name: go vet + golangci-lint (depguard keeps pkg/core home-invariant, forbidigo keeps unit tests process-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
            examples/kubernetes/go.sum
      - run: make lint

  image:
    name: build the fiberd image the release publishes (linux/amd64, not pushed)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/fiberd/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=ci
          tags: fiberd:ci
          load: true
          push: false
      - run: docker run --rm fiberd:ci -version

  unit:
    name: unit tests (${{ matrix.os }}, non-root, coverage printed)
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      # Coverage is printed per package for the log only. Nothing fails on it.
      - run: make test TESTFLAGS=-cover
