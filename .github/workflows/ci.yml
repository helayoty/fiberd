name: ci

# Lint, proto, unit tests, the image build and the Python/TypeScript packages. The
# integration suites, conformance, the examples and fuzzing are workflows
# of their own (integration.yml, conformance.yml, examples.yml, fuzz.yml)
# with the same triggers, and the release calls all five.
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole suite on the commit it releases.
  # Every job checks out the commit the run started from, so a caller
  # cannot hand it another ref.
  workflow_call:

permissions:
  contents: read

jobs:
  proto-drift:
    name: proto lint + generated code up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - run: make proto-check

  lint:
    name: go vet + golangci-lint (depguard keeps pkg/core home-invariant, forbidigo keeps unit tests process-free)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
            examples/kubernetes/go.sum
      - run: make lint

  image:
    name: build the fiberd image the release publishes (linux/amd64, not pushed)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/fiberd/Dockerfile
          platforms: linux/amd64
          build-args: VERSION=ci
          tags: fiberd:ci
          load: true
          push: false
      - run: docker run --rm fiberd:ci -version

  unit:
    name: unit tests (${{ matrix.os }}, non-root, coverage printed)
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      # Coverage is printed per package for the log only. Nothing fails on it.
      - run: make test TESTFLAGS=-cover

  typescript:
    name: "TypeScript client (${{ matrix.os }}, Node.js ${{ matrix.node }}): types, tests, tarball and proto drift"
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --ignore-scripts --prefix sdk/typescript
      - run: make typescript-test
      - run: npm --prefix sdk/typescript run test:package
      - if: runner.os == 'Linux' && matrix.node == '24'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
      - if: runner.os == 'Linux' && matrix.node == '24'
        run: make typescript-proto-check

  python:
    name: "python SDK (${{ matrix.os }}, CPython ${{ matrix.python }}, non-root): ruff, the extension built in tree on Linux, pytest unit, the client's messages up to date"
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        # The two CPythons the SDK supports. setup-python resolves them
        # from actions/python-versions, which lists 3.15.0 for both runners.
        python: ["3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # cryptography makes the client tests' certificates in process.
      - run: python -m pip install ruff pytest cryptography
      - run: ruff check sdk/python
      # On Linux this compiles fiberd._zygote against sdk/c/template with the
      # hardening flags, and cargo builds the library's Rust core on the
      # stable its rust-toolchain.toml pins. Off Linux the package has no
      # extension. The client
      # extra brings grpcio and protobuf, so fiberd.client is tested too.
      - run: python -m pip install -e "sdk/python[client]"
      - run: python -m pytest -q sdk/python
      # Ubuntu's protobuf-compiler is the 3.21 protoc the dev image
      # generates fiberd.client's messages with (make python-proto), and
      # libprotobuf-dev holds the well-known types grant.proto imports.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - if: runner.os == 'Linux'
        run: make python-proto-check

  python-dist:
    name: "python SDK packaging (${{ matrix.runner }}): the sdist, and the abi3 wheel cibuildwheel builds from it and tests, not published"
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The wheel is built from the sdist, as the release builds it, so a
      # file the sdist misses fails here. cibuildwheel 4.3.1 builds it
      # under CPython 3.14 and tests it under 3.14 and 3.15.0
      # (sdk/python/pyproject.toml).
      - id: sdist
        name: build the sdist
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install build==1.6.1
          python -m build --sdist --outdir dist sdk/python
          echo "path=$(ls dist/fiberd-*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
      # CRIU restores trap on a signed return address on a FEAT_FPAC CPU.
      - if: runner.arch == 'ARM64'
        run: hack/python/pac.sh wheelhouse/*.whl
      # The wheel links the zygote library's Rust core. Its undefined
      # symbols against the allowlist, and its PAC count on arm64.
      - run: make zygote-check
