name: dev-image

# Publishes the dev image once, tagged by hack/dev/image-tag.sh, for
# hack/dev/run.sh to pull. CI jobs then need neither a build nor
# snapshot.debian.org, whose outages used to fail them all at once.
on:
  push:
    branches: [main]
    # Where the inputs of hack/dev/image-tag.sh live.
    paths:
      - docker/dev/**
      - docker/pins/**
      - hack/dev/**
      - .github/workflows/dev-image.yml
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/azure/fiberd-dev

jobs:
  tag:
    name: compute the tag
    # A fork's main, or another branch, must not spend an hour on a build
    # or publish a tag.
    if: github.repository == 'Azure/fiberd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      missing: ${{ steps.tag.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        name: look for the tag in the registry
        shell: bash
        run: |
          set -euo pipefail
          tag=$(bash hack/dev/image-tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # The same hash means the same inputs, so a published tag needs no
          # build. A failed lookup costs a rebuild of the same inputs.
          if docker manifest inspect "$IMAGE:$tag" >/dev/null 2>&1; then
            echo "$IMAGE:$tag is already published"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.platform }}
    needs: tag
    if: needs.tag.outputs.missing == 'true'
    # Native runners, as in the release. Emulating arm64 under QEMU makes
    # the CRIU build many times slower. Only Macs pull arm64 today.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: build and push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/dev/Dockerfile
          platforms: ${{ matrix.platform }}
          # hack/dev/run.sh compares this label with the hash it computes.
          labels: |
            io.fiberd.dev.hash=${{ needs.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
      - name: record the digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tag appears only here, after every platform pushed, so a pull never
  # finds a tag that lacks one.
  publish:
    name: publish the tag
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create the multi-arch tag
        shell: bash
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          refs=()
          for digest in *; do
            refs+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create -t "$IMAGE:$TAG" "${refs[@]}"
      # A private package fails quietly. Fork PRs cannot log in, so every
      # pull would fall back to a build and CI would stay green.
      - name: check that a pull needs no login
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/no-login
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          if ! docker manifest inspect "$IMAGE:$TAG" >/dev/null; then
            echo "::error::$IMAGE:$TAG needs a login. Set the package's visibility to public, then re-run this job."
            exit 1
          fi
