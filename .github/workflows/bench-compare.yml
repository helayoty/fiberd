# The activation comparison (bench/compare, docs/design/compare.md),
# on demand only. Every selected group runs in ONE job on ONE runner,
# because numbers compare only within one run on one host. GitHub's
# ubuntu-24.04 runners are x86_64 and expose /dev/kvm, so the microvm
# group (Firecracker, fiberd Hyperlight) has a real host here. Shared
# runners are noisy, so the runner's facts and load are recorded first
# and sit in every record.
name: bench-compare

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Which isolation classes to run"
        type: choice
        options: [all, shared-kernel, sandboxed, microvm]
        default: all
      runs:
        description: "Timed runs after the discarded cold run"
        type: string
        default: "3"
      bursts:
        description: "Concurrent activations per run, comma separated"
        type: string
        default: "1,10,50"
      runner:
        description: "Runner label (a larger runner can be picked later)"
        type: string
        default: ubuntu-24.04

permissions:
  contents: read

# Two manual runs must not overlap on the same group.
concurrency:
  group: bench-compare
  cancel-in-progress: false

jobs:
  bench:
    name: compare (${{ inputs.groups }}) on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 240
    env:
      COMPARE_GROUPS: ${{ inputs.groups }}
      COMPARE_RUNS: ${{ inputs.runs }}
      COMPARE_BURSTS: ${{ inputs.bursts }}
      COMPARE_FC_KERNEL: ${{ github.workspace }}/bin/fc/vmlinux
      FC_VERSION: v1.17.0
      # From the release's .sha256.txt files, pinned so a changed tarball fails.
      FC_SHA256_X86_64: 06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558
      FC_SHA256_AARCH64: e351ebe4f7a16b5873bbd51005d2e6767103cff4d5ebc829df2d3f95a93e2256
      # A guest kernel from Firecracker's CI bucket. The bucket publishes no
      # checksums, so these were taken on 2026-10-08 and pin what was fetched.
      FC_KERNEL_CI: v1.15
      FC_KERNEL: 6.1.155
      FC_KERNEL_SHA256_X86_64: e20e46d0c36c55c0d1014eb20576171b3f3d922260d9f792017aeff53af3d4f2
      FC_KERNEL_SHA256_AARCH64: e3544b10603acbf3db492cb52e000d22ba202cb4b63b9add027565683e11c591
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            hack/tools/go.sum
            examples/kubernetes/go.sum
            bench/compare/go.sum
      # The Rust toolchain and cargo registry for the Hyperlight helper
      # live in the dev container's named volumes, as in ci.yml.
      - name: runner facts (shared runners are noisy, so they go on the record)
        run: |
          {
            echo "## Runner"
            echo '```'
            echo "cores: $(nproc)"
            grep -m1 "model name" /proc/cpuinfo
            free -h | head -2
            echo "kernel: $(uname -r)"
            echo "load: $(cut -d' ' -f1-3 /proc/loadavg)"
            ls -l /dev/kvm 2>/dev/null || echo "kvm: absent"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: enable KVM for this runner
        if: inputs.groups == 'all' || inputs.groups == 'microvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        if: inputs.groups != 'microvm'
        with:
          version: v0.30.0
          install_only: true
      # Firecracker and a guest kernel, the steps of
      # bench/compare/run/kvm-host.sh that apply to a runner.
      - name: install Firecracker and a guest kernel
        if: inputs.groups == 'all' || inputs.groups == 'microvm'
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q e2fsprogs iptables bc file
          arch=$(uname -m); mkdir -p bin/fc && cd bin/fc
          case "$arch" in
            x86_64) sum=$FC_SHA256_X86_64 ;;
            aarch64) sum=$FC_SHA256_AARCH64 ;;
            *) echo "no pinned Firecracker for $arch" >&2; exit 1 ;;
          esac
          curl -fsSLo fc.tgz "https://github.com/firecracker-microvm/firecracker/releases/download/$FC_VERSION/firecracker-$FC_VERSION-$arch.tgz"
          echo "$sum  fc.tgz" | sha256sum -c -
          tar xzf fc.tgz && sudo install -m 0755 "release-$FC_VERSION-$arch/firecracker-$FC_VERSION-$arch" /usr/local/bin/firecracker
          firecracker --version
          case "$arch" in
            x86_64) ksum=$FC_KERNEL_SHA256_X86_64 ;;
            aarch64) ksum=$FC_KERNEL_SHA256_AARCH64 ;;
          esac
          curl -fsSLo vmlinux "https://s3.amazonaws.com/spec.ccfc.min/firecracker-ci/$FC_KERNEL_CI/$arch/vmlinux-$FC_KERNEL"
          echo "$ksum  vmlinux" | sha256sum -c -
      - name: build the Hyperlight helper
        if: inputs.groups == 'all' || inputs.groups == 'microvm'
        run: make hyperlight-helper
      - name: unit tests of the harness
        run: cd bench/compare && go test -race -count=1 ./...
      - name: run the comparison
        run: make compare-phase4
      - name: median table
        if: always()
        run: |
          {
            echo "## Results (medians of ${COMPARE_RUNS} runs, cold run discarded)"
            cd bench/compare && go run ./cmd/summarize -markdown ../../bin/compare-state/phase*/*.jsonl
          } >> "$GITHUB_STEP_SUMMARY" || echo "no results to summarize" >> "$GITHUB_STEP_SUMMARY"
      # The runner's systemd-coredump keeps the core of a node process that
      # died on a signal. A Go core opens in dlv beside its own binary.
      - name: keep containerd's core on failure
        if: failure()
        run: |
          sudo coredumpctl list --no-pager 2>/dev/null | tail -n 20 || true
          sudo coredumpctl info --no-pager containerd 2>/dev/null | head -n 80 || true
          mkdir -p bin/compare-state/cores
          sudo coredumpctl dump --no-pager -o bin/compare-state/cores/containerd.core containerd >/dev/null 2>&1 || true
          bin=$(docker exec compare-control-plane sh -c 'command -v containerd' 2>/dev/null) &&
            docker cp "compare-control-plane:$bin" bin/compare-state/cores/containerd || true
      - name: make the state readable for the upload (Firecracker ran as root)
        if: always()
        run: sudo chmod -R a+rX bin/compare-state 2>/dev/null || true
      - name: keep the raw records and the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compare-${{ inputs.groups }}-${{ github.run_id }}
          path: |
            bin/compare-state/**/*.jsonl
            bin/compare-state/**/summary.txt
            bin/compare-state/host.txt
            bin/compare-state/cores/*
          if-no-files-found: warn
      # Every Pod of the compare namespace, not a fixed list, so a home
      # that never became ready (a grant Pod of any runtime, the client)
      # shows its log and its events too.
      - name: cluster state on failure
        if: failure()
        run: |
          kc="kubectl --context kind-compare"
          $kc get pods -A -o wide || true
          $kc -n compare get cg -o yaml || true
          $kc -n compare get events --sort-by=.lastTimestamp || true
          for pod in $($kc -n compare get pods -o name 2>/dev/null); do
            echo "::group::$pod describe"
            $kc -n compare describe "$pod" || true
            echo "::endgroup::"
            echo "::group::$pod logs"
            $kc -n compare logs "$pod" --all-containers --tail=200 || true
            # A crashed agent's fatal line comes before its goroutines.
            $kc -n compare logs "$pod" --all-containers --previous 2>/dev/null | head -n 60 || true
            $kc -n compare exec "$pod" -c agent -- sh -c 'cat /sys/fs/cgroup/pids.max /sys/fs/cgroup/pids.current /sys/fs/cgroup/pids.events /proc/sys/kernel/threads-max' 2>/dev/null || true
            echo "::endgroup::"
            # A runc grant Pod keeps runc's own log beside the bundle and the
            # zygote log in the grant's run directory (pkg/backend/runc). Any
            # other Pod has neither, and the exec fails quietly.
            echo "::group::$pod runc and zygote logs"
            # shellcheck disable=SC2016  # $f expands in the Pod
            $kc -n compare exec "$pod" -c agent -- sh -c \
              'for f in /var/lib/fiberd/runc/bundles/*.runc.log /run/fiberd/*/zygote.log; do [ -f "$f" ] || continue; echo "--- $f"; tail -c 4096 "$f"; done' 2>/dev/null || true
            echo "::endgroup::"
          done
          # The node's own view: a containerd or kubelet crash, or an OOM kill.
          echo "::group::node journal"
          docker inspect -f 'node image {{.Config.Image}}' compare-control-plane 2>/dev/null || true
          docker exec compare-control-plane containerd --version 2>/dev/null || true
          docker exec compare-control-plane runc --version 2>/dev/null | head -n 1 || true
          # Every restart lists each surviving shim twice, which buries the
          # lines that matter, so those are dropped before the cap.
          noise="remains running|Found left-over process|This usually indicates unclean termination"
          # systemd's own lines say how containerd ended (exit status or signal).
          docker exec compare-control-plane journalctl -u containerd --since "-20min" --no-pager -o short-precise 2>/dev/null \
            | grep -E "systemd\[1\]|level=(fatal|panic)|panic:|fatal error|goroutine [0-9]+ \[running\]|SIG[A-Z]+:" \
            | grep -vE "$noise" | head -n 120 || true
          # The first lines of a Go crash name the cause.
          docker exec compare-control-plane journalctl -u containerd --since "-20min" --no-pager 2>/dev/null \
            | grep -E -A30 "panic:|fatal error" | head -n 60 || true
          # A SIGSEGV that bypasses Go's handler leaves no trace, only what
          # containerd logged just before it died.
          docker exec compare-control-plane journalctl -u containerd --since "-20min" --no-pager -o short-precise 2>/dev/null \
            | grep -vE "$noise" | grep -B25 "Main process exited" | head -n 120 || true
          docker exec compare-control-plane systemctl show containerd -p NRestarts -p ExecMainStatus -p Result 2>/dev/null || true
          # journald says when its rate limit dropped a service's lines.
          docker exec compare-control-plane journalctl --since "-20min" --no-pager 2>/dev/null \
            | grep -E "Suppressed [0-9]+ messages" | tail -n 20 || true
          # The runner's kernel decides where a node process's core dump goes.
          echo "core_pattern $(cat /proc/sys/kernel/core_pattern 2>/dev/null)"
          # The node shares the runner's kernel, which logs the faulting address.
          sudo dmesg 2>/dev/null | grep -iE "oom|killed process|segfault|traps:" | tail -n 20 || true
          echo "::endgroup::"
          sudo tail -n 50 bin/compare-state/phase4/fc-work/*.log 2>/dev/null || true
      - name: delete the compare cluster
        if: always()
        run: make compare-down || true
